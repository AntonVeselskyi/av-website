<!DOCTYPE html>
<html lang="en">
<head>
<link href="https://fonts.googleapis.com/css2?family=Major+Mono+Display&family=Poiret+One&display=swap" rel="stylesheet">
<meta charset="UTF-8">
<title>Secret Access Portal</title>
<style>
    :root
    {
    --rainbow: linear-gradient(
      90deg,
      #ff004d 0%,
      #ff7a00 12%,
      #ffd300 25%,
      #4cff00 38%,
      #00d4ff 52%,
      #6a00ff 65%,
      #ff00b3 78%,
      #ff004d 100%
    );
    --rainbow-duration: 5s;
  }

  body
  {
    background-color: #0b0c10;
    color: #66fcf1;
    font-family: 'Courier New', monospace;
    text-align: center;
    padding-top: 120px;
    overflow: hidden;
    user-select: none;
  }

  /* Typing animation */
  h1
  {
    font-family: 'Major Mono Display', monospace;
    display: inline-block;
    border-right: 4px solid #66fcf1;
    white-space: nowrap;
    overflow: hidden;
    letter-spacing: 2.5px;
    font-weight: normal;
    font-size: 1.952rem;
    animation: caret 0.8s step-end infinite;
  }

  @keyframes caret
  {
    50% { border-color: transparent; }
  }

  .code-box
  {
    display: flex;
    justify-content: center;
    gap: 15px;
    margin-top: 61px;
  }

  .slot
  {
    font-family: 'Major Mono Display', monospace;
    width: 61px;
    height: 73px;
    border: 2.5px solid #45a29e;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.44rem;
    text-transform: uppercase;
    color: #66fcf1;
    position: relative;
    overflow: hidden;
    transition: all 0.2s ease;

    --glow-color: #45a29e;  /* default glow color */
    --charge-glow: rgba(69, 162, 158, 0.9);    /* edge flash color */
    --charge-fill: rgba(69, 162, 158, 0.18);   /* inside-light color */
  }

  .slot.empty
  {
    color: #1f2833;
  }

  .slot.active
  {
    animation: pulse 1s infinite;
  }

  /* Make a button look exactly like a .slot */
  .slot-btn
  {
    appearance: none;
    background: transparent;
    border: 2.5px solid #45a29e;   /* keep in sync with .slot */
    color: #66fcf1;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font: inherit;
    width: 61px;           /* same as .slot */
    height: 73px;          /* same as .slot */
    text-transform: uppercase;
    user-select: none;
    transition: transform 0.08s ease, box-shadow 0.2s ease;
  }
  .slot-btn:hover { box-shadow: 0 0 23px #45a29e80; }
  .slot-btn:active { transform: translateY(1px) scale(0.98); }
  .slot-btn:focus-visible { outline: 2px solid #66fcf1; outline-offset: 3px; }

  body.stars-active .slot
  {
    background-color: #0b0c10;
  }

  /* physics support */
  .code-box.physics
  {
    position: relative;
    height: min(32vh, 366px); /* give them room to fall; tweak as you like */
    cursor: crosshair;
  }

/* Allow absolute positioning and transforms while in physics mode */
.slot.physics
{
  position: absolute;
  will-change: transform;
  transform-origin: center center;
  transition: none !important;
}

  @keyframes pulse
  {
    0%, 100% {
      box-shadow: 0 0 6px var(--glow-color, #45a29e);
    }
    50% {
      box-shadow: 0 0 23px var(--glow-color, #45a29e);
    }
  }

  /* Charge-up animation */
  /* LED-style flash on the whole box */
  @keyframes charge {
    0% {
      filter: brightness(1);
      box-shadow: 0 0 0 rgba(255, 255, 255, 0);
    }
    40% {
      filter: brightness(1.7);
      box-shadow: 0 0 26px var(--charge-glow, rgba(69, 162, 158, 0.9));
    }
    100% {
      filter: brightness(1);
      box-shadow: 0 0 0 rgba(255, 255, 255, 0);
    }
  }

  /* edge flash (stagger controlled via --charge-delay) */
  .slot.is-charging {
    animation: charge 0.25s ease-out var(--charge-delay, 0s) forwards;
  }

  .slot::before {
    content: '';
    position: absolute;
    inset: 0;
    background: var(--charge-fill);
    opacity: 0;
    pointer-events: none;
  }

  @keyframes charge-fill {
    0%   { opacity: 0; }
    30%  { opacity: 1; }   /* fast pop-in */
    100% { opacity: 0; }   /* fade out */
  }

  /* when charging, do BOTH: edge flash (element) + inner flash (::before) */
  .slot.is-charging::before {
    animation: charge-fill 0.45s ease-out var(--charge-delay, 0s) forwards;
  }

  /* quick LED pop whenever a new character is typed */
  .slot.key-flash {
    animation: charge 0.42s ease-out;
  }

  /* rainbow boxes: keep rainbow-slide even while flashing */
  .rainbow-box.key-flash {
    animation:
      rainbow-slide var(--rainbow-duration) linear infinite,
      charge 0.42s ease-out;
  }

  .rainbow-box.is-charging {
    animation:
      rainbow-slide var(--rainbow-duration) linear infinite,
      charge 0.25s ease-out var(--charge-delay, 0s) forwards;
  }

  @keyframes charged-blink
  {
  0%, 100% {
    background-color: transparent;
    box-shadow: none;
  }
  50% {
    background-color: rgba(75, 208, 241, 0.774);
    box-shadow: 0 0 31px rgba(75, 208, 241, 0.774);
  }
}

  #hiddenInput {
    opacity: 0;
    position: absolute;
    pointer-events: none;
  }

  .hint {
    opacity: 0; /* starts out invisible */
    margin-top: 20px;
    font-size: 1.6rem;
    color: #c5c6c7;
    white-space: pre-line
  }
  .hint.visible {
  opacity: 1; /* fades in smoothly */
  animation: caret 0.8s step-end infinite;
}

  /* -------------------------
     Rainbow styles (minimal additions)
     ------------------------- */
  @keyframes rainbow-slide {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  /* gradient for clipped text (title + hint) */
  .rainbow-text {
    background: var(--rainbow);
    background-size: 300% 300%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: rainbow-slide var(--rainbow-duration) linear infinite;
    /* keep caret visible via border-right */
    border-right-color: rgba(255,255,255,0.9);

     /* let pulse animation use dynamic hue */
     --glow-color: currentColor;
  }

  /* gradient for boxes — also clip text inside them so letters show gradient */
  .rainbow-box
  {
    background: var(--rainbow);
    background-size: 300% 300%;
    animation: rainbow-slide var(--rainbow-duration) linear infinite;
    color: transparent;
    -webkit-background-clip: text;
    background-clip: text;
    border-color: rgba(255,255,255,0.08);
    box-shadow: 0 8px 28px rgba(0,0,0,0.55);

    --charge-glow: rgba(255, 255, 255, 0.95);  /* brighter edge in colorful */
    --charge-fill: rgba(255, 255, 255, 0.38);  /* soft white inner flash */
  }

  /* respect reduced motion */
  @media (prefers-reduced-motion: reduce) {
    .rainbow-text, .rainbow-box { animation: none; background-position: 50% 50%; }
  }

  #infinityBadge {
    display: none;
    margin-left: 8px;
    font-family: 'Major Mono Display', monospace;
    font-size: 4.2rem;
    color: #66fcf1;
    vertical-align: top;
  }
  #infinityBadge.active { display: inline; }

 .purple-curve
 {
  color: #b300ff;            /* dark magenta-purple */
  font-style: italic;
  font-family: "Poiret One", cursive;
  display: inline-block;
  transform: rotate(-2deg);
  text-shadow: 0 0 13px rgba(179, 0, 255, 0.6);
  font-size: 4.9rem;
  }

canvas
{
  position: fixed;
  inset: 0;           /* top:0; right:0; bottom:0; left:0 */
  width: 100vw;
  height: 100vh;
  z-index: 0; /* baseline */
  pointer-events: none; /* lets clicks go to your inputs/slots */
  display: block;
}
#stars-bg{ z-index: 0; }
#stars-fg{ z-index: 999; }

</style>
</head>
<body>
  <canvas id="stars-bg" aria-hidden="true"></canvas>

  <!-- <div id="ui-layer" class="ui-layer"> -->
    <h1 id="title"></h1>
    <div class="code-box" id="codeBox">
      <div class="slot empty">◆</div>
      <div class="slot empty">◆</div>
      <div class="slot empty">◆</div>
      <div class="slot empty">◆</div>
      <div class="slot empty">◆</div>
      <div class="slot empty">◆</div>
      <div class="slot empty">◆</div>
      <div class="slot empty">◆</div>
    </div>

    <input id="hiddenInput" type="text" maxlength="13" autofocus />
    <span id="infinityBadge" aria-hidden="true">∞</span>
    <p class="hint" id="hint"></p>
  <!-- </div> -->

  <canvas id="stars-fg" aria-hidden="true"></canvas>

<script src="https://cdn.jsdelivr.net/npm/matter-js@0.19.0/build/matter.min.js"></script>
<script>
  const hiddenInput = document.getElementById('hiddenInput');
  const slots = document.querySelectorAll('.slot');
  const titleEl = document.getElementById('title');
  const codeBox = document.getElementById('codeBox');

  const fullTitle = "Access coDe ReqUieReD to pRoceeD";
  let titleIndex = 0;
  // Typewriter effect for the title
  function typeTitle()
  {
    if (titleIndex < fullTitle.length) {
      titleEl.textContent = fullTitle.slice(0, titleIndex + 1);
      titleIndex++;
      setTimeout(typeTitle, 80); // typing speed
    }
  }
  typeTitle();

  let infinityMode = false;
  const infinityBadge = document.getElementById('infinityBadge');
  function enableInfinityMode()
  {
    infinityMode = true;
    renderStars();
    infinityBadge.classList.add('active');
    document.body.classList.add('stars-active');
    typeHint("keep typing");
  }

  // diamond variants
  const diamondChars =
  [
    "◆", // Black Diamond
    "◇", // White Diamond
    "◈", // White Diamond Containing Black Small Diamond
    "♢", // White Diamond Suit
    "♦", // Black Diamond Suit
    "❖", // Black Diamond Minus White X
    "⟐", // White Diamond With Centred Dot
    "⟡", // White Concave-sided Diamond
    "⬖", // Diamond With Left Half Black
    "⬗", // Diamond With Right Half Black
    "⬘", // Diamond With Top Half Black
    "⬙", // Diamond With Bottom Half Black
  ];
  let diamond_char = diamondChars[Math.floor(Math.random() * diamondChars.length)];


  function updateDisplay(value)
  {
    const chars = value.toUpperCase().split('');

    slots.forEach((slot, i) =>
    {
      const prevChar = slot.dataset.char || '';
      const newChar = chars[i] || '';

      if (newChar)
      {
        slot.textContent = newChar;
        slot.classList.remove('empty', 'active');


         // remember this char in dataset
        slot.dataset.char = newChar;

        // LED pop on NEW letter
        if (newChar !== prevChar)
        {
          slot.classList.remove('key-flash');
          void slot.offsetWidth;        // force reflow to restart animation
          slot.classList.add('key-flash');
        }

        // if infinity mode is on and starfield exists,
        // spawn particles when this slot first gets / changes a letter
        if (infinityMode && typeof starField !== 'undefined' && starField && newChar !== prevChar)
        {
          starField.spawnFromSlot(slot);
        }
      }
      else
      {
        slot.classList.remove('key-flash');
        slot.textContent = diamond_char;
        slot.classList.add('empty');
        slot.dataset.char = '';
      }

      // highlight current active slot
      if (i === chars.length && chars.length < 8)
      {
        slot.classList.add('active');
      }
      else
      {
        slot.classList.remove('active');
      }
    });
  }

  // Code to unlock the page
  const CORRECT_CODE =  "ACCESSOK";
  const HINT_CODE =     "HINTHINT";
  const COLOR_CODE =    "COLORFUL";
  const BACK_CODE =     "BACKBACK";
  const IVO_CODE =      "IVOXYGEN";
  const PEEP_CODE =     "LIL'PEEP";
  const SB_CODE =       "$BOY$G59";
  const PHYSX_CODE =    "GRAVDROP";
  const RSET_CODE =     "RESET'ME";
  const INF_CODE =      "INFINITY";
  const D2_CODE =       "DOTABUFF";
  const CN_CODE =       "CPPNORTH";
  const WR_CODE =       "WONDERER";
  const LWRCODE =       "LOWER'ME";

  const AM_LINE = `My blades are an extension of my hands, my hands are an extension of my will.
My emotions are a reflection of my actions, not the driver of them,
and my mind is focused on the task at hand, because a divided mind is a weak mind
and this is the creed of the Anti-Mage and this is the law of the hunt.


<span class="purple-curve">Boom, suck it, meditation.</span>
`;

  const REDIRECT_URL = "access.html"; // <-- page to go to when correct
  const AV_URL = "https://antonveselskyi.com"; // <-- page to go to when correct
  const IVO_URL = "https://youtu.be/_9Un6sPR7ow?si=Kbj9u7Y8bh2O9PUt";
  const PEEP_URL = "https://youtu.be/6GAoLQGdZHY?si=xcvZm9rsg1Z12Enz&t=87";
  const PEEP2_URL = "https://youtu.be/T5OR0VhwGRc?si=jH50L_Jba5g_VY-m";
  const SB_URL = "https://www.youtube.com/watch?v=mSVYHrc4baU";
  const D2_URL = "https://stratz.com/players/93747916";
  const CN_URL = "https://www.youtube.com/watch?v=OVhX0uhwCz0";

  const hintElement = document.getElementById('hint');
  function typeHint(text, speed = 60)
  {
    hintElement.classList.add('visible');
    hintElement.innerHTML = '';
    let i = 0;
    function typeNext()
    {
      if (i < text.length)
      {
        // If we encounter a tag start, append the whole tag instantly
        if (text[i] === '<')
        {
          const close = text.indexOf('>', i);
          if (close !== -1)
          {
            // append the full tag without delay
            hintElement.innerHTML += text.slice(i, close + 1);
            i = close + 1;
            typeNext(); // immediately continue without delay
            return;
          }
        }

        hintElement.innerHTML = text.slice(0, i + 1);
        i++;
        setTimeout(typeNext, speed); // typing speed
      }
    }

    typeNext();
  }

  // Apply rainbow classes to title, slots and hint
  function applyRainbow()
  {
    titleEl.classList.add('rainbow-text');
    hintElement.classList.add('rainbow-text');
    infinityBadge.classList.add('rainbow-text');
    slots.forEach(s => s.classList.add('rainbow-box'));
  }

  function openInNewTab(url)
  {
    startChargeAnimation();
    setTimeout(() =>
     {
             window.open(url, '_blank')
     }, 1950);
    setTimeout(resetAfterCharge, 2050);
  }

  function playAudioThen(src, cb)
  {
    const audio = new Audio(src);
    let fired = false;

    function done() {
      if (fired) return;
      fired = true;
      cb?.();
    }

    audio.addEventListener('ended', done, { once: true });
    audio.addEventListener('error', done, { once: true });
    audio.play().catch(done);
  }

  function showSlotButton(label, onClick)
  {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'slot slot-btn';
    btn.textContent = label;

    // accessibility: Space/Enter click
    btn.addEventListener('click', onClick);
    btn.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); btn.click(); }
    });

    // place under the hint
    const holder = document.createElement('div');
    holder.style.marginTop = '14px';
    holder.appendChild(btn);
    hintElement.appendChild(holder);
    return btn;
  }


  let failedAttemps = 0;
  hiddenInput.addEventListener('input', () =>
  {
    value = hiddenInput.value.trim().toUpperCase();
    updateDisplay(value);
    value = value.replace(/[ _-]+/g, "'");

    if (value.length === 8)
    {
        // Let the last character sit for a short moment
        if (value === HINT_CODE)
        {
            typeHint("it will take <b>infinity</b> for you to guess the code");
            setTimeout(shakeError, 1100);
        }
        else if (value === WR_CODE)
        {
          typeHint("wonderer, you r lost, go back-back where u came from");
          setTimeout(shakeError, 1100);
        }
        else if (value === IVO_CODE)
        {
            typeHint("E-e-e, ah-ah-ah, e-e-e-e-e-e")
            openInNewTab(IVO_URL)
        }
        else if (value === PEEP_CODE)
        {
            typeHint("crybaby");
            const randomPeepUrl = Math.random() < 0.5 ? PEEP_URL : PEEP2_URL;
            openInNewTab(randomPeepUrl);
        }
        else if (value === SB_CODE)
        {
            typeHint("G59 till the day I die");
            openInNewTab(SB_URL)
        }
        else if (value === CN_CODE)
        {
            typeHint("me talking");
            openInNewTab(CN_URL)
        }
        else if (value === D2_CODE)
        {
            typeHint(AM_LINE, 36);
            playAudioThen("audio/Vo_antimage_amp_wei_enter_meditation_06_03.mp3.mpeg", () =>
            {
              resetAfterCharge();
              showSlotButton('→', () => { openInNewTab(D2_URL); });
            });
        }
        else if (value === RSET_CODE)
        {
            typeHint("here we go again");
            setTimeout(() => { window.location.reload() }, 1333);
        }
        else if (value === INF_CODE)
        {
            startChargeAnimation();
            setTimeout(() =>
            {
                enableInfinityMode();
                resetAfterCharge();
            }, 1800);

        }
        else if (value === LWRCODE)
        {
          startChargeAnimation();
            setTimeout(() =>
            {
              resetAfterCharge();   // clears slots back to diamonds
              typeHint("going down");
              lowerOnce();
            }, 1800);
        }
        else if (value === PHYSX_CODE)
        {
            startChargeAnimation();
            setTimeout(() =>
            {
                typeHint("free fall");
                resetAfterCharge();
                enablePhysics();
            }, 1800);
        }
        else if (value === COLOR_CODE)
        {
            startChargeAnimation();
            setTimeout(() =>
            {
                applyRainbow();
                resetAfterCharge();
            }, 1800);
        }
        else if (value === BACK_CODE)
        {
            startChargeAnimation();
            setTimeout(() =>
            {
                window.location.replace(AV_URL);
            }, 1500);
        }
        else if (value === CORRECT_CODE)
        {
          startChargeAnimation();
          setTimeout(resetAfterCharge, 1800);
        }
        else
        {
          setTimeout(() =>
          {
            shakeError()
            failedAttemps++;
            if (failedAttemps == 3)
              typeHint("You have no idea what the code is, right?");
            else if (failedAttemps == 5)
              typeHint("No luck? Looks like you need a tip (<b>hint-hint</b>)");
          }, 600);
        }
      }
  });

  // Always keep focus on the hidden input whenever page is active
  function refocus()
  {
      if (document.hasFocus())
      {
          hiddenInput.focus();
      }
  }
  // Refocus on any click, focus, or keypress anywhere
  ['click', 'focus', 'keydown', 'pointerdown'].forEach(evt =>
  {
      document.addEventListener(evt, refocus, true);
  });
  // Initial focus
  refocus();

  updateDisplay('');
  hiddenInput.focus();

  // Error feedback (optional)
  function shakeError()
  {
    document.body.style.animation = "shake 0.3s";
    setTimeout(() => document.body.style.animation = "", 300);
    resetAfterCharge()
  }

  function redirectAfterDelay(URL, delay)
  {
    setTimeout(() =>
    {
      window.location.href = REDIRECT_URL;
    }, 1500);
  }

  // Charging animation for correct code
  function startChargeAnimation()
  {
    slots.forEach((slot, i) =>
    {
      //slot.style.animation = `charge 0.8s ease-in-out ${i * 0.1}s forwards`;

      // stagger like before
      slot.style.setProperty('--charge-delay', `${i * 0.1}s`);

      // restart animation cleanly if we charge again
      slot.classList.remove('is-charging');
      void slot.offsetWidth; // force reflow
      slot.classList.add('is-charging');
    });

      // Calculate total time for all charges to finish
    const totalDuration = 0.8 + (slots.length - 1) * 0.1;

    // After all charged, trigger one simultaneous blink
    setTimeout(() =>
    {
      slots.forEach(slot =>
      {
        slot.classList.remove('is-charging');
        slot.style.animation = 'charged-blink 0.25s ease-in-out';
      });
    }, totalDuration * 1000);
  }

  function resetAfterCharge()
  {
    // pick a random diamond symbol
    diamond_char = diamondChars[Math.floor(Math.random() * diamondChars.length)];

    // clear animations and revert visuals after charging finishes
    slots.forEach((slot) =>
    {
      slot.classList.remove('is-charging', 'key-flash');
      slot.style.removeProperty('--charge-delay');
      slot.style.animation = "";
    });
    hiddenInput.value = "";
    updateDisplay("");
  }

  // Shake animation keyframes
  const style = document.createElement('style');
  style.textContent = `
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20%, 60% { transform: translateX(-13px); }
    40%, 80% { transform: translateX(13px); }
  }`;
  document.head.appendChild(style);

  // --- Physics state ---
  let physics =
  {
    enabled: false,
    engine: null,
    bodies: [],
    ground: null,
  };

  function enablePhysics()
  {
    if (physics.enabled) { return; }
    const { Engine, World, Bodies } = Matter;

    const slotsArr = Array.from(slots);

    // Freeze layout -> switch to absolute positioning at current spots
    codeBox.classList.add('physics');

    const boxRect = codeBox.getBoundingClientRect();
    const slotRects = slotsArr.map(el => el.getBoundingClientRect());

    // Flip each slot to absolute, keeping same on-screen position
    slotsArr.forEach((el, i) =>
    {
      el.classList.add('physics');
      const r = slotRects[i];
      const left = r.left - boxRect.left;
      const top  = r.top  - boxRect.top;

      el.style.left = `${left}px`;
      el.style.top  = `${top}px`;
      el.style.width  = `${r.width}px`;
      el.style.height = `${r.height}px`;
    });

    // Setup Matter engine
    const engine = Engine.create({ gravity: { x: 0, y: 0.55 } });

    // Create bodies for each slot
    const bodies = slotsArr.map((el, i) =>
    {
      const r = slotRects[i];
      const x = r.left - boxRect.left + r.width  / 2;
      const y = r.top  - boxRect.top  + r.height / 2;
      const isJumpy  = (i === 0 || i == 3 || i === slotsArr.length - 1);

      const body = Bodies.rectangle(x, y, r.width, r.height, {
        restitution: isJumpy  ? .9 : 0.25,   // bounciness
        friction: isJumpy ? 0.12 : 0.35,
        frictionStatic: 0.2,
        frictionAir: isJumpy  ? 0.004 : 0.03,
        chamfer: 4,
        angle: (Math.random() - 0.5) * 0.05,
      });
      return body;
    });

    // Invisible bounds: ground + side walls
    const w = boxRect.width;
    const h = codeBox.clientHeight;

    const leftWall  = Bodies.rectangle(-20, h/2, 40, h*2, { isStatic: true });
    const rightWall = Bodies.rectangle(w+20, h/2, 40, h*2, { isStatic: true });
    const topWall   = Bodies.rectangle(w / 2, -10, w, 2, { isStatic: true });


    // Lower ground so we see bounces clearly
    const ground = Bodies.rectangle(w / 2, h - 1, w, 2,
    {
      isStatic: true,
      friction: 0.35,
      restitution: 0.25
    });
    World.add(engine.world, [ ...bodies, ground, leftWall, rightWall, topWall ]);

    bodies.forEach((b, i) =>
    {
      if (i === 0 || i === bodies.length - 1)
      {
        // small upward nudge + a bit of spin
        Matter.Body.applyForce(b, b.position, { x: 0, y: -0.007 });
        Matter.Body.setAngularVelocity(b, (Math.random() < 0.5 ? -1 : 1) * 0.002);
      }

      if (i == 3)
      {
        Matter.Body.setAngularVelocity(b, (Math.random() < 0.5 ? -1 : 1) * 0.006);
      }
    });

    // Sync DOM per frame
    const sync = () =>
    {
      bodies.forEach((b, i) =>
      {
        const el = slotsArr[i];
        const x = b.position.x - (parseFloat(el.style.left) + (parseFloat(el.style.width)/2));
        const y = b.position.y - (parseFloat(el.style.top)  + (parseFloat(el.style.height)/2));
        el.style.transform = `translate(${x}px, ${y}px) rotate(${b.angle}rad)`;
      });
    };

    let last = performance.now();
    function loop(t)
    {
      const dt = Math.min(1000/30, t - last); // clamp big stalls
      last = t;
      Matter.Engine.update(engine, dt);
      sync();
      physics._raf = requestAnimationFrame(loop);
    }
    physics._raf = requestAnimationFrame(loop);

    // Save state for disable
    physics.enabled = true;
    physics.engine = engine;
    physics.bodies = bodies;
    physics.ground = ground;


    // --- CLICK/TAP EXPLOSION ---
    const blastRadius = 191;     // px
    const blastForce  = 0.13;   // tune strength

    function blastAt(localX, localY)
    {
      bodies.forEach(b => {
        const dx = b.position.x - localX;
        const dy = b.position.y - localY;
        const dist = Math.hypot(dx, dy) || 0.0001;
        if (dist > blastRadius) return;

        const nx = dx / dist, ny = dy / dist;           // outward normal
        const falloff = (1 - dist / blastRadius) ** 2;  // smooth falloff
        // scale by mass so all boxes feel similar kick
        const f = blastForce * falloff * b.mass;
        Matter.Body.applyForce(b, b.position, { x: nx * f, y: ny * f });
      });
    }

    // Pointer handler
    function onPointer(e)
    {
      const rect = codeBox.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      blastAt(x, y);
      // optional ripple
      makeRipple(codeBox, x, y);
    }
    codeBox.addEventListener('pointerdown', onPointer);

      // simple ripple effect (optional)
    function makeRipple(root, x, y)
    {
      const r = document.createElement('span');
      r.style.position = 'absolute';
      r.style.left = `${x - 4}px`;
      r.style.top  = `${y - 4}px`;
      r.style.width = r.style.height = '8px';
      r.style.border = '3px solid rgba(102,252,241,0.6)';
      r.style.borderRadius = '999px';
      r.style.pointerEvents = 'none';
      r.style.transform = 'translate(-50%,-50%)';
      r.style.transition = 'transform 350ms ease, opacity 350ms ease';
      r.style.opacity = '0.9';
      root.appendChild(r);
      requestAnimationFrame(() =>
      {
        r.style.transform = 'translate(-50%,-50%) scale(9)';
        r.style.opacity = '0';
      });
      setTimeout(() => r.remove(), 380);
  }
}

// Lowering
  const elementsToLower =
  [
    codeBox,
    hiddenInput,
    infinityBadge,
    hintElement
  ];

  let lowerCount = 0;
  const MAX_LOWER = 2;

  function lowerOnce()
  {
    if (lowerCount >= MAX_LOWER)
    {
      typeHint("can't go any lower");
      shakeError();
      return;
    }

    lowerCount++;

    const boxHeight = codeBox.offsetHeight;
    const shift = boxHeight * 1.5;  // how far we drop this step

    const slotsArr = Array.from(slots);
    const lastIndex = slotsArr.length - 1;

    const duration  = 600; // ms
    const delayStep = 70;  // ms between “layers” from edges
    const easing    = 'cubic-bezier(0.22, 0.7, 0.08, 1.0)'; // heavy rope feel

    // 1) Move EVERYTHING (box, input, badge, hint) down immediately
    elementsToLower.forEach(el =>
    {
      const current = parseFloat(getComputedStyle(el).marginTop) || 0;
      el.style.marginTop = (current + shift) + 'px';
    });

    // 2) Instantly offset slots back up so visually nothing moved yet
    slotsArr.forEach(slot =>
    {
      slot.style.transition = 'none';
      slot.style.transform = `translateY(${-shift}px)`;
    });

    // 3) Next frame: animate slots down from edges towards center
    requestAnimationFrame(() =>
    {
      requestAnimationFrame(() =>
      {
        slotsArr.forEach((slot, i) =>
        {
          const edgeIndex = Math.min(i, lastIndex - i); // 0,0,1,1,2,2,...
          const delay = edgeIndex * delayStep;

          slot.style.transition =
            `transform ${duration}ms ${easing} ${delay}ms`;
          slot.style.transform = 'translateY(0)'; // fall into new layout
        });

        const maxEdgeIndex = Math.floor(slotsArr.length / 2);
        const totalTime = duration + maxEdgeIndex * delayStep;

        // 4) After animation, clean up styles
        setTimeout(() =>
        {
          slotsArr.forEach(slot =>
          {
            slot.style.transition = '';
            slot.style.transform = '';
          });
        }, totalTime + 40);
      });
    });
  }

// Starfield effect adapted from yonatan – original CodePen: https://codepen.io/ybensira/pen/byYNBZ (MIT License)
// Rewritten to be dependency-free (no GSAP / TweenMax / lodash)
/**
 * Utility function for returning a random integer in a given range
 * @param {Int} max
 * @param {Int} min
 */
const randomInRange = (max, min) =>
  Math.floor(Math.random() * (max - min + 1)) + min
const ACTIVE_PROBABILITY = 0
const BASE_SIZE = 1
const VELOCITY_INC = 1.01
const VELOCITY_INIT_INC = 1.03
const JUMP_VELOCITY_INC = 1.25
const JUMP_SIZE_INC = 1.15
const SIZE_INC = 1.01
const RAD = Math.PI / 180
const WARP_COLORS =
[
  [197, 239, 247],
  [25, 181, 254],
  [77, 5, 232],
  [165, 55, 253],
  [255, 255, 255],
]
// when a star is “close enough” to go in front
// biggest are like 7ish
const FG_SIZE_THRESHOLD = 3.8;
const CHARGE_VELOCITY = 1.001
const SLOT_STAR_VELOCITY = 1.007
const SLOT_STAR_SIZE_INC = 1.003

/**
 * Class for storing the particle metadata
 * position, size, length, speed etc.
 */
class Star
{
  STATE =
  {
    alpha: Math.random(),
    angle: randomInRange(0, 360) * RAD,
  }

  // picks a random direction, picks a random distance out from the center,
  // and sets the star somewhere along that line.
  reset = () =>
  {
    const angle = randomInRange(0, 360) * (Math.PI / 180)
    // A direction (vX, vY)
    const vX = Math.cos(angle)
    const vY = Math.sin(angle)
    const travelled =
      Math.random() > 0.5
        ? Math.random() * Math.max(window.innerWidth, window.innerHeight) + (Math.random() * (window.innerWidth * 0.24))
        : Math.random() * (window.innerWidth * 0.25)
    this.STATE =
    {
      ...this.STATE,
      iX: undefined,
      iY: undefined,
      iVX: 0,
      iVY: 0,
      active: travelled ? true : false,
      // position (x, y)
      x: Math.floor(vX * travelled) + window.innerWidth / 2,
      vX,
      y: Math.floor(vY * travelled) + window.innerHeight / 2,
      vY,
      // size (line thickness), which will grow
      size: BASE_SIZE,
    }
  }

  constructor()
  {
    this.reset()
  }
}

// Stars are pre-allocated into a pool
const generateStarPool = size => new Array(size).fill().map(() => new Star())

// Class for the actual app
// Not too much happens in here
// Initiate the drawing process and listen for user interactions
class MovingStars
{
  STATE =
  {
    stars: generateStarPool(550),
    bgAlpha: 0,
    // how fast their line width grows
    sizeInc: SIZE_INC,
    // how fast stars move
    velocity: VELOCITY_INC,
    initiating: false,
    jumping: false,
    initiateTimestamp: undefined,
    // short-lived streaks emitted from slot frames
    slotParticles: [],
  }

  // Creates a single <canvas> dynamically and appends it to <body>
  constructor(bgCanvas, fgCanvas)
  {
    this.bgCanvas = bgCanvas;
    this.fgCanvas = fgCanvas;
    this.bgCtx = bgCanvas.getContext('2d');
    this.fgCtx = fgCanvas.getContext('2d');

    this.bind()
    this.setup()
    this.render()
  }

  // render() is the main loop
  render = () =>
  {
    const
    {
      STATE:
      {
        bgAlpha,
        velocity,
        sizeInc,
        initiating,
        jumping,
        stars,
      },
      bgCtx,
      fgCtx,
      render
    } = this

    // Make sure canvases match the viewport
    const w = window.innerWidth;
    const h = window.innerHeight;

    // 0. Clear both canvaslayers
    bgCtx.clearRect(0, 0, w, h);
    fgCtx.clearRect(0, 0, w, h);

    // Draw a semi-transparent background rectangle when bgAlpha > 0
    if (bgAlpha > 0)
    {
      bgCtx.fillStyle = `rgba(31, 58, 157, ${bgAlpha})`;
      bgCtx.fillRect(0, 0, w, h);
    }

    // --- Slot-frame particles (greenish streaks) ---
    if (this.STATE.slotParticles.length > 0)
    {
      const next = []
      for (const p of this.STATE.slotParticles)
      {
        // accelerate like stars: v *= velocity each frame
        const vX = p.vX * SLOT_STAR_VELOCITY
        const vY = p.vY * SLOT_STAR_VELOCITY

        const newX = p.x + vX
        const newY = p.y + vY
        const newSize = p.size * SIZE_INC

        // kill if off-screen
        if (newX < 0 || newX > w || newY < 0 || newY > h)
        {
          continue
        }

        p.x = newX
        p.y = newY
        p.vX = vX
        p.vY = vY
        p.size = newSize

        // choose canvas layer based on size threshold, like stars
        const ctx = fgCtx

        // teal/green portal color
        ctx.strokeStyle = p.color || `rgba(69, 162, 158, 1)`;
        ctx.lineWidth = p.size
        ctx.beginPath()
        // draw a streak from "previous" position to current
        ctx.moveTo(newX - vX, newY - vY)
        ctx.lineTo(newX, newY)
        ctx.stroke()

        next.push(p)
      }
      this.STATE.slotParticles = next
    }

    // 1. Shall we add a new star
    const nonActive = stars.filter(s => !s.STATE.active)
    if (!initiating && nonActive.length > 0)
    {
      // Introduce a star
      nonActive[0].STATE.active = true
    }
    // 2. Update the stars and draw them.
    for (const star of stars.filter(s => s.STATE.active))
    {
      const { active, x, y, iX, iY, iVX, iVY, size, vX, vY } = star.STATE
      const w = this.bgCanvas.width
      const h = this.bgCanvas.height
      // Check if the star needs deactivating
      if (
        ((iX ?? x) < 0 ||
          (iX ?? x) > w ||
          (iY ?? y) < 0 ||
          (iY ?? y) > h) &&
        active &&
        !initiating
      )
      {
        star.reset()
      }
      else if (active)
      {
        const newIX = initiating
          ? iX
          : (iX !== undefined ? iX + iVX : undefined)
        const newIY = initiating
          ? iY
          : (iY !== undefined ? iY + iVY : undefined)
        const newX = x + vX
        const newY = y + vY
        // Just need to work out if it overtakes the original line that's all
        const caught =
          (vX < 0 && newIX < x) ||
          (vX > 0 && newIX > x) ||
          (vY < 0 && newIY < y) ||
          (vY > 0 && newIY > y)
        star.STATE =
        {
          ...star.STATE,
          iX: caught ? undefined : newIX,
          iY: caught ? undefined : newIY,
          iVX: caught ? undefined : iVX * VELOCITY_INIT_INC,
          iVY: caught ? undefined : iVY * VELOCITY_INIT_INC,
          x: newX,
          vX: star.STATE.vX * velocity,
          y: newY,
          vY: star.STATE.vY * velocity,
          size: initiating ? size : size * (iX || iY ? SIZE_INC : sizeInc),
        }
        let color = `rgba(255, 255, 255, ${star.STATE.alpha})`
        if (jumping)
        {
          const [r, g, b] = WARP_COLORS[randomInRange(0, WARP_COLORS.length)]
          color = `rgba(${r}, ${g}, ${b}, ${star.STATE.alpha})`
        }

        // Decide which layer to draw on:
        // small stars = background, big stars = foreground
        const context = star.STATE.size >= FG_SIZE_THRESHOLD ? fgCtx : bgCtx;

        context.strokeStyle = color
        context.lineWidth = star.STATE.size
        context.beginPath()
        context.moveTo(star.STATE.iX ?? star.STATE.x, star.STATE.iY || star.STATE.y)
        context.lineTo(star.STATE.x, star.STATE.y)
        context.stroke()
      }
    }
    requestAnimationFrame(render)
  }

  // Charging of the jump
  initiate = () =>
  {
    if (this.STATE.jumping || this.STATE.initiating)
      return

    this.STATE =
    {
      ...this.STATE,
      initiating: true,
      initiateTimestamp: Date.now(),
      velocity: CHARGE_VELOCITY,
      bgAlpha: 0.3,
    }


    // When we initiate, stop the XY origin from moving so that we draw
    // longer lines until the jump
    for (const star of this.STATE.stars.filter(s => s.STATE.active))
    {
      star.STATE =
      {
        ...star.STATE,
        iX: star.STATE.x,
        iY: star.STATE.y,
        iVX: star.STATE.vX,
        iVY: star.STATE.vY,
      }
    }
  }

  // The hyperspace jump functionality
  jump = () =>
  {
    this.STATE =
    {
      ...this.STATE,
      bgAlpha: 0,
      jumping: true,
      bgAlpha: 0.75,
      velocity: JUMP_VELOCITY_INC,
      sizeInc: JUMP_SIZE_INC,
    }

    // Temporarily increases velocity, sizeInc, bgAlpha
    setTimeout(() =>
    {
      this.STATE = {
        ...this.STATE,
        jumping: false,
        bgAlpha: 0,
        velocity: VELOCITY_INC,
        sizeInc: SIZE_INC,
      }
      // After ~2.5s, eases back to the normal state
    }, 2500)
  }
  enter = () =>
  {
    if (this.STATE.jumping)
      return

    const { initiateTimestamp } = this.STATE
    this.STATE =
    {
      ...this.STATE,
      initiating: false,
      initiateTimestamp: undefined,
    }
    if (initiateTimestamp && Date.now() - initiateTimestamp > 600)
    {
      this.jump()
    }
    else
    {
      this.STATE =
      {
        ...this.STATE,
        velocity: VELOCITY_INC,
        bgAlpha: 0,
        sizeInc: SIZE_INC,
      }
      }
  }
  bind = () =>
  {
    this.handleDown = this.handleDown.bind(this);
    this.handleUp = this.handleUp.bind(this);

    document.addEventListener('mousedown', this.handleDown, true);
    document.addEventListener('touchstart', this.handleDown, true);
    document.addEventListener('mouseup', this.handleUp, true);
    document.addEventListener('touchend', this.handleUp, true);
  }
  handleDown(e)
  {
    // If click started inside the code box, skip warp
    if (e.target.closest('#codeBox'))
    {
      return;
    }

    this.initiate();
  }
  handleUp(e)
  {
    // Same: ignore releases that started in code box region
    if (e.target.closest('#codeBox'))
    {
      return;
    }

    this.enter();
  }
  setup = () =>
  {
    const w = window.innerWidth;
    const h = window.innerHeight;

    this.bgCanvas.width = w;
    this.bgCanvas.height = h;
    this.fgCanvas.width = w;
    this.fgCanvas.height = h;

    this.bgCtx.lineCap = 'round';
    this.fgCtx.lineCap = 'round';
  }
  reset = () =>
  {
    this.STATE = {
      ...this.STATE,
      stars: generateStarPool(550)
    }
    this.setup()
  }
  spawnFromSlot(slotEl)
  {
    const rect = slotEl.getBoundingClientRect()
    const left   = rect.left
    const right  = rect.right
    const top    = rect.top
    const bottom = rect.bottom
    const w = rect.width
    const h = rect.height

    const screenCenterX = window.innerWidth  / 2
    const screenCenterY = window.innerHeight / 2

    const burstCount = 48   // how many streaks per letter

    let slotColor;
    if (slotEl.classList.contains('rainbow-box'))
    {
      // colorful mode – sample from warp palette
      const [r, g, b] = WARP_COLORS[randomInRange(0, WARP_COLORS.length)]
      slotColor = `rgba(${r}, ${g}, ${b}, 1)`;
    }
    else
    {
      // normal mode – use the slot's border color
      const styles = getComputedStyle(slotEl);
      slotColor = styles.borderColor;
    }

    for (let i = 0; i < burstCount; ++i)
    {
      // --- pick a random point ON the rectangle perimeter ---
      const perimeter = 2 * (w + h)
      let t = Math.random() * perimeter
      let x, y

      if (t < w)
      {
        // top edge: left -> right
        x = left + t
        y = top
      }
      else if (t < w + h)
      {
        // right edge: top -> bottom
        x = right
        y = top + (t - w)
      }
      else if (t < 2 * w + h)
      {
        // bottom edge: right -> left
        x = right - (t - (w + h))
        y = bottom
      }
      else
      {
        // left edge: bottom -> top
        x = left
        y = bottom - (t - (2 * w + h))
      }

      // --- direction: from global center through this frame point ---
      let dirX = x - screenCenterX
      let dirY = y - screenCenterY

      // little extra upward bias if you like; comment out if not needed
      dirY *= 1.4

      const len = Math.hypot(dirX, dirY) || 1
      dirX /= len
      dirY /= len

      this.STATE.slotParticles.push(
      {
        x,
        y,
        vX: dirX,
        vY: dirY,
        size: BASE_SIZE * 1.2,
        color: slotColor,
      })
    }
  }
}

let starField = null;
function renderStars()
{
  if (starField)
    return;

  const bgCanvas = document.getElementById('stars-bg');
  const fgCanvas = document.getElementById('stars-fg');
  starField  = new MovingStars(bgCanvas, fgCanvas)

  window.addEventListener(
    'resize',
    () =>
    {
      if (starField)
      {
        starField.reset()
      }
    }
  )
}
</script>
