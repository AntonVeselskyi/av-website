<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AV Show Tier List</title>
  <link href="https://fonts.googleapis.com/css2?family=Major+Mono+Display&family=Poiret+One&display=swap" rel="stylesheet">
  <!-- bump ?v= on deploy to bust browser caches (GitHub Pages caches for 10 min) -->
  <link rel="stylesheet" href="gamelist.css?v=10" />
  <link rel="shortcut icon" type="image/x-icon" href="img/favicon.ico"/>
</head>
<body>
  <!-- AV monogram — signature mark, links home -->
  <a class="av-monogram" href="https://antonveselskyi.com" target="_blank" rel="noopener" aria-label="Anton Veselskyi">
    <span>A</span><span>V</span>
  </a>
  <!-- Page Title -->
  <h1 class="title">SHOW LIST</h1>
  <!-- Views -->
  <div class="view-toggles">
    <button class="view-btn active" data-view="grid">TIERLIST</button>
    <button class="view-btn" data-view="pillar">HISTOGRAM</button>
  </div>

  <!-- Row 1: category (ALL = exclusive; others = multiselect) -->
  <div class="tab-buttons tab-row tab-row-category">
    <a href="#all"     class="secret-btn active" data-group="category" data-value="all">ALL SHOWS</a>
    <a href="#live"    class="secret-btn" data-group="category" data-value="live-action">NON-ANIMATED</a>
    <a href="#anime"   class="secret-btn" data-group="category" data-value="anime">ANIME</a>
    <a href="#cartoon" class="secret-btn" data-group="category" data-value="cartoon">CARTOON</a>
    <a href="#sitcom"  class="secret-btn" data-group="category" data-value="sitcom">SITCOM</a>
    <a href="#docu"    class="secret-btn" data-group="category" data-value="documentary">DOCUMENTARY</a>
  </div>

  <!-- Row 2: decade (by watched_year) + search -->
  <div class="tab-buttons tab-row tab-row-decade">
    <span class="sort-label">DECADE:</span>
    <a href="#200x" class="secret-btn" data-group="decade" data-value="2000s">200X</a>
    <a href="#201x" class="secret-btn" data-group="decade" data-value="2010s">201X</a>
    <a href="#202x" class="secret-btn" data-group="decade" data-value="2020s">202X</a>
    <span class="sort-label search-label">SEARCH:</span>
    <input type="text" id="search-input" class="search-input" placeholder="..." />
  </div>

  <!-- Row 3: sort -->
  <div class="tab-buttons tab-row tab-row-sort">
    <span class="sort-label">SORT&nbsp;BY:</span>
    <a href="#" class="secret-btn" data-group="sort" data-value="watched">YEAR_WATCHED</a>
    <a href="#" class="secret-btn" data-group="sort" data-value="released">YEAR_RELEASED</a>
    <a href="#" class="secret-btn" data-group="sort" data-value="score">SCORE</a>
    <a href="#" class="secret-btn" data-group="sort" data-value="name">NAME</a>
  </div>

  <!-- Row 7: pillar axis -->
  <div class="tab-buttons tab-row tab-row-columns">
    <span class="sort-label">COLUMNS:</span>
    <a href="#" class="secret-btn active" data-group="pillarAxis" data-value="score">SCORE</a>
    <a href="#" class="secret-btn" data-group="pillarAxis" data-value="watched">YEAR_WATCHED</a>
    <a href="#" class="secret-btn" data-group="pillarAxis" data-value="released">YEAR_RELEASED</a>
    <a href="#" class="secret-btn" data-group="pillarAxis" data-value="network">NETWORK</a>
    <a href="#" class="secret-btn" data-group="pillarAxis" data-value="seasons">SEASONS</a>
  </div>

  <!-- COUNTDOWN LOADER -->
  <div id="loader-overlay" class="loader-overlay loader-hidden">
    <div class="loader-inner">
      <div id="loader-number" class="loader-number">Ⅹ</div>
      <div class="loader-dots">
        <span>•</span><span>•</span><span>•</span>
      </div>
    </div>
  </div>

  <!-- Inspect Panel for Pillar view -->
  <div id="pillar-inspect-panel" class="inspect-hidden"></div>

  <!-- Main List -->
  <div id="main-list" class="games-list"></div>

  <script src="show-list.js?v=10"></script>
  <script src="showlist-config.js?v=10"></script>
  <script src="core.js?v=10"></script>
</body>
</html>
