<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AV Game Tier List</title>
  <link href="https://fonts.googleapis.com/css2?family=Major+Mono+Display&family=Poiret+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="gamelist.css" />
  <link rel="shortcut icon" type="image/x-icon" href="img/favicon.ico"/>
</head>
<body>
  <!-- Page Title -->
  <h1 class="title">GAME LIST</h1>
  <!-- Tab Navigation -->
  <!-- Row 1: category -->
  <div class="tab-buttons tab-row tab-row-category">
    <a href="#all"   id="allTab"   class="secret-btn"
      data-group="category" data-value="all">ALL GAMES</a>
    <a href="#indie" id="indieTab" class="secret-btn"
      data-group="category" data-value="indie">INDIE</a>
    <a href="#ubi" id="ubiTab" class="secret-btn"
      data-group="category" data-value="ubisoft">UBISOFT</a>
  </div>

  <!-- Row 2: decade -->
  <div class="tab-buttons tab-row tab-row-decade">
    <a href="#200x" id="y200xTab" class="secret-btn"
      data-group="decade" data-value="2000s">200X</a>
    <a href="#201x" id="y201xTab" class="secret-btn"
      data-group="decade" data-value="2010s">201X</a>
    <a href="#202x" id="y202xTab" class="secret-btn"
      data-group="decade" data-value="2020s">202X</a>
  </div>

  <!-- Row 3: platforms -->
  <div class="tab-buttons tab-row tab-row-platform">
    <a href="#pc"   id="pcTab"   class="secret-btn"
    data-group="platform" data-value="pc">PC</a>
    <a href="#psp"  id="pspTab"  class="secret-btn"
      data-group="platform" data-value="psp">PSP</a>
    <a href="#ps2"  id="ps2Tab"  class="secret-btn"
      data-group="platform" data-value="playstation 2">PLAYSTATION 2</a>
    <a href="#ps4"  id="ps4Tab"  class="secret-btn"
      data-group="platform" data-value="playstation 4">PLAYSTATION 4</a>
    <a href="#x360" id="xbox360Tab" class="secret-btn"
      data-group="platform" data-value="xbox 360">XBOX 360</a>
  </div>

  <!-- Main Games List -->
  <div id="main-list" class="games-list">
    <!-- Tier sections will be injected here by JS -->
  </div>

  <script src="games.js"></script>
  <script src="gamelist.js"></script>
</body>
</html>
