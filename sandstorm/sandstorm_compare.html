<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sandstorm Colorscheme</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Major+Mono+Display&family=Michroma&display=swap" rel="stylesheet">
<style>
:root {
  --sand:  #e8a038;
  --sand2: #f8dc68;
  --storm: #58a8e8;
  --storm2:#b8a0d8;
  --ink:   #d8d0c0;
  --logo-font: 'Michroma', sans-serif;
  --logo-weight: 400;
  --logo-track: .04em;
}
* { margin:0; padding:0; box-sizing:border-box; }
html { -webkit-text-size-adjust:100%; }
body {
  font-family: 'Sarasa Mono J','Cascadia Code','Consolas',monospace;
  font-size: 16px;
  background: #111;
  color: #bbb;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ── Hero ─────────────────────────────────────────────────── */
.hero {
  position: relative;
  padding: 108px 20px 20px;
  text-align: center;
  border-bottom: 1px solid #1e1e1e;
  background:
    radial-gradient(120% 150% at 50% -30%, rgba(232,160,56,.10), transparent 60%),
    radial-gradient(100% 140% at 80% 0%, rgba(88,168,232,.08), transparent 55%);
}

.av-monogram {
  position: absolute;
  top: 12px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 100002;
  display: inline-grid;
  place-items: center;
  font-family: 'Major Mono Display', monospace;
  font-size: 3.6rem;
  line-height: 1;
  letter-spacing: 0;
  text-decoration: none;
  opacity: 0;
  visibility: hidden;
  transition: transform 1.3s ease-in-out, opacity .6s ease, visibility .6s ease;
}
/* both letters share one cell → they intersect into a single mark */
.av-monogram span { grid-area: 1 / 1; text-align: center; transition: color .3s ease; }
.av-monogram span:nth-child(1) { color: var(--sand); }
.av-monogram span:nth-child(2) { color: var(--storm); }
.av-monogram:hover { transform: translateX(-50%) scale(1.08) rotate(-183deg); }
.av-monogram:hover span:nth-child(1) { color: var(--storm); }
.av-monogram:hover span:nth-child(2) { color: var(--sand); }
body.content-ready .av-monogram { opacity: 1; visibility: visible; }

.wordmark {
  display: inline-block;
  font-family: var(--logo-font);
  font-weight: var(--logo-weight);
  font-size: clamp(1.5rem, 6.4vw, 4.2rem);
  line-height: 1.06;
  letter-spacing: var(--logo-track);
  white-space: nowrap;
  padding: 0;
  cursor: pointer;
  user-select: none;
  transition: transform .3s cubic-bezier(.16,1,.3,1);
}
.wordmark:hover { transform: translateY(-2px); }
.wordmark:active { transform: translateY(0) scale(.985); }
.wordmark .sand  { color: var(--sand); }
.wordmark .storm { color: var(--storm); }

.tagline {
  margin: 14px auto 0;
  max-width: 62ch;
  font-size: 13px;
  line-height: 1.65;
  color: #6a6a6a;
}
.tagline b { color: #9a8f7c; font-weight: normal; }

.hero-swatches { display:flex; justify-content:center; flex-wrap:wrap; gap:5px; margin-top:16px; }
.hero-swatches .hs {
  width: 26px; height: 12px; border-radius: 3px;
  border: 1px solid rgba(255,255,255,.08);
}
.hero-actions { display:flex; justify-content:center; flex-wrap:wrap; gap:8px; margin-top:18px; }
.hero-actions a, .mode-btn {
  background:#181818; border:1px solid #2a2a2a; color:#8a8a8a;
  padding:7px 16px; font:inherit; font-size:13px; border-radius:3px;
  text-decoration:none; cursor:pointer;
}
.hero-actions a:hover { border-color:#5a4a30; color:var(--sand); }
.mode-btn.active { background:#221d16; border-color:#5a4a30; color:var(--sand); }
.mode-btn:hover:not(.active) { color:#aaa; border-color:#3a3a3a; }

.egg-hint { margin-top:10px; font-size:11px; color:#333; height:14px; letter-spacing:.08em; }

/* default view: one short snippet holding every token colour.
   Any tab press hides it (body gets a .picked class). */
.hero-snippet { margin:20px auto 0; max-width:640px; text-align:left; }
.hero-snippet .editor { font-size:14px; }
/* the taster is a fixed short sample — nothing to scroll to */
.hero-snippet pre.code { overflow-x:hidden; }
body.picked .hero-snippet { display:none; }

/* ── Get it ───────────────────────────────────────────────── */
#get { display:none; padding:22px 20px 30px; }
body.m-get #get { display:block; }
.get-grid {
  display:grid; gap:14px; max-width:1180px; margin:0 auto;
  grid-template-columns:repeat(auto-fit, minmax(min(280px,100%), 1fr));
}
.get-card {
  border:1px solid #232323; border-radius:6px; padding:16px 17px 17px;
  background:#151515; display:flex; flex-direction:column;
}
.get-card h3 {
  font-size:15px; font-weight:normal; color:var(--sand);
  letter-spacing:.04em; margin-bottom:3px;
}
.get-card .gc-sub { font-size:12px; color:#5a5a5a; margin-bottom:12px; }
.get-card ol { margin:0 0 14px 16px; padding:0; }
.get-card li { font-size:12.5px; line-height:1.75; color:#8a8a8a; margin-bottom:3px; }
.get-card code {
  background:#1e1e1e; border:1px solid #262626; border-radius:3px;
  padding:1px 5px; color:#c9a96e; font-size:12px;
  overflow-wrap:anywhere;   /* menu paths are long; never push the card wide */
}
.get-card .dl { margin-top:auto; display:flex; flex-wrap:wrap; gap:7px; }
.get-card .dl a {
  background:#1c1813; border:1px solid #4a3c22; color:var(--sand);
  padding:7px 14px; border-radius:3px; text-decoration:none; font-size:12.5px;
}
.get-card .dl a:hover { background:#251f16; border-color:var(--sand); }
.get-card .note { font-size:11.5px; color:#4e4e4e; margin-top:10px; line-height:1.6; }

/* scheme picker — same treatment the font picker had */
.compare-with { display:none; margin-top:22px; padding-top:16px; border-top:1px solid #1d1d1d; }
body.m-compare .compare-with { display:block; }
.compare-with .cw-label {
  font-size:12px; color:#4a4a4a; letter-spacing:.14em; margin-bottom:10px;
  text-transform:uppercase;
}
.compare-with .cw-label b { color:var(--sand); font-weight:normal; }
.compare-with .tab-row { justify-content:center; }

/* ── Compare layout ───────────────────────────────────────── */
main { flex:1; }

/* Titles occupy row 1, editors row 2 — so however tall either header gets,
   both code views start at the same y and stay aligned line-to-line. */
.compare {
  display: none;
  grid-template-columns: 1fr 1fr;
  grid-template-rows: auto auto;
  align-items: start;
  gap: 0;
}
/* body state classes are prefixed m- so they can never collide with a
   component class name (a bare .compare on <body> hid the whole page). */
body.m-compare .compare { display: grid; }
.cell { min-width:0; padding: 0 20px; }
.cell-l { border-right: 1px solid #1e1e1e; }
.head { padding-top:16px; }
.body { padding-bottom:24px; }

.legend-bar { display:none; padding: 12px 20px 0; }
body.m-compare .legend-bar { display:block; }
.legend-bar .tab-btn { font-size:12px; }
.legend-bar .tab-btn .caret { color:#4a4a4a; margin-right:5px; }

.pane-title { font-size:14px; color:#666; margin-bottom:9px; letter-spacing:.04em; }
.pane-title .sub { color:#3a3a3a; font-size:12px; }
/* the reference pane is titled with the logo itself */
.pane-title .pt-mark {
  font-family: var(--logo-font);
  font-weight: var(--logo-weight);
  letter-spacing: var(--logo-track);
  font-size: 17px;
}
.pane-title .pt-mark .sand  { color: var(--sand); }
.pane-title .pt-mark .storm { color: var(--storm); }
.pane-title .pt-name { color:#9a9a9a; font-size:15px; }

.tab-row { display:flex; gap:4px; flex-wrap:wrap; }
.tab-btn {
  background:#181818; border:1px solid #252525; color:#585858;
  padding:5px 13px; font:inherit; font-size:13px; cursor:pointer; border-radius:3px;
}
.tab-btn.active { background:#222; border-color:#3a3a3a; color:#bbb; }
.tab-btn:hover:not(.active) { color:#888; border-color:#2e2e2e; }

/* hex legends are hidden until the single toggle turns them on */
.chips { display:none; flex-wrap:wrap; gap:4px 5px; margin-bottom:12px; }
body.legend-on .chips { display:flex; }
.chip {
  display:flex; align-items:center; gap:4px;
  background:#161616; border:1px solid #202020; border-radius:3px;
  padding:3px 7px 3px 5px; font-size:12px; white-space:nowrap;
}
.chip.chg { border-color:#3a2a14; background:#1c1810; }
.sw { width:13px; height:13px; border-radius:2px; border:1px solid rgba(255,255,255,.07); flex-shrink:0; }
.ch { color:#3a3a3a; margin-left:2px; }
.arr { color:#5a5a5a; margin:0 4px; font-size:13px; }
.was { opacity:.75; }
.sw-was { width:13px; height:13px; border-radius:2px; border:1px solid rgba(255,255,255,.07); flex-shrink:0; opacity:.6; }

.editor { border-radius:4px; border:1px solid #222; overflow:hidden; font-size:15.5px; }
.tb { padding:6px 14px; font-size:13px; color:#4a4a4a; display:flex; align-items:center; gap:5px; }
.dot { width:10px; height:10px; border-radius:50%; flex-shrink:0; }
pre.code {
  padding:12px 0 14px; line-height:1.7;
  overflow-x:auto; white-space:pre; font:inherit; margin:0;
  position:relative;
}
/* No col-100 ruler: it sat at 52px + 100ch and, being absolutely positioned
   inside the scroll container, padded scrollWidth out to column 100 on every
   pane — so you could scroll a long way past the end of the code into nothing.
   No sample reaches 100 columns anyway. */
.ln {
  display:inline-block; width:32px; text-align:right;
  margin-right:20px; user-select:none; font-size:13px;
}

/* ── Gallery: a revolver cylinder ─────────────────────────────
   Sandstorm sits in the hub; the rivals are chambers on the ring.
   Scrolling (or dragging) spins the ring past the 12 o'clock slot. */
#gallery { display:none; }
body.m-gallery #gallery { display:block; position:relative; overflow:hidden; touch-action:none; }

/* The rig is a wide ellipse, not a circle: viewports have far more width than
   height, so a circle big enough to hold 15 chambers had to be scaled down to
   fit vertically, shrinking the very tiles it was meant to enlarge. */
.rev-inner {
  position:absolute; left:50%; top:0;
  width:1100px; height:720px; margin-left:-550px;
  transform-origin: top center;
  transform: scale(var(--s, 1));
}
.rev-ring {
  position:absolute; left:50%; top:50%;
  width:920px; height:580px; margin:-290px 0 0 -460px;
  border-radius:50%;
  border:1px dashed #202020;
  pointer-events:none;
}

.tile {
  position:absolute; left:50%; top:50%;
  width:160px; height:123px; margin:-61px 0 0 -80px;
  border:1px solid #262626; border-radius:5px;
  background:#141414; padding:0; overflow:hidden;
  font:inherit; cursor:pointer; display:block;
  transition: border-color .25s ease, opacity .25s ease, box-shadow .25s ease;
  opacity:.62;
}
.tile.hub {
  cursor:default; opacity:1; z-index:5;
  border-color:rgba(232,160,56,.55);
  box-shadow:0 0 0 1px rgba(232,160,56,.18), 0 0 46px -8px rgba(232,160,56,.32);
}
.tile.at-top { opacity:1; border-color:#4a4038; box-shadow:0 0 28px -8px rgba(0,0,0,.9); }
.tile.orb:hover { opacity:1; border-color:var(--sand); }

.tile-code {
  height:94px; overflow:hidden; padding:6px 0 0;
  font-size:7.7px; line-height:1.5; white-space:pre;
}
.tile-code .tln { display:inline-block; width:14px; text-align:right; margin-right:6px; }
.tile-label {
  height:29px; display:flex; align-items:center; justify-content:center;
  font-size:11.9px; letter-spacing:.04em; color:#7a7a7a;
  background:#171717; border-top:1px solid #222;
  white-space:nowrap; overflow:hidden;
}
.tile.hub .tile-label {
  font-family: var(--logo-font); font-weight: var(--logo-weight);
  letter-spacing: var(--logo-track); font-size:10px;
}
.tile.hub .tile-label .sand { color:var(--sand); }
.tile.hub .tile-label .storm { color:var(--storm); }
.tile.at-top .tile-label, .tile.orb:hover .tile-label { color:#d8d0c0; }

/* ── Code-sample bar (bottom, under all code views) ───────── */
#code-bar {
  position: sticky; bottom: 0; z-index: 50;
  background: #111; border-top: 1px solid #1e1e1e;
  padding: 10px 20px;
  display: none; align-items: center; gap: 12px; flex-wrap: wrap;
}
/* the sample switcher only means anything where code is on screen */
body.m-compare #code-bar, body.m-gallery #code-bar { display: flex; }
#code-bar .cb-label { font-size:12px; color:#3f3f3f; letter-spacing:.08em; flex-shrink:0; }

/* ── Mobile ───────────────────────────────────────────────── */
/* NOTE: .compare stays two columns at every width — the side-by-side,
   line-to-line reading is the whole point of the tool. Narrow screens get
   smaller type and per-pane horizontal scroll instead of stacking. */
@media (max-width: 900px) {
  .cell { padding: 0 10px; }
  .head { padding-top:12px; }
  .body { padding-bottom:18px; }
  .legend-bar { padding: 10px 10px 0; }
  .tile.hub .tile-label { font-size:11px; }
  .hero { padding: 84px 12px 18px; }
  .editor { font-size:12px; }
  .ln { width:22px; margin-right:10px; font-size:10px; }
  .tb { padding:5px 9px; font-size:11px; }
  .dot { width:7px; height:7px; }
  pre.code { padding:8px 0 10px; }
  .pane-title { font-size:12px; margin-bottom:7px; }
  .pane-title .pt-mark { font-size:13px; }
  .pane-title .pt-name { font-size:12px; }
  .pane-title .sub { display:none; }
  .hero-snippet .editor { font-size:12px; }
  /* columns are ~195px on a phone — a nowrap chip would punch out of the grid */
  .chips { gap:3px; }
  .chip { white-space:normal; font-size:10px; padding:2px 5px 2px 4px; gap:3px; }
  .sw, .sw-was { width:10px; height:10px; }
  .arr { margin:0 2px; font-size:11px; }
  #code-bar { padding: 9px 10px; }
  #code-bar .tab-row { flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none; }
  #code-bar .tab-row::-webkit-scrollbar { display:none; }
  #code-bar .tab-btn { flex-shrink:0; }
  .tagline { font-size:12px; }
}
@media (max-width: 520px) {
  .chip { font-size:11px; }
  .tab-btn { font-size:12px; padding:5px 10px; }
  .editor { font-size:10.5px; }
  .hero-snippet .editor { font-size:10.5px; }
  .ln { width:18px; margin-right:7px; font-size:9px; }
  .hero-swatches .hs { width:18px; height:10px; }
}
</style>
</head>
<body>

<header class="hero">
  <a class="av-monogram" href="https://antonveselskyi.com" target="_blank" rel="noopener" aria-label="Anton Veselskyi">
    <span>A</span><span>V</span>
  </a>

  <h1 class="wordmark" id="wordmark" title="Sandstorm"><span class="sand">sand</span><span class="storm">storm</span></h1>

  <p class="tagline">Colorscheme inspired by <b>desert.vim</b></p>

  <div class="hero-swatches" id="hero-swatches"></div>

  <div class="hero-snippet" id="hero-snippet"></div>

  <div class="hero-actions">
    <button class="mode-btn" id="btn-compare" onclick="setMode('compare')">Compare</button>
    <button class="mode-btn" id="btn-gallery" onclick="setMode('gallery')">Gallery</button>
    <button class="mode-btn get" id="btn-get" onclick="setMode('get')">Get it</button>
  </div>

  <div class="egg-hint" id="egg-hint"></div>

  <div class="compare-with" id="compare-with">
    <div class="cw-label">compare <b>sandstorm</b> with:</div>
    <div class="tab-row" id="scheme-tabs"></div>
  </div>
</header>

<main>
  <div class="legend-bar" id="legend-bar">
    <button class="tab-btn" id="legend-toggle" onclick="toggleLegend()"></button>
  </div>
  <div class="compare" id="compare">
    <div class="cell cell-l head" id="left-top"></div>
    <div class="cell cell-r head" id="right-top"></div>
    <div class="cell cell-l body" id="left-editor"></div>
    <div class="cell cell-r body" id="right-editor"></div>
  </div>
  <div id="gallery"></div>
  <div id="get"></div>
</main>

<div id="code-bar">
  <span class="cb-label">SAMPLE</span>
  <div class="tab-row" id="code-tabs"></div>
</div>

// ── Renderers ─────────────────────────────────────────────────────────────
function esc(t) { return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function renderMeta(schemeKey, refKey) {
  const s = S[schemeKey], r = refKey ? S[refKey] : null;
  // the reference pane is titled with the wordmark itself; rivals get name + note
  const title = schemeKey === REF
    ? `<span class="pt-mark"><span class="sand">sand</span><span class="storm">storm</span></span>`
    : `<span class="pt-name">${s.label}</span> <span class="sub">${s.desc}</span>`;
  let h = `<div class="pane-title">${title}</div>`;
  h += '<div class="chips">';
  CHIP_KEYS.forEach(k => {
    const c = s[k]; if (!c) return;
    const changed = r && r[k] && r[k].toLowerCase() !== c.toLowerCase();
    h += `<div class="chip${changed?' chg':''}">`;
    h += `<div class="sw" style="background:${c}${k==='bg'?';border-color:#666':''}"></div>`;
    h += `<span class="cn" style="color:${k==='pl'?'#888':c}">${CHIP_LABELS[k]||k}</span>`;
    h += `<span class="ch">${c}</span>`;
    if (changed) {
      h += `<span class="arr">&#x2190;</span>`;
      h += `<div class="sw-was" style="background:${r[k]}"></div>`;
      h += `<span class="was" style="color:${r[k]}">${r[k]}</span>`;
    }
    h += '</div>';
  });
  return h + '</div>';
}

function renderEditor(schemeKey, code) {
  const s = S[schemeKey];
  const d = typeof code === 'string' ? CODES[code] : code;   // key or dataset
  let h = `<div class="editor"><div class="tb" style="background:${s.tb}">`;
  h += `<span class="dot" style="background:#ff5f56"></span>`;
  h += `<span class="dot" style="background:#ffbd2e"></span>`;
  h += `<span class="dot" style="background:#27c93f"></span>&nbsp;${d.filename}</div>`;
  h += `<pre class="code" style="background:${s.bg}">`;
  d.lines.forEach((line, i) => {
    const isHL = i === d.hl;
    const lnColor = isHL ? (s.lnc || '#686868') : s.ln;
    const bg = isHL ? `background:${s.hl};` : '';
    h += `<span style="display:block;${bg}">`;
    h += `<span class="ln" style="color:${lnColor}">${i+1}</span>`;
    if (line) line.forEach(([tok, txt]) => {
      h += `<span style="color:${s[tok]||s.pl}">${esc(txt)}</span>`;
    });
    h += '</span>';
  });
  return h + '</pre></div>';
}

// ── State ─────────────────────────────────────────────────────────────────
const REF = 'sandstorm';
const SCHEME_TABS = [
  'vscode','dracula','gruvbox','nord','solarized','monokai','onedark',
  'tokyonight','catppuccin','kanagawa','everforest','rosepine','ayu',
  'zenburn','desert',
];
let activeScheme = 'vscode';
let activeCode   = 'game';
let mode         = 'none';   // default view is the hero snippet, no tab picked

function buildSchemeTabs() {
  document.getElementById('scheme-tabs').innerHTML = SCHEME_TABS.map(k =>
    `<button class="tab-btn${k===activeScheme?' active':''}" onclick="setScheme('${k}')">${S[k].label}</button>`
  ).join('');
}

function buildCodeTabs() {
  document.getElementById('code-tabs').innerHTML =
    Object.keys(CODES).map(k =>
      `<button class="tab-btn${k===activeCode?' active':''}" onclick="setCode('${k}')">${CODES[k].label}</button>`
    ).join('');
}

function renderCompare() {
  document.getElementById('left-top').innerHTML     = renderMeta(REF, null);
  document.getElementById('left-editor').innerHTML  = renderEditor(REF, activeCode);
  document.getElementById('right-top').innerHTML    = renderMeta(activeScheme, REF);

// ── Revolver gallery ──────────────────────────────────────────────────────
// Sandstorm in the hub, the 15 rivals as chambers on the ring. All tiles are
// the same size and stay upright — only their position on the circle rotates,
// so you read the colour vibe of each scheme against Sandstorm in the middle.
// Ellipse sized so 15 chambers of tile-width sit shoulder to shoulder.
const REV_W = 1100, REV_H = 720, REV_RX = 460, REV_RY = 290;

// Equal ANGLE steps around an ellipse give uneven spacing (chambers bunch at
// the ends of the major axis), so positions are distributed by equal ARC
// LENGTH instead. Build the arc-length table once.
const ARC = (() => {
  const N = 1440, t = [], cum = [0];
  for (let i = 0; i <= N; i++) t.push(i / N * 2 * Math.PI);
  for (let i = 1; i <= N; i++) {
    const x0 = REV_RX * Math.cos(t[i-1]), y0 = REV_RY * Math.sin(t[i-1]);
    const x1 = REV_RX * Math.cos(t[i]),   y1 = REV_RY * Math.sin(t[i]);
    cum.push(cum[i-1] + Math.hypot(x1 - x0, y1 - y0));
  }
  return { N, t, cum, total: cum[N] };
})();

// fraction of the perimeter (0..1, wrapping) -> {x, y} on the ellipse
function pointAtFraction(f) {
  f = ((f % 1) + 1) % 1;
  const target = ARC.total * f;
  let lo = 0, hi = ARC.N;
  while (lo < hi) { const mid = (lo + hi) >> 1; if (ARC.cum[mid] < target) lo = mid + 1; else hi = mid; }
  const a = ARC.t[lo];
  return { x: REV_RX * Math.cos(a), y: REV_RY * Math.sin(a) };
}
const rev = { angle: 0, tiles: [], step: 0, dragging: false, lastA: 0 };

// A dense slice of the sample — enough tokens to read the palette at 7px.
function tileCode(schemeKey, codeKey, count = 11) {
  const s = S[schemeKey], d = CODES[codeKey];
  const start = Math.max(0, Math.min(d.hl - 5, d.lines.length - count));
  let h = `<div class="tile-code" style="background:${s.bg}">`;
  for (let i = start; i < Math.min(start + count, d.lines.length); i++) {
    const line = d.lines[i], isHL = i === d.hl;
    h += `<span style="display:block;${isHL ? `background:${s.hl};` : ''}">`;
    h += `<span class="tln" style="color:${s.ln}">${i + 1}</span>`;
    if (line) line.forEach(([tok, txt]) => {
      h += `<span style="color:${s[tok] || s.pl}">${esc(txt)}</span>`;
    });
    h += `</span>`;
  }
  return h + '</div>';
}

function tileLabel(k) {
  return k === REF
    ? `<div class="tile-label"><span class="sand">sand</span><span class="storm">storm</span></div>`
    : `<div class="tile-label">${S[k].label}</div>`;
}

function renderRevolver() {
  rev.step = 360 / SCHEME_TABS.length;
  let h = `<div class="rev-inner" id="rev-inner"><div class="rev-ring"></div>`;
  h += `<div class="tile hub">${tileCode(REF, activeCode)}${tileLabel(REF)}</div>`;
  // no inline onclick: the drag handler takes pointer capture, which retargets
  // the click to the container, so the press is resolved on pointerup instead
  h += SCHEME_TABS.map((k, i) =>
    `<button class="tile orb" data-i="${i}" data-k="${k}" title="${S[k].label} — ${S[k].desc}"
       >${tileCode(k, activeCode)}${tileLabel(k)}</button>`
  ).join('');
  h += `</div>`;
  document.getElementById('gallery').innerHTML = h;
  rev.tiles = [...document.querySelectorAll('#rev-inner .orb')];
  layoutRevolver();
}

function layoutRevolver() {
  const g = document.getElementById('gallery');
  const inner = document.getElementById('rev-inner');
  if (!inner) return;
  // scale the whole rig so the composition survives any viewport
  const availW = g.clientWidth - 12;
  const availH = Math.max(360, innerHeight - 150);
  const s = Math.min(1, availW / REV_W, availH / REV_H);
  inner.style.setProperty('--s', s);
  g.style.height = (REV_H * s) + 'px';

  const n = rev.tiles.length;
  const turn = rev.angle / 360;                        // spin, in perimeter turns
  const active = ((Math.round(-turn * n) % n) + n) % n;
  rev.tiles.forEach((t, i) => {
    // -0.25 puts chamber 0 at 12 o'clock (ellipse param 0 is at 3 o'clock)
    const p = pointAtFraction(i / n + turn - 0.25);
    t.style.transform = `translate(${p.x}px, ${p.y}px)`;  // tiles stay upright
    t.classList.toggle('at-top', i === active);
  });
}

function spin(delta) { rev.angle += delta; layoutRevolver(); }

(() => {
  const g = document.getElementById('gallery');
  g.addEventListener('wheel', e => {
    if (mode !== 'gallery') return;
    e.preventDefault();
    spin(e.deltaY * 0.22);
  }, { passive: false });

  const angleAt = e => {
    const r = g.getBoundingClientRect();
    return Math.atan2(e.clientY - (r.top + r.height / 2), e.clientX - (r.left + r.width / 2)) * 180 / Math.PI;
  };
  g.addEventListener('pointerdown', e => {
    if (mode !== 'gallery') return;
    rev.dragging = true; rev.lastA = angleAt(e); rev.moved = 0;
    rev.pressed = e.target.closest('.tile.orb');   // remember what was pressed
    g.setPointerCapture(e.pointerId);
  });
  g.addEventListener('pointermove', e => {
    if (!rev.dragging) return;
    const a = angleAt(e);
    let d = a - rev.lastA;
    if (d > 180) d -= 360; if (d < -180) d += 360;
    rev.lastA = a; rev.moved += Math.abs(d);
    spin(d);
  });
  g.addEventListener('pointerup', () => {
    // a press that barely moved is a click on that chamber
    if (rev.dragging && rev.pressed && rev.moved < 4) {
      pickFromGallery(rev.pressed.dataset.k);
    }
    rev.dragging = false; rev.pressed = null;
  });
  g.addEventListener('pointercancel', () => { rev.dragging = false; rev.pressed = null; });
  addEventListener('resize', () => { if (mode === 'gallery') layoutRevolver(); });
})();

function applyMode() {
  const b = document.body;
  b.classList.toggle('picked',     mode !== 'none');
  b.classList.toggle('m-compare',  mode === 'compare');
  b.classList.toggle('m-gallery',  mode === 'gallery');
  b.classList.toggle('m-get',      mode === 'get');
  document.getElementById('btn-compare').classList.toggle('active', mode === 'compare');
  document.getElementById('btn-gallery').classList.toggle('active', mode === 'gallery');
  document.getElementById('btn-get').classList.toggle('active',     mode === 'get');
  if (mode === 'gallery')      renderRevolver();
  else if (mode === 'compare') renderCompare();
  else if (mode === 'get')     renderGet();
}

// clicking the active tab returns to the default snippet view
function setMode(m) { mode = (mode === m) ? 'none' : m; applyMode(); }
function setScheme(k) { activeScheme = k; mode = 'compare'; buildSchemeTabs(); applyMode(); }
function setCode(k)   { activeCode = k; buildCodeTabs(); applyMode(); }
function pickFromGallery(k) {
  if (!k || k === REF) return;
  setScheme(k);
  document.getElementById('compare').scrollIntoView({behavior:'smooth', block:'start'});
}

// ── Hex legend: one toggle drives both panes ──────────────────────────────

// ── Hero swatches ─────────────────────────────────────────────────────────

  document.getElementById('hero-swatches').innerHTML = keys.map(k =>

// ── Easter egg: 7 clicks on the wordmark ──────────────────────────────────
const EGG_URL = 'https://www.youtube.com/watch?v=y6120QOlsfU';
let eggClicks = 0, eggTimer = null;
document.getElementById('wordmark').addEventListener('click', () => {
  eggClicks++;
  clearTimeout(eggTimer);
  eggTimer = setTimeout(() => { eggClicks = 0; setHint(''); }, 1600);
  if (eggClicks >= 7) { setHint('🌪 here we go'); window.location.href = EGG_URL; return; }
  if (eggClicks >= 3) setHint('· '.repeat(7 - eggClicks).trim());
});
function setHint(t) { document.getElementById('egg-hint').textContent = t; }

// Michroma is a wide face, so size the mark from a measurement rather than a
// fixed clamp: measure the word at a known size, then scale it to fill the hero.
const MARK_MAX = 92, MARK_MIN = 15;
function fitWordmark() {
  const w = document.getElementById('wordmark');
  const cs = getComputedStyle(w);
  const pad = parseFloat(cs.paddingLeft) + parseFloat(cs.paddingRight)
            + parseFloat(cs.borderLeftWidth) + parseFloat(cs.borderRightWidth);
  const avail = document.querySelector('.hero').clientWidth - 24 - pad;
  // measure unconstrained: any width cap on the element would flatten the ratio
  w.style.maxWidth = 'none';
  w.style.fontSize = '100px';
  const at100 = w.getBoundingClientRect().width - pad;
  w.style.maxWidth = '';
  if (at100 <= 0) { w.style.fontSize = ''; return; }
  const fs = Math.max(MARK_MIN, Math.min(MARK_MAX, Math.floor(100 * avail / at100)));
  w.style.fontSize = fs + 'px';
}
let fitTimer = null;
addEventListener('resize', () => { clearTimeout(fitTimer); fitTimer = setTimeout(fitWordmark, 120); });
document.fonts.ready.then(fitWordmark);

  buildSwatches();
  paintLegendToggle();

  applyMode();
  fitWordmark();
} catch (e) {
  console.error(e);
} finally {
  document.body.classList.add('content-ready');
}
