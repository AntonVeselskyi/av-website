<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Concerts — A Sketchbook</title>
  <meta name="description" content="A hand-inked sketchbook of every concert attended — setlists, support acts, photos and ticket-stub memories on one scrolling timeline." />
  <meta name="theme-color" content="#f4ede0" />
  <meta property="og:title" content="Concerts — A Sketchbook" />
  <meta property="og:description" content="A hand-inked sketchbook of every concert attended — setlists, support acts and photos on one scrolling timeline." />
  <meta property="og:type" content="website" />
  <!-- Favicon: the timeline's ink-ring stop marker with its traveling dot -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='13' fill='%23f4ede0'/%3E%3Ccircle cx='32' cy='29' r='15.5' fill='none' stroke='%2315110d' stroke-width='3.4'/%3E%3Ccircle cx='32' cy='29' r='5' fill='%2315110d'/%3E%3Cpath d='M9 52 Q 20 45 32 52 T 55 52' fill='none' stroke='%235a4a3a' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=UnifrakturCook:wght@700&family=IM+Fell+DW+Pica:ital@0;1&family=Tinos:wght@400;700&family=Anton&family=Bodoni+Moda:ital,opsz,wght@0,6..96,700;0,6..96,900;1,6..96,700&family=Major+Mono+Display&display=swap" rel="stylesheet" />

  <!-- GSAP 3 from CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

  <style>
    /* ── Tokens ───────────────────────────────────────────────────── */
    :root {
      --paper:     #f4ede0;
      --paper-deep:#e8dfc9;
      --ink:       #15110d;
      --ink-mid:   #2a221a;
      --ink-soft:  #5a4a3a;
      --ink-ghost: #8a7a64;
      --ff-disp:   'UnifrakturCook', serif;
      --ff-body:   'IM Fell DW Pica', Georgia, serif;
      --ff-serif:  'Tinos', Georgia, 'Times New Roman', serif; /* per-band wordmark (e.g. Andrew Bird) */
      --ff-cond:   'Anton', 'Oswald', 'Arial Narrow', sans-serif; /* HAARPER — condensed heavy grotesque */
      --ff-didone: 'Bodoni Moda', 'Didot', 'Playfair Display', Georgia, serif; /* Night Lovell — high-contrast Didone */
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html {
      scroll-behavior: smooth;
      /* Thin ink scrollbar so the browser chrome reads as part of the page
         (standard properties — Chrome 121+/Firefox; Safari keeps its default). */
      scrollbar-width: thin;
      scrollbar-color: var(--ink-ghost) transparent;
    }
    /* Text selection inverts to ink-on-paper's negative — feels printed. */
    ::selection { background: var(--ink); color: var(--paper); }
    /* Touch: no grey tap-flash, no double-tap-zoom delay on controls. */
    a, button { -webkit-tap-highlight-color: transparent; touch-action: manipulation; }

    body {
      background: var(--paper);
      color: var(--ink);
      font-family: var(--ff-body);
      overflow-x: hidden;
      background-image:
        linear-gradient(to right, transparent 68px, rgba(172,26,26,.19) 68px, rgba(172,26,26,.19) 70.5px, transparent 70.5px),
        radial-gradient(ellipse at top,    transparent 58%, rgba(40,30,20,.07) 100%),
        radial-gradient(ellipse at bottom, transparent 48%, rgba(40,30,20,.10) 100%);
      min-height: 100vh;
    }

    /* Paper grain */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/%3E%3CfeColorMatrix values='0 0 0 0 .10 0 0 0 0 .08 0 0 0 0 .05 0 0 0 .22 0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size: 256px 256px;
      opacity: .55; mix-blend-mode: multiply;
      pointer-events: none; z-index: 900;
    }

    /* Faint notebook rules */
    body::after {
      content: '';
      position: fixed; inset: 0;
      background-image: repeating-linear-gradient(to bottom, transparent 0, transparent 31px, rgba(40,30,20,.045) 32px);
      opacity: .5;
      pointer-events: none; z-index: 899;
    }

    /* ── Hero ─────────────────────────────────────────────────────── */
    #hero {
      /* was 60vh which centred the content and left a big empty band below the
         tabs before the timeline/ink-line began — size to content instead */
      min-height: auto;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 4.5rem 2rem 2.25rem;
      text-align: center;
      position: relative; overflow: hidden;
    }

    #ink-blot {
      position: absolute;
      width: min(340px, 60vw); height: min(340px, 60vw);
      top: 50%; left: 50%;
      translate: -50% -50%;
      opacity: 0; pointer-events: none;
    }
    #ink-blot path { fill: var(--ink); }

    #hero-kicker {
      display: flex; justify-content: center;
      margin-bottom: .7rem;
      position: relative; z-index: 1;
      opacity: 0;
    }
    /* AV monogram — the superimposed "A ∩ V" composition from antonveselskyi.com:
       both letters share the same cell so they intersect into one mark, in
       Major Mono Display, recoloured to ink for the paper backdrop. */
    #hero-av {
      display: inline-grid;
      place-items: center;
      font-family: 'Major Mono Display', monospace;
      font-size: 6.5rem;
      line-height: 1;
      letter-spacing: 0;
      color: var(--ink);
      text-decoration: none;
      -webkit-text-stroke: 0 var(--ink);
      /* Signature hover (matches the mark on antonveselskyi.com): the colour
         swap is quick so feedback is immediate, the flip glides slowly. */
      transition: color .3s ease, -webkit-text-stroke .3s ease,
                  transform 1.3s ease-in-out;
    }
    #hero-av span { grid-area: 1 / 1; text-align: center; } /* overlap → they intersect */
    #hero-av:hover {
      /* 180° flip + the −3° resting tilt; ink inverts to paper with an ink
         outline — the stroke is what keeps it readable on the cream page. */
      transform: scale(1.08) rotate(-183deg);
      color: var(--paper);
      -webkit-text-stroke: 1.5px var(--ink);
    }
    @media (prefers-reduced-motion: reduce) {
      #hero-av { transition: color .3s ease, -webkit-text-stroke .3s ease; }
      #hero-av:hover { transform: none; }
    }

    #hero-title {
      font-family: var(--ff-disp);
      font-size: clamp(3.5rem, 11vw, 7.5rem);
      letter-spacing: .03em; line-height: 1;
      color: var(--ink);
      position: relative; z-index: 1;
      opacity: 0;
    }

    #hero-rule {
      width: 80px; height: 1px;
      background: var(--ink-soft);
      margin: 1.5rem auto 0;
      opacity: 0; transform-origin: center;
    }

    /* ── Timeline ─────────────────────────────────────────────────── */
    #timeline {
      position: relative;
      isolation: isolate;
      padding-bottom: 10rem;
    }

    #line-svg {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      pointer-events: none; z-index: 0;
      overflow: visible;
    }

    /* front SVG — sits above panel content so spiral arcs draw over it */
    #line-svg-front {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      pointer-events: none; z-index: 2;
      overflow: visible;
    }

    /* dotted ink path — always in SVG, CSS class applied by JS.
       Wider + larger dabs so it reads like a hand-inked trail. Organic
       wobble comes from geometry jitter baked into the path (see buildTimeline),
       NOT a CSS filter — a filter on the animated dashes would thrash repaint. */
    .ink-path {
      fill: none;
      stroke: var(--ink);
      stroke-width: 2.7;
      stroke-linecap: round;
      stroke-dasharray: 2.6 7.4;
    }

    /* ghost path — full route always visible, very faint pencil guide.
       This one is static, so it can afford the hand-drawn displacement filter. */
    .ink-path-ghost {
      fill: none;
      stroke: var(--ink);
      stroke-width: 1.4;
      stroke-linecap: round;
      stroke-dasharray: 1 13;
      opacity: 0.12;
      filter: url(#ink-rough-line);
    }

    /* flowing dash animation on revealed portion */
    @keyframes dash-flow {
      to { stroke-dashoffset: -8.8; } /* one dot+gap cycle: 1.8+7 */
    }
    .ink-path-flow {
      animation: dash-flow 1.1s linear infinite;
    }

    /* white cover mask — same path, thick, scrolled away by GSAP */
    .ink-cover {
      fill: none;
      stroke: var(--paper);
      stroke-width: 6;
      stroke-linecap: round;
    }

    /* ── Stops container ──────────────────────────────────────────── */
    #stops-container {
      position: relative; z-index: 1;
      max-width: 820px;
      margin: 0 auto;
      padding: 0 1.5rem;
    }

    /* ── Year change divider ──────────────────────────────────────── */
    .year-divider {
      display: flex;
      align-items: center;
      gap: .7rem;
      padding: .35rem 0;
      pointer-events: none;
      position: relative; z-index: 1;
    }
    .year-divider::before,
    .year-divider::after {
      content: '';
      flex: 1;
      border-top: 1.5px dashed var(--ink);
      opacity: 0.38;
    }
    .year-divider-label {
      font-family: var(--ff-body);
      font-style: italic;
      font-size: .72rem;
      letter-spacing: .22em;
      color: var(--ink);
      opacity: 0.62;
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* ── Individual stop ──────────────────────────────────────────── */
    .stop {
      position: relative;
      padding-block: 2.8rem;
      opacity: 0;
    }
    .stop:first-child { padding-top: 2rem; }
    .stop:last-child  { padding-bottom: 4rem; }

    .stop-btn {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      width: 100%;
      background: transparent; border: 0;
      cursor: pointer;
      font: inherit; color: inherit;
      padding: 0;
    }
    .stop-btn:focus-visible { outline: 2px dashed var(--ink-soft); outline-offset: 4px; }

    /* Circular ink ring marker — sits on the center column */
    .stop-marker {
      grid-column: 2;
      display: grid; place-items: center;
      width: 3.2rem; height: 3.2rem;
      border-radius: 9999px;
      background: var(--paper);
      box-shadow: inset 0 0 0 1.2px var(--ink), 0 0 0 6px var(--paper);
      transition: transform .4s cubic-bezier(.16,1,.3,1), box-shadow .4s ease;
      color: var(--ink);
      position: relative;
    }
    /* Scotch tape strip above each marker */
    .stop-marker::after {
      content: '';
      position: absolute;
      top: -14px; left: 50%;
      transform: translateX(-50%) rotate(-2.5deg);
      width: 44px; height: 13px;
      background: rgba(235, 215, 155, 0.44);
      border: 1px solid rgba(195, 170, 105, 0.18);
      filter: blur(0.3px);
      pointer-events: none;
      z-index: 1;
    }
    .stop:nth-child(even) .stop-marker::after { transform: translateX(-50%) rotate(1.8deg); }
    .stop:nth-child(3n)   .stop-marker::after { transform: translateX(-50%) rotate(-4.2deg); }
    .stop:hover .stop-marker,
    .stop-btn[aria-expanded="true"] .stop-marker {
      transform: rotate(-6deg) scale(1.06);
      box-shadow: inset 0 0 0 1.6px var(--ink), 0 0 0 8px var(--paper);
    }
    .stop-btn[aria-expanded="true"] .stop-marker { transform: rotate(6deg) scale(1.08); }

    /* Text meta — CSS moves to col 1 or col 3 */
    .stop-meta {
      display: flex; flex-direction: column;
      gap: .12rem;
      padding-inline: 1.25rem;
    }
    .stop.right .stop-meta { grid-column: 3; text-align: left;  align-items: flex-start; }
    .stop.left  .stop-meta { grid-column: 1; text-align: right; align-items: flex-end; }

    .stop-name {
      font-family: var(--ff-disp);
      font-size: clamp(1.25rem, 1.6vw + .7rem, 2rem);
      line-height: 1; letter-spacing: .01em;
    }

    .stop-date {
      font-family: var(--ff-body);
      font-style: italic; font-size: .78rem;
      color: var(--ink-soft); letter-spacing: .06em;
    }

    .band-logo {
      display: block;
      height: 110px;
      width: auto;
      max-width: min(100%, 260px);
      object-fit: contain;
      object-position: left bottom;
      margin-bottom: .4rem;
      opacity: .85;
      filter: sepia(.15) contrast(1.1);
      mix-blend-mode: multiply;
    }
    /* White wordmarks (e.g. JINJER) are invisible on the paper + multiply blend;
       invert them to ink so they read like everything else. */
    .band-logo.logo-invert,
    .stop-support-logo.logo-invert { filter: invert(1) sepia(.15) contrast(1.1); }
    .stop.left .band-logo { margin-left: auto; object-position: right bottom; }

    /* Small support-act logo strip on the stop card */
    .stop-support-logos {
      display: flex;
      flex-wrap: wrap;
      gap: .7rem;
      align-items: flex-end;
      margin-bottom: .45rem; /* space between logos and text meta below */
    }
    .stop.left .stop-support-logos { justify-content: flex-end; }
    .stop-support-logo {
      height: 72px;
      width: auto;
      max-width: 180px;
      object-fit: contain;
      opacity: .75;
      filter: sepia(.15) contrast(1.1);
      mix-blend-mode: multiply;
    }
    .stop-support-logo.co-headliner {
      height: 110px;
      max-width: min(100%, 260px);
      opacity: .85;
    }

    /* Opener names — part of the title block, clearly readable */
    .stop-supports {
      display: block;
      font-family: var(--ff-body);
      font-style: italic;
      font-size: .82rem;
      color: var(--ink-soft);
      letter-spacing: .04em;
      margin-top: .18rem;
      line-height: 1.3;
    }

    /* ── Category tabs ────────────────────────────────────────────── */
    #tab-bar {
      display: flex;
      justify-content: center;
      gap: 1rem;
      padding: 0;
      margin-top: 1.4rem;
      flex-wrap: wrap;
      position: relative; z-index: 1;
    }
    .tab-btn {
      font-family: var(--ff-body);
      font-style: italic;
      font-size: .88rem;
      letter-spacing: .06em;
      padding: .52rem 1.6rem;
      border-radius: 999px;
      border: 1.5px solid var(--ink);
      background: var(--paper);
      color: var(--ink);
      cursor: pointer;
      box-shadow: 2.5px 2.5px 0 var(--ink-soft);
      transition: box-shadow .15s, background .15s, color .15s;
      user-select: none;
    }
    .tab-btn:nth-child(1) { transform: rotate(-1.8deg); }
    .tab-btn:nth-child(2) { transform: rotate(.9deg);   }
    .tab-btn:nth-child(3) { transform: rotate(-.6deg);  }
    .tab-btn:hover { box-shadow: 3px 3px 0 var(--ink); }
    .tab-btn:active { box-shadow: 1px 1px 0 var(--ink-soft); } /* pressed-down feel */
    .tab-btn.active {
      background: var(--ink);
      color: var(--paper);
      box-shadow: 1.5px 1.5px 0 var(--ink-soft);
    }

    /* ── Expansion panel ──────────────────────────────────────────── */
    .stop-panel {
      height: 0; overflow: hidden; opacity: 0;
      margin-top: 1.25rem;
      background: var(--paper); /* occludes back SVG so wrap spiral shows depth */
      will-change: height;      /* smoother expand/collapse */
    }

    /* Logo banner — morphs from card header into top of panel */
    .panel-logo-banner {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center; /* logo centered above the two columns */
      gap: 1.4rem;
      padding: 1.5rem 1.5rem 0.25rem;
      max-width: 640px;
      margin: 0 auto;
      /* individual imgs are GSAP-controlled; container itself stays visible */
    }
    .panel-logo-banner img {
      opacity: 0; /* each img shown by GSAP after FLIP lands */
    }
    .panel-logo-banner .band-logo {
      height: auto;
      width: 100%;                 /* fill the banner width so wordmarks aren't dwarfed */
      max-width: 100% !important;  /* override the 260px card cap on .band-logo */
      max-height: 200px;           /* tall cap; very tall/square logos letterbox at this */
      margin-bottom: 0;
      margin-left: auto !important;
      margin-right: auto !important;
      object-position: center !important; /* center the contained logo in the wide box */
    }
    .panel-logo-banner .opener-logo {
      height: 58px;
      max-width: 160px;
    }

    /* Each artist on the bill is its own block: logo banner + two columns */
    .band-block {
      max-width: 640px;
      margin: 0 auto;
    }
    .band-block + .band-block {
      margin-top: 1.5rem;
      padding-top: 1.25rem;
      border-top: 1px dashed var(--ink-ghost);
    }
    /* Fallback name banner when a band has no logo file */
    .band-name-banner { align-items: center; }
    .band-block-name {
      font-family: var(--ff-disp);
      font-size: 2.8rem;
      line-height: 1;
      color: var(--ink);
      opacity: 0; /* revealed by GSAP when panel opens */
    }

    /* Per-band wordmark override — render the artist's name in their own
       typeface instead of the blackletter display face (e.g. Andrew Bird). */
    .name-serif {
      font-family: var(--ff-serif) !important;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .015em;
    }
    .band-block-name.name-serif { font-size: 2.45rem; }

    /* HAARPER — tall, ultra-condensed heavy grotesque, used "as is". */
    .name-cond {
      font-family: var(--ff-cond) !important;
      font-weight: 400;
      text-transform: uppercase;
      letter-spacing: .005em;
      transform: scaleY(1.18);
      transform-origin: center bottom;
    }
    .band-block-name.name-cond { font-size: 7rem; }
    .stop-name.name-cond { letter-spacing: .01em; }

    /* Night Lovell — mimic of their high-contrast Didone wordmark. */
    .name-didone {
      font-family: var(--ff-didone) !important;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: .005em;
    }
    .band-block-name.name-didone { font-size: 3.6rem; }

    .stop-panel-inner {
      padding: .25rem 0 0;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: .7rem;
    }
    @media (min-width: 520px) {
      .stop-panel-inner {
        grid-template-columns: minmax(0, 1.08fr) minmax(0, 1fr);
        gap: .9rem;
      }
    }
    /* Each content column gets a visible bordered card */
    .stop-panel-inner > div {
      border: 1.5px solid rgba(90,74,58,.26);
      border-radius: 3px;
      padding: 1rem 1rem 1.25rem;
      background: rgba(244,237,224,.45);
      display: flex;
      flex-direction: column;
    }

    .panel-h {
      font-family: var(--ff-body);
      text-transform: uppercase; letter-spacing: .18em;
      font-size: .92rem; color: var(--ink-soft);
      border-bottom: 1px solid var(--ink-soft);
      padding-bottom: .22rem; margin-bottom: .5rem;
    }

    .panel-tour {
      font-family: var(--ff-disp);
      font-size: 1.55rem; line-height: 1.1;
    }

    .panel-where {
      font-style: italic; color: var(--ink-soft);
      font-size: .92rem; margin-top: .2rem;
    }

    /* Date + city — flies in from the timeline card on expand */
    .panel-when {
      font-style: italic; color: var(--ink-soft);
      font-size: .9rem; letter-spacing: .04em;
      margin-top: .15rem;
      opacity: 0; /* revealed by GSAP FLIP from the card */
    }

    .panel-notes {
      color: var(--ink-mid); font-size: .92rem;
      line-height: 1.55; margin-top: .75rem;
    }

    /* Photo grid placeholder */
    .photo-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: .4rem;
      margin-bottom: 1.25rem;
    }
    .photo-slot {
      aspect-ratio: 1;
      border: 1.5px dashed var(--ink-soft);
      display: grid; place-items: center;
      font-style: italic; font-size: .68rem;
      color: var(--ink-ghost);
      background: repeating-linear-gradient(45deg, transparent 0 6px, rgba(40,30,20,.03) 6px 7px);
    }
    .photo-slot img { width: 100%; height: 100%; object-fit: cover; }

    /* ── Media player (framed stage + filmstrip) ──────────────────── */
    .media-player { margin-bottom: 1.25rem; position: relative; }
    /* Theatre-mode trigger, pinned to the stage's top-right corner */
    .media-expand {
      position: absolute; top: 8px; right: 8px; z-index: 4;
      width: 30px; height: 30px; padding: 0; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      color: var(--ink);
      background: rgba(244,237,224,.82);
      border: 1.5px solid var(--ink);
      border-radius: 2px;
      box-shadow: 2px 2px 0 rgba(90,74,58,.22);
      transition: transform .15s ease, background .15s ease, box-shadow .15s ease;
    }
    .media-expand:hover { transform: translateY(-1px); background: var(--paper); box-shadow: 2px 3px 0 var(--ink-soft); }
    .media-stage {
      position: relative;
      height: clamp(220px, 40vh, 360px);
      overflow: hidden;
      border: 1.5px solid var(--ink);
      border-radius: 2px;
      background:
        repeating-linear-gradient(45deg, transparent 0 6px, rgba(40,30,20,.03) 6px 7px),
        var(--paper);
      /* paper mat + ink edge, like a mounted print */
      box-shadow: 3px 3px 0 rgba(90,74,58,.22),
                  inset 0 0 0 5px var(--paper),
                  inset 0 0 0 6px rgba(90,74,58,.20);
    }
    /* absolute-centered so the fixed-height stage reliably constrains the media */
    .media-el {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      max-width: calc(100% - 16px);
      max-height: calc(100% - 16px);
      width: auto; height: auto;
      object-fit: contain;
      display: block;
    }
    img.media-el  { filter: sepia(.16) contrast(1.07); mix-blend-mode: multiply; background: transparent; }
    video.media-el { filter: sepia(.07) contrast(1.04); border-radius: 1px; }

    .media-meta {
      display: flex; justify-content: space-between; align-items: baseline;
      margin-top: .45rem;
      font-family: var(--ff-body);
      color: var(--ink-soft);
    }
    .media-label   { font-style: italic; font-size: .82rem; }
    .media-counter { font-size: .68rem; letter-spacing: .2em; }

    .media-strip {
      display: flex; flex-wrap: wrap; gap: .5rem;
      margin-top: .55rem;
    }
    .media-thumb {
      position: relative;
      width: 66px; height: 50px;
      flex: 0 0 auto;
      padding: 0; cursor: pointer;
      overflow: hidden;
      background: var(--paper);
      border: 1.5px dashed var(--ink-soft);
      border-radius: 2px;
      transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
    }
    .media-thumb:active { transform: scale(.93); }
    /* Lazy images develop like a print instead of popping in. The .img-ld
       class is added by a capture-phase load/error listener; a late timer
       force-adds it so nothing can stay invisible. */
    .photo-slot img, .media-thumb img, .media-stage img.media-el {
      opacity: 0; transition: opacity .45s ease;
    }
    .photo-slot img.img-ld, .media-thumb img.img-ld, .media-stage img.media-el.img-ld {
      opacity: 1;
    }
    .media-thumb img {
      width: 100%; height: 100%; object-fit: cover; display: block;
      filter: sepia(.18) contrast(1.05); mix-blend-mode: multiply;
    }
    .media-thumb:hover { transform: translateY(-2px) rotate(-1.2deg); box-shadow: 2px 2px 0 var(--ink-soft); }
    .media-thumb.active { border-style: solid; border-color: var(--ink); box-shadow: 2px 2px 0 var(--ink); }
    .media-thumb-badge,
    .media-thumb-fallback {
      position: absolute; inset: 0;
      display: grid; place-items: center;
      color: var(--paper); font-size: .8rem;
      background: rgba(20,17,13,.22);
      text-shadow: 0 1px 3px rgba(0,0,0,.7);
      pointer-events: none;
    }

    /* ── Theatre mode: enlarged media overlay ─────────────────────── */
    #media-theatre {
      position: fixed; inset: 0; z-index: 2000;
      display: none;
      flex-direction: column; align-items: center; justify-content: center;
      gap: 1rem; padding: clamp(1rem, 4vh, 3rem) clamp(1rem, 4vw, 3rem);
      background:
        repeating-linear-gradient(45deg, transparent 0 8px, rgba(0,0,0,.04) 8px 9px),
        rgba(18,14,10,.92);
      opacity: 0;
      overscroll-behavior: contain; /* wheel at the edges must not scroll the page behind */
    }
    #media-theatre.open { display: flex; }
    .theatre-close {
      position: absolute; top: clamp(.75rem, 2vh, 1.5rem); right: clamp(.75rem, 2vw, 1.5rem);
      width: 42px; height: 42px; padding: 0; cursor: pointer;
      font-family: var(--ff-disp); font-size: 1.7rem; line-height: 1;
      color: var(--paper);
      background: transparent;
      border: 1.5px solid rgba(244,237,224,.55);
      border-radius: 3px;
      transition: transform .15s ease, border-color .15s ease, color .15s ease;
    }
    .theatre-close:hover { transform: rotate(90deg); border-color: var(--paper); }
    .theatre-close:active { transform: rotate(90deg) scale(.88); }
    .theatre-stage {
      position: relative;
      width: min(94vw, 1200px);
      height: min(72vh, 760px);
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
      border: 1.5px solid rgba(244,237,224,.5);
      border-radius: 2px;
      box-shadow: 0 14px 50px rgba(0,0,0,.55);
      background: rgba(244,237,224,.04);
    }
    .theatre-stage .media-el {
      position: static; transform: none;
      max-width: 100%; max-height: 100%;
      width: auto; height: auto;
    }
    .theatre-stage img.media-el  { filter: sepia(.12) contrast(1.05); mix-blend-mode: normal; }
    .theatre-stage video.media-el { filter: sepia(.05) contrast(1.03); }
    .theatre-meta {
      display: flex; gap: 1.2rem; align-items: baseline;
      font-family: var(--ff-body); color: rgba(244,237,224,.82);
    }
    .theatre-meta .media-label   { font-style: italic; font-size: 1rem; }
    .theatre-meta .media-counter { font-size: .72rem; letter-spacing: .25em; }
    .theatre-strip {
      display: flex; flex-wrap: wrap; gap: .55rem; justify-content: center;
      max-width: min(94vw, 1200px);
    }
    .theatre-strip .media-thumb { border-color: rgba(244,237,224,.45); background: rgba(244,237,224,.06); }
    .theatre-strip .media-thumb.active { border-color: var(--paper); box-shadow: 2px 2px 0 rgba(244,237,224,.5); }

    /* Setlist */
    ol.setlist {
      list-style: none;
      counter-reset: song;
      font-size: .92rem; line-height: 1.55;
      margin-bottom: 1.25rem;
    }
    ol.setlist li {
      counter-increment: song;
      position: relative;
      padding: .2rem 3.4rem .2rem 2.5rem; /* right pad reserves room for the per-song buttons */
      border-bottom: 1px solid rgba(40,30,20,.08);
    }
    /* Song title doubles as a YouTube link */
    a.setlist-song {
      color: inherit; text-decoration: none;
      transition: color .15s;
    }
    a.setlist-song:hover,
    a.setlist-song:focus-visible {
      color: var(--ink);
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 2px;
      text-decoration-color: var(--ink-ghost);
    }
    ol.setlist li::before {
      content: counter(song, decimal-leading-zero) ".";
      position: absolute; left: 0; top: .22rem;
      font-style: italic; font-size: .7rem; color: var(--ink-ghost);
    }
    ol.setlist li::after {
      content: ''; position: absolute;
      left: 1.8rem; top: .88em;
      width: .35rem; height: 1px;
      background: var(--ink); transform: rotate(-3deg);
    }
    .setlist-empty {
      font-style: italic; color: var(--ink-ghost);
      font-size: .88rem; margin-bottom: 1.25rem;
    }

    /* Per-song platform buttons — solid palette icons, always visible */
    .song-btns {
      position: absolute; right: 0; top: 50%;
      transform: translateY(-50%);
      display: flex; gap: 8px; align-items: center;
      opacity: .82; transition: opacity .18s;
    }
    ol.setlist li:hover .song-btns,
    ol.setlist li:focus-within .song-btns { opacity: 1; }
    .song-btn {
      display: flex; align-items: center; justify-content: center;
      width: 21.6px; height: 21.6px; /* ~20% larger tap targets */
      color: var(--ink-soft); text-decoration: none;
      transition: color .15s, transform .15s, filter .15s;
      flex-shrink: 0;
    }
    .song-btn svg { width: 15.6px; height: 15.6px; } /* ~20% larger icons */
    .song-btn-yt { color: var(--ink); }
    .song-btn-sp { color: var(--ink-soft); }
    .song-btn:hover {
      color: var(--ink);
      transform: scale(1.18);
      filter: drop-shadow(0 1px 1px rgba(21,17,13,.25));
    }
    .song-btn svg { display: block; }

    /* ── YouTube setlist player ──────────────────────────────────── */
    .yt-setlist { margin: .2rem 0 .9rem; }
    .yt-controls { display: flex; align-items: center; gap: .7rem; flex-wrap: wrap; }
    /* Outline twin of the Play button — same shape/size, mirrored tilt, so the
       two read as a matched pair while the filled one stays the primary action. */
    .yt-open-btn {
      display: inline-flex; align-items: center; gap: .5rem;
      font-family: inherit; font-size: .82rem; letter-spacing: .04em;
      text-transform: uppercase; text-decoration: none;
      color: var(--ink); background: transparent;
      border: 1px solid var(--ink); border-radius: 2px;
      padding: .42rem .8rem; cursor: pointer;
      transform: rotate(.5deg);
      transition: transform .15s, box-shadow .15s, background .15s, color .15s;
    }
    .yt-open-btn:hover {
      transform: rotate(.5deg) translateY(-1px);
      box-shadow: 3px 3px 0 var(--ink-soft);
      background: var(--ink); color: var(--paper);
    }
    .yt-open-btn svg { width: 15px; height: 15px; display: block; }
    /* Song titles that drive the inline player get a play affordance */
    .setlist-song.playable { cursor: pointer; }
    .setlist-song.playable::before {
      content: '▸'; opacity: 0; margin-right: .3em; color: var(--ink-soft);
      transition: opacity .15s;
    }
    .setlist-song.playable:hover::before { opacity: 1; }
    .yt-play-btn {
      display: inline-flex; align-items: center; gap: .5rem;
      font-family: inherit; font-size: .82rem; letter-spacing: .04em;
      text-transform: uppercase;
      color: var(--paper); background: var(--ink);
      border: 1px solid var(--ink); border-radius: 2px;
      padding: .42rem .8rem; cursor: pointer;
      transform: rotate(-.5deg);
      transition: transform .15s, box-shadow .15s, background .15s;
    }
    .yt-play-btn:hover { transform: rotate(-.5deg) translateY(-1px); box-shadow: 3px 3px 0 var(--ink-soft); }
    .yt-play-btn:active { transform: rotate(-.5deg) translateY(1px); box-shadow: none; } /* press */
    .yt-play-btn svg { width: 15px; height: 15px; display: block; }
    .yt-play-btn .yt-count {
      font-size: .72rem; opacity: .78;
      border: 1px solid var(--paper); border-radius: 999px;
      padding: 0 .4rem; line-height: 1.45;
    }
    .yt-setlist.playing .yt-play-btn { background: var(--ink-soft); }
    .yt-setlist.playing .yt-play-label::after { content: ' — stop'; }
    .yt-frame-host { margin-top: .7rem; }
    .yt-frame-host:empty { display: none; }
    .yt-note {
      font-size: .82rem; line-height: 1.5; color: var(--ink-soft);
      border: 1px dashed var(--ink-soft); border-radius: 3px;
      padding: .6rem .75rem; margin: 0;
    }
    .yt-note code { font-family: ui-monospace, monospace; font-size: .9em; }
    .yt-frame-host iframe {
      width: 100%; aspect-ratio: 16 / 9; height: auto;
      border: 0; border-radius: 6px; display: block;
      filter: sepia(.12) contrast(1.04);
    }
    .yt-float-back, .yt-float-close { display: none; }

    /* Floating corner card: when the setlist scrolls out of view, the active
       player pops to the bottom-right and stays put so playback keeps visible. */
    .yt-frame-host.floating {
      position: fixed; z-index: 80;
      right: clamp(.6rem, 2.2vw, 1.4rem);
      bottom: clamp(.6rem, 2.2vw, 1.4rem);
      width: min(360px, 78vw);
      margin: 0; padding: 6px;
      background: var(--paper, #efe7d6);
      border: 1px solid var(--ink-soft);
      border-radius: 8px;
      box-shadow: 4px 6px 0 rgba(21,17,13,.22), 0 12px 30px rgba(21,17,13,.28);
      transform: rotate(-.5deg);
      animation: yt-float-in .28s ease-out;
    }
    @keyframes yt-float-in {
      from { opacity: 0; transform: translateY(14px) rotate(-.5deg); }
      to   { opacity: 1; transform: translateY(0)    rotate(-.5deg); }
    }
    .yt-frame-host.floating iframe { border-radius: 5px; }
    .yt-frame-host.floating .yt-float-back {
      display: inline-block;
      position: absolute; top: -.7rem; left: -.7rem; z-index: 1;
      font: inherit; font-size: .68rem; letter-spacing: .04em; text-transform: uppercase;
      color: var(--paper, #efe7d6); background: var(--ink, #15110d);
      border: 0; border-radius: 999px; padding: .25rem .6rem;
      cursor: pointer; transform: rotate(-1.5deg);
      box-shadow: 2px 2px 0 rgba(21,17,13,.25);
    }
    .yt-frame-host.floating .yt-float-back:hover { transform: rotate(-1.5deg) scale(1.05); }
    .yt-frame-host.floating .yt-float-close {
      display: inline-flex; align-items: center; justify-content: center;
      position: absolute; top: -.7rem; right: -.7rem; z-index: 1;
      width: 1.5rem; height: 1.5rem; font-size: 1rem; line-height: 1;
      color: var(--paper, #efe7d6); background: var(--ink, #15110d);
      border: 0; border-radius: 999px; cursor: pointer; transform: rotate(2deg);
      box-shadow: 2px 2px 0 rgba(21,17,13,.25);
    }
    .yt-frame-host.floating .yt-float-close:hover { transform: rotate(2deg) scale(1.08); }
    @media (prefers-reduced-motion: reduce) {
      .yt-frame-host.floating { animation: none; }
    }

    /* Spotify */
    .spotify-frame {
      width: 100%; border: 0; border-radius: 6px; display: block; margin-top: 1rem;
      flex: 1 1 auto;        /* stretch down to the bottom of the bordered box */
      /* Spotify renders the COMPACT (short) player when the frame loads under
         ~352px, leaving empty space below it; >=352 switches to the full player
         whose track list fills the height. Keep secondary-band frames tall. */
      min-height: 352px;
    }
    /* Controllable embed wrapper (IFrame API fills it with an <iframe>).
       Mirror .spotify-frame: stretch to the bottom of the bordered box. The
       IFrame API hard-codes height:352 on the iframe, so force it to fill. */
    .spotify-embed-wrap {
      display: flex; flex-direction: column; width: 100%;
      flex: 1 1 auto; min-height: 352px; margin-top: 1rem;
      position: relative;
    }
    /* Loading skeleton: a faint pulsing "vinyl" sits under the embed so the
       box is never dead-blank while Spotify's controller mounts. The real
       iframe (z-index above) covers it the moment it renders. */
    .spotify-embed-wrap::before {
      content: '';
      position: absolute; inset: 0; z-index: 0;
      border-radius: 6px;
      background:
        radial-gradient(circle at 50% 50%,
          rgba(21,17,13,.16) 0 7px,            /* label */
          transparent 8px 15px,
          rgba(21,17,13,.10) 16px 17px,        /* grooves */
          transparent 18px 23px,
          rgba(21,17,13,.08) 24px 25px,
          transparent 26px 31px,
          rgba(21,17,13,.06) 32px 33px,
          transparent 34px),
        var(--paper-deep);
      opacity: .5;
      animation: spotify-skeleton 1.5s ease-in-out infinite alternate;
    }
    @keyframes spotify-skeleton { from { opacity: .3; } to { opacity: .65; } }
    @media (prefers-reduced-motion: reduce) {
      .spotify-embed-wrap::before { animation: none; }
    }
    .spotify-embed-wrap iframe {
      width: 100% !important; height: 100% !important; flex: 1 1 auto;
      min-height: 352px; border: 0; border-radius: 6px;
      position: relative; z-index: 1;
    }

    /* ── Sports scoreboard (e.g. Raptors vs Lakers) ──────────────── */
    .sports-panel { max-width: 640px; margin: 0 auto; padding: 1rem 0 .25rem; }
    .scoreboard {
      display: flex; align-items: center; justify-content: center;
      gap: 1.4rem; padding: .5rem 1rem 1.6rem;
    }
    .sb-team {
      flex: 1; min-width: 0;
      display: flex; flex-direction: column; align-items: center; gap: .55rem;
    }
    .sb-team.lose { opacity: .68; }
    .team-logo {
      height: 104px; width: auto; max-width: 100%; object-fit: contain;
      filter: drop-shadow(2px 3px 0 rgba(21,17,13,.18));
      will-change: transform; transform-origin: center center;
    }
    /* Shown if a team logo fails to load — the abbreviation as an ink wordmark */
    .team-logo-fallback {
      height: 104px; display: flex; align-items: center; justify-content: center;
      font-family: var(--ff-disp); font-size: 2.6rem; letter-spacing: .03em;
      color: var(--ink); will-change: transform; transform-origin: center center;
    }
    .sb-score {
      font-family: var(--ff-disp); font-size: 3rem; line-height: 1; color: var(--ink);
    }
    .sb-team.lose .sb-score { color: var(--ink-soft); }
    .sb-vs {
      font-family: var(--ff-body); font-style: italic;
      font-size: 1.05rem; letter-spacing: .14em; color: var(--ink-ghost);
      flex: 0 0 auto;
    }
    .sb-final-tag {
      text-align: center; font-family: var(--ff-body); font-style: italic;
      font-size: .82rem; letter-spacing: .06em; color: var(--ink-soft);
      margin: -.5rem 0 .25rem;
    }
    /* line-score table */
    .linescore { width: 100%; border-collapse: collapse; font-family: var(--ff-body); }
    .linescore th, .linescore td {
      padding: .3rem .2rem; text-align: center; font-size: .9rem;
      border-bottom: 1px solid rgba(90,74,58,.18);
    }
    .linescore thead th { color: var(--ink-ghost); font-weight: 400; font-style: italic; }
    .linescore td.team-cell { text-align: left; font-weight: 700; letter-spacing: .04em; }
    .linescore td.final-cell { font-weight: 700; }
    .linescore tr.is-win td { color: var(--ink); }
    .linescore tr.is-lose td { color: var(--ink-soft); }
    /* leaders */
    .leaders-group + .leaders-group { margin-top: .9rem; }
    .leaders-team {
      font-family: var(--ff-body); font-style: italic; letter-spacing: .05em;
      color: var(--ink-soft); font-size: .82rem; margin-bottom: .25rem;
    }
    .leader-row { display: flex; justify-content: space-between; gap: .6rem; padding: .12rem 0; }
    .leader-name { font-family: var(--ff-body); font-size: .92rem; color: var(--ink); }
    .leader-line { font-family: var(--ff-body); font-size: .82rem; color: var(--ink-soft); white-space: nowrap; }

    /* ── Support acts in panel ───────────────────────────────────── */
    .panel-full { grid-column: 1 / -1; }

    .support-acts {
      padding-top: 1.25rem;
      border-top: 1px dashed var(--ink-ghost);
    }
    .support-act {
      margin-bottom: 1.5rem;
    }
    .support-act + .support-act {
      padding-top: 1rem;
      border-top: 1px solid rgba(40,30,20,.08);
    }
    .support-act-name {
      font-family: var(--ff-disp);
      font-size: 1.25rem;
      line-height: 1;
      margin-bottom: .2rem;
    }
    .support-act-role {
      font-style: italic;
      font-size: .68rem;
      color: var(--ink-ghost);
      text-transform: uppercase;
      letter-spacing: .14em;
      margin-bottom: .5rem;
    }

    /* ── Footer ───────────────────────────────────────────────────── */
    #site-footer {
      text-align: center;
      padding: 5rem 2rem 4rem;
      font-style: italic; font-size: .78rem;
      letter-spacing: .22em; color: var(--ink-ghost);
    }

    /* ── Responsive: phones ───────────────────────────────────────────
       The alternating two-column timeline squeezes each text column to
       ~138px on a 375px screen — band names wrap badly and logos shrink.
       Below 600px we stack each stop into a single centered column. The
       ink-snake threads through the .stop-marker centres, which stay
       centered in both layouts, so the path is unaffected. */
    @media (max-width: 600px) {
      #stops-container { padding: 0 1rem; }
      .stop { padding-block: 2.1rem; }
      .stop:first-child { padding-top: 1.5rem; }

      .stop-btn {
        grid-template-columns: 1fr;
        justify-items: center;
        row-gap: .55rem;
      }
      .stop-marker { grid-column: 1; }

      /* Override the left/right alternation → everything centered below marker */
      .stop-meta,
      .stop.left  .stop-meta,
      .stop.right .stop-meta {
        grid-column: 1;
        text-align: center;
        align-items: center;
        padding-inline: .25rem;
        max-width: 100%;
      }
      .stop-name { font-size: clamp(1.4rem, 7.2vw, 1.95rem); }

      .band-logo,
      .stop.left .band-logo {
        height: 88px;
        margin-left: auto; margin-right: auto;
        object-position: center bottom;
      }
      .stop-support-logos,
      .stop.left .stop-support-logos { justify-content: center; }

      /* Tabs fit on one comfortable row */
      #tab-bar { gap: .5rem; }
      .tab-btn { padding: .46rem 1rem; font-size: .8rem; }

      /* Tighter panel chrome on small screens */
      .panel-logo-banner { padding: 1rem 1rem .25rem; gap: .9rem; }
      .stop-panel-inner > div { padding: .85rem .85rem 1rem; }
      .panel-tour { font-size: 1.35rem; }
    }

    /* ── Respect reduced-motion preference ────────────────────────────
       Kill the perpetual + scroll-driven motion for users (and reviewers)
       who ask for less animation. JS also reads this flag to skip the
       infinite GSAP tweens and the parallax atmospherics. */
    @media (prefers-reduced-motion: reduce) {
      .ink-path-flow { animation: none; }
      .stop { opacity: 1 !important; }
      .stop-marker { transition: none; }
    }
  </style>
</head>
<body>

  <!-- ─ SVG filter (displacement for ink roughness on marks) ──── -->
  <svg width="0" height="0" style="position:absolute;pointer-events:none" aria-hidden="true">
    <defs>
      <filter id="ink-rough" x="-12%" y="-12%" width="124%" height="124%">
        <feTurbulence type="turbulence" baseFrequency=".022 .055" numOctaves="2" seed="9" result="n"/>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="2.4" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
      <!-- long-wavelength wobble for the timeline guide line (handwritten feel) -->
      <filter id="ink-rough-line" x="-5%" y="-5%" width="110%" height="110%">
        <feTurbulence type="fractalNoise" baseFrequency=".006 .011" numOctaves="2" seed="4" result="n"/>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="4.5" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
    </defs>
  </svg>

  <!-- ─ Hero ─────────────────────────────────────────────────── -->
  <header id="hero">
    <div id="ink-blot" aria-hidden="true">
      <svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg">
        <path d="M150,22 C196,8 244,36 262,82 C280,128 270,180 244,210
                 C218,240 176,252 138,246 C100,240 64,216 46,182
                 C28,148 26,104 48,74 C70,44 104,36 150,22 Z"/>
      </svg>
    </div>
    <p id="hero-kicker"><a id="hero-av" href="https://antonveselskyi.com" target="_blank" rel="noopener" aria-label="Anton Veselskyi"><span>A</span><span>V</span></a></p>
    <h1 id="hero-title">Concerts</h1>
    <div id="hero-rule"></div>
    <nav id="tab-bar" aria-label="Category filter">
      <button class="tab-btn active" data-tab="music">Concerts</button>
      <button class="tab-btn" data-tab="other">Comedy &amp; Talks</button>
      <button class="tab-btn" data-tab="sports">Sports</button>
    </nav>
  </header>

  <!-- ─ Timeline ──────────────────────────────────────────────── -->
  <main id="timeline">
    <svg id="line-svg"       aria-hidden="true"></svg>
    <svg id="line-svg-front" aria-hidden="true"></svg>
    <div id="stops-container"></div>
  </main>

  <footer id="site-footer">— end of record —</footer>

  <script>
    /* ═══════════════════════════════════════════════════════════════
       CONCERT DATA — edit this array to add / update shows.
       date format: "DD Mon YYYY" (display only, no parsing needed)
       spotifyEmbed: paste the src= URL from Spotify's embed dialog
    ═══════════════════════════════════════════════════════════════ */
    const concerts = [
      {
        "id": "poppy-toronto-2026-07-15",
        "artist": "Poppy",
        "tourName": "Constantly Nowhere Tour",
        "date": "Wed · Jul 15, 2026",
        "isoDate": "2026-07-15",

    /* ═══════════════════════════════════════════════════════════════
       GSAP setup
    ═══════════════════════════════════════════════════════════════ */
    gsap.registerPlugin(ScrollTrigger);

    /* Honour the OS "reduce motion" setting and treat phones as motion-light:
       both skip the perpetual GSAP tweens and the heavy parallax atmospherics,
       which is where most scroll jank comes from. */
    const REDUCE_MOTION = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const SMALL_SCREEN  = window.matchMedia('(max-width: 600px)').matches;

    /* Photos & media thumbs fade in once decoded (see .img-ld CSS) — without
       this, lazy-loaded images pop in mid-scroll. Capture phase so it catches
       imgs inserted later; 'error' too so a dead URL never stays a blank hole.
       The late sweep is a belt-and-braces guarantee against any missed event. */
    const _markImgLoaded = e => {
      if (e.target instanceof HTMLImageElement) e.target.classList.add('img-ld');
    };
    document.addEventListener('load',  _markImgLoaded, true);
    document.addEventListener('error', _markImgLoaded, true);
    window.addEventListener('load', () => setTimeout(() => {
      document.querySelectorAll('img:not(.img-ld)').forEach(i => {
        if (i.complete) i.classList.add('img-ld');
      });
    }, 1500));

    /* Graceful logo fallback — a dead/blocked logo URL (e.g. a hotlink-blocked
       image) would otherwise show the browser's broken-image icon. We catch
       image load failures in the capture phase (error events don't bubble) and
       degrade each logo to readable text instead:
         · panel banner logo → the artist name as a styled wordmark
         · scoreboard team logo → the team abbreviation as an ink wordmark
         · card / support logos → hidden (the artist name is already shown). */
    document.addEventListener('error', e => {
      const img = e.target;
      if (!(img instanceof HTMLImageElement) || img.dataset.fbDone) return;
      img.dataset.fbDone = '1';

      if (img.classList.contains('band-logo')) {
        const banner = img.closest('.panel-logo-banner');
        if (banner) {
          const span = document.createElement('span');
          span.className = 'band-block-name' + nameStyleClass(img.dataset.namestyle || '');
          span.textContent = img.getAttribute('alt') || '';
          banner.classList.add('band-name-banner');
          banner.replaceChildren(span);
        } else {
          img.style.display = 'none'; // timeline card — name already visible
        }
      } else if (img.classList.contains('team-logo')) {
        const span = document.createElement('span');
        span.className = 'team-logo team-logo-fallback';
        span.dataset.win = img.dataset.win || '0';
        span.textContent = img.dataset.abbr || (img.getAttribute('alt') || '').slice(0, 3).toUpperCase();
        img.replaceWith(span);
      } else if (img.classList.contains('stop-support-logo')) {
        img.style.display = 'none';
      }
    }, true);


    /* ═══════════════════════════════════════════════════════════════

    ═══════════════════════════════════════════════════════════════ */
    function esc(str) {
      return String(str)
        .replace(/&/g,'&amp;').replace(/</g,'&lt;')
        .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function crosshairSVG() {
      return `<svg width="20" height="20" viewBox="0 0 20 20" fill="none"
                   style="filter:url(#ink-rough)" aria-hidden="true">
        <line x1="10" y1="1"  x2="10" y2="19" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="1"  y1="10" x2="19" y2="10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        <line x1="3.5" y1="3.5" x2="16.5" y2="16.5" stroke="currentColor" stroke-width=".9" stroke-linecap="round"/>
        <line x1="16.5" y1="3.5" x2="3.5" y2="16.5" stroke="currentColor" stroke-width=".9" stroke-linecap="round"/>
        <circle cx="10" cy="10" r="2.2" fill="currentColor"/>
      </svg>`;
    }

    // Expand / theatre-mode icon (corner brackets)
    const ICON_EXPAND = `<svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M2 6V2h4"/><path d="M14 6V2h-4"/><path d="M2 10v4h4"/><path d="M14 10v4h-4"/>
    </svg>`;

    function setlistHTML(list, artist, spotifyMap, ytMap) {
      if (!list || list.length === 0)
        return `<p class="setlist-empty">— to be added —</p>`;
      const playIds = list.map(s => ytMap && ytMap[s]).filter(Boolean);
      // watch_videos builds an ad-hoc YouTube playlist from raw video IDs —
      // lets "Open on YouTube" launch the whole setlist in order, no account.
      const ytPlaylistUrl = playIds.length
        ? `https://www.youtube.com/watch_videos?video_ids=${playIds.join(',')}`
        : '';
      const player  = playIds.length
        ? `<div class="yt-setlist">
             <div class="yt-controls">
               <button type="button" class="yt-play-btn" data-ids="${playIds.join(',')}"
                       aria-label="Play this setlist in the inline player">
                 ${ICON_YT}<span class="yt-play-label">Play setlist</span>
                 <span class="yt-count">${playIds.length}</span>
               </button>
                <a class="yt-open-btn" href="${ytPlaylistUrl}" target="_blank" rel="noopener"
                   title="Open this setlist as a playlist on YouTube">${ICON_YT}<span>Open on YouTube ↗</span></a>
              </div>
              <div class="yt-frame-host"></div>
            </div>`
        : '';
      let ytIndex = -1;   // running position within playIds (skips songs w/o a video)
      const rows = list.map(song => {
        const q         = encodeURIComponent((artist ? artist + ' ' : '') + song);
        const trackId   = spotifyMap && spotifyMap[song];
        const sp        = trackId
          ? `https://open.spotify.com/track/${trackId}`
          : `https://open.spotify.com/search/${q}`;
        const spTitle   = trackId ? 'Open on Spotify' : 'Search on Spotify';
        const ytVideoId = ytMap && ytMap[song];
        if (ytVideoId) ytIndex++;
        const yt        = ytVideoId
          ? `https://www.youtube.com/watch?v=${ytVideoId}`
          : `https://www.youtube.com/results?search_query=${q}`;
        const ytTitle   = ytVideoId ? 'Watch on YouTube' : 'Search on YouTube';
        // The song title drives the inline player (jumps to this track);
        // the YouTube icon still opens a new tab.
        const titleAttrs = ytVideoId
          ? `class="setlist-song playable" data-yt-index="${ytIndex}" title="Play in setlist player"`
          : `class="setlist-song" title="${ytTitle}"`;
        return `<li>
          <a href="${yt}" target="_blank" rel="noopener" ${titleAttrs}>${esc(song)}</a>
          <span class="song-btns">
            <a href="${yt}" target="_blank" rel="noopener" class="song-btn song-btn-yt" title="${ytTitle}">${ICON_YT}</a>
            <a href="${sp}" target="_blank" rel="noopener" class="song-btn song-btn-sp" title="${spTitle}">${ICON_SP}</a>
          </span>
        </li>`;
      }).join('');
      return `${player}<ol class="setlist">${rows}</ol>`;
    }

    function photosHTML(photos) {
      if (photos && photos.length > 0) {
        return `<div class="photo-grid">${photos.map(src =>
          `<div class="photo-slot"><img src="${esc(src)}" alt="" loading="lazy"/></div>`
        ).join('')}</div>`;
      }
      // placeholder grid
      return `<div class="photo-grid">
        <div class="photo-slot">coming</div>
        <div class="photo-slot">coming</div>
        <div class="photo-slot">coming</div>
      </div>`;
    }

    // Convert an embed URL (…/embed/artist/ID) to a Spotify URI (spotify:artist:ID)
    // so we can drive it with the IFrame API (for play/pause coordination).
    function spotifyUri(embed) {
      const m = (embed || '').match(/open\.spotify\.com\/embed\/(\w+)\/([A-Za-z0-9]+)/);
      return m ? `spotify:${m[1]}:${m[2]}` : '';
    }
    function spotifyHTML(embed) {
      const head = `<p class="panel-h">Get familiar with the band</p>`;
      if (!embed) return `${head}<p class="setlist-empty" style="margin-top:.4rem">♪ playlist embed coming</p>`;
      const uri = spotifyUri(embed);
      // No parseable URI → fall back to the plain (uncontrollable) iframe.
      if (!uri) return `${head}<iframe class="spotify-frame" src="${esc(embed)}" height="352"
                allow="encrypted-media" loading="lazy" style="margin-top:.15rem"></iframe>`;
      // Controllable embed: a wrapper the Spotify IFrame API fills with an iframe
      // once it scrolls into view. Lets us pause it when YouTube plays (& back).
      return `${head}<div class="spotify-embed-wrap" style="margin-top:.15rem"
                ><div class="spotify-embed" data-spotify-uri="${esc(uri)}" data-spotify-embed="${esc(embed)}"></div></div>`;
    }

    /* ── Media player ────────────────────────────────────────────────
       Curated photo + video viewer with a framed "stage" and a filmstrip.
       Accepts b.media [{type:'image'|'video', src, poster?}] or falls back
       to b.photos (string[]). Videos preload metadata only (files are big). */
    function mediaItems(b) {
      if (b.media && b.media.length)   return b.media;
      if (b.photos && b.photos.length) return b.photos.map(src => ({ type: 'image', src }));
      return [];
    }
    function mediaStageInner(m) {
      if (m.type === 'video') {
        return `<video class="media-el" src="${esc(m.src)}" poster="${esc(m.poster || '')}"
                  controls preload="metadata" playsinline></video>`;
      }
      return `<img class="media-el" src="${esc(m.src)}" alt="" loading="lazy">`;
    }
    function mediaMeta(m, idx, total) {
      const label = m.type === 'video' ? 'Live footage' : 'Photograph';
      const n = String(idx + 1).padStart(2, '0');
      const t = String(total).padStart(2, '0');
      return `<span class="media-label">${label}</span>` +
             `<span class="media-counter">${n} / ${t}</span>`;
    }
    function mediaHTML(b) {
      const items = mediaItems(b);
      if (!items.length) return photosHTML(b.photos); // placeholder "coming" grid

      const thumbs = items.map((m, i) => {
        const isVid = m.type === 'video';
        const tsrc  = isVid ? (m.poster || '') : m.src;
        return `<button type="button" class="media-thumb${i === 0 ? ' active' : ''}"
                  data-type="${esc(m.type)}" data-src="${esc(m.src)}" data-poster="${esc(m.poster || '')}"
                  aria-label="${isVid ? 'Play clip' : 'View photo'} ${i + 1}">
                  ${tsrc ? `<img src="${esc(tsrc)}" alt="" loading="lazy">` : '<span class="media-thumb-fallback">&#9654;</span>'}
                  ${isVid ? '<span class="media-thumb-badge">&#9654;</span>' : ''}
                </button>`;
      }).join('');

      return `<div class="media-player" data-total="${items.length}" data-band="${esc(b.artist)}">
                <button type="button" class="media-expand" aria-label="Theatre mode" title="Theatre mode">${ICON_EXPAND}</button>
                <div class="media-stage">${mediaStageInner(items[0])}</div>
                <div class="media-meta">${mediaMeta(items[0], 0, items.length)}</div>
                <div class="media-strip">${thumbs}</div>
              </div>`;
    }

    /* Sports scoreboard panel — two team logos facing off (shaken by GSAP),
       final score, quarter-by-quarter line score, and top performers. */
    function sportsPanelHTML(c) {
      const g = c.game;
      const teamCol = (t, win) => `
        <div class="sb-team ${win ? 'win' : 'lose'}">
          <img class="team-logo" src="${esc(t.logo)}" alt="${esc(t.team)}" data-win="${win ? 1 : 0}" data-abbr="${esc(t.abbr)}" loading="lazy">
          <span class="sb-score">${t.score}</span>
        </div>`;
      const lsRow = (t, win) => `
        <tr class="${win ? 'is-win' : 'is-lose'}">
          <td class="team-cell">${esc(t.abbr)}</td>
          ${t.quarters.map(q => `<td>${q}</td>`).join('')}
          <td class="final-cell">${t.score}</td>
        </tr>`;
      const leaders = (title, arr) => `
        <div class="leaders-group">
          <p class="leaders-team">${esc(title)}</p>
          ${arr.map(p => `<div class="leader-row"><span class="leader-name">${esc(p.name)}</span><span class="leader-line">${esc(p.line)}</span></div>`).join('')}
        </div>`;
      return `<div class="sports-panel">
        <div class="scoreboard">
          ${teamCol(g.home, g.home.win)}
          <span class="sb-vs">VS</span>
          ${teamCol(g.away, g.away.win)}
        </div>
        <p class="sb-final-tag">FINAL &middot; ${esc(c.venue)} &middot; ${esc(c.date)}</p>
        <div class="stop-panel-inner">
          <div>
            <p class="panel-h">Line Score</p>
            <table class="linescore">
              <thead><tr><th></th><th>1</th><th>2</th><th>3</th><th>4</th><th>F</th></tr></thead>
              <tbody>
                ${lsRow(g.home, g.home.win)}
                ${lsRow(g.away, g.away.win)}
              </tbody>
            </table>
            ${c.notes ? `<p class="panel-notes" style="margin-top:.9rem">${esc(c.notes)}</p>` : ''}
          </div>
          <div>
            <p class="panel-h">Top Performers</p>
            ${leaders(g.home.team, g.leadersHome)}
            ${leaders(g.away.team, g.leadersAway)}
          </div>
        </div>
      </div>`;
    }

    /* Map a band's nameStyle to the wordmark CSS class (blank = default blackletter). */
    function nameStyleClass(style) {
      const map = { serif: ' name-serif', cond: ' name-cond', didone: ' name-didone' };
      return map[style] || '';
    }

    /* One band's section — used for the headliner AND every support act,
       so every artist on the bill gets the same logo-banner + two-column layout. */
    function bandBlockHTML(b, isHeadliner) {
      const banner = b.logo
        ? `<div class="panel-logo-banner"${isHeadliner ? ' data-head="1"' : ''}>
             <img class="band-logo${b.logoInvert ? ' logo-invert' : ''}" src="${esc(b.logo)}" alt="${esc(b.artist)}" data-namestyle="${esc(b.nameStyle || '')}" loading="lazy">
           </div>`
        : `<div class="panel-logo-banner band-name-banner"${isHeadliner ? ' data-head="1"' : ''}>
             <span class="band-block-name${nameStyleClass(b.nameStyle)}">${esc(b.artist)}</span>
           </div>`;

      let left;
      if (isHeadliner) {
        left = `
          <p class="panel-h">Tour</p>
          <p class="panel-tour">${esc(b.tourName)}</p>
          <p class="panel-where">${esc(b.venue)}</p>
          <p class="panel-when">${esc(b.date)} &middot; ${esc(b.city)}</p>
          ${b.notes ? `<p class="panel-notes">${esc(b.notes)}</p>` : ''}
          ${spotifyHTML(b.spotifyEmbed)}`;
      } else {
        left = `
          ${b.notes ? `<p class="panel-notes" style="margin-top:0">${esc(b.notes)}</p>` : ''}
          ${spotifyHTML(b.spotifyEmbed)}`;
      }

      const right = `
        ${isHeadliner ? `<p class="panel-h">Media</p>${mediaHTML(b)}` : ''}
        <p class="panel-h">Setlist</p>
        ${setlistHTML(b.setlist, b.artist, b.setlistSpotify, b.setlistYTMusic)}`;

      return `<div class="band-block${isHeadliner ? ' is-headliner' : ''}">
        ${banner}
        <div class="stop-panel-inner">
          <div class="panel-col-left">${left}</div>
          <div class="panel-col-right">${right}</div>
        </div>
      </div>`;
    }


    /* ═══════════════════════════════════════════════════════════════
       BUILD STOP HTML → inject into DOM
    ═══════════════════════════════════════════════════════════════ */
    (function buildStops() {
      const container = document.getElementById('stops-container');
      let lastYear = null;
      concerts.forEach((c, i) => {
        // ── Year-change divider ────────────────────────────────────
        const year = c.isoDate ? c.isoDate.slice(0, 4) : null;
        if (year && year !== lastYear) {
          const div = document.createElement('div');
          div.className = 'year-divider';
          div.dataset.year = year;
          div.setAttribute('aria-hidden', 'true');
          div.innerHTML = `<span class="year-divider-label">${year}</span>`;
          container.appendChild(div);
        }
        if (year) lastYear = year;

        const side = i % 2 === 0 ? 'right' : 'left';
        const article = document.createElement('article');
        const cat = concertCategory(c);
        article.className = `stop ${side}`;
        article.dataset.category = cat;
        if (year) article.dataset.isoYear = year;
        article.id = `stop-${esc(c.id)}`;
        article.innerHTML = `
          <button class="stop-btn" aria-expanded="false" aria-controls="panel-${esc(c.id)}">
            <div class="stop-marker">${crosshairSVG()}</div>
            <div class="stop-meta">
              ${c.logo ? `<img class="band-logo${c.logoInvert ? ' logo-invert' : ''}" src="${c.logo}" alt="${esc(c.artist)} logo" loading="lazy" />` : ''}
              ${c.supports && c.supports.some(s => s.logo)
                ? `<span class="stop-support-logos">${
                    c.supports.filter(s => s.logo).map(s =>
                      `<img class="stop-support-logo${s.role === 'co-headliner' ? ' co-headliner' : ''}${s.logoInvert ? ' logo-invert' : ''}" src="${esc(s.logo)}" alt="${esc(s.artist)}" title="${esc(s.artist)}" loading="lazy">`
                    ).join('')
                  }</span>`
                : ''}
              <span class="stop-name${nameStyleClass(c.nameStyle)}">${esc(c.artist)}</span>
              ${c.supports && c.supports.length
                ? `<span class="stop-supports">w/ ${c.supports.map(s => esc(s.artist)).join(' · ')}</span>`
                : ''}
              <span class="stop-date">${esc(c.date)} &middot; ${esc(c.city)}</span>
            </div>
          </button>
          <div class="stop-panel" id="panel-${esc(c.id)}" aria-hidden="true">
            ${cat === 'sports' && c.game
              ? sportsPanelHTML(c)
              : `${bandBlockHTML(c, true)}${(c.supports || []).map(s => bandBlockHTML(s, false)).join('')}`}
          </div>`;
        container.appendChild(article);
      });
    })();

    // Show stops for the active tab, and only the year-dividers that have at
    // least one event in that category (so Sports/Comedy don't show bare years).
    function applyTabFilter(tab) {
      document.querySelectorAll('.stop[data-category]').forEach(stopEl => {
        stopEl.style.display = stopEl.dataset.category === tab ? '' : 'none';
      });
      document.querySelectorAll('.year-divider').forEach(div => {
        const y = div.dataset.year;
        const hasEvent = !!document.querySelector(
          `.stop[data-category="${tab}"][data-iso-year="${y}"]`);
        div.style.display = hasEvent ? '' : 'none';
      });
    }

    // Default filter: show only music stops
    applyTabFilter('music');

    /* Make the face-off team logos rattle/shake continuously. The winner
       shakes with more confidence; the loser wobbles a touch softer. The
       function-based values + repeatRefresh re-roll a new jitter each cycle.
       Skipped under reduced-motion (it's a perpetual per-frame tween). */
    if (!REDUCE_MOTION) {
      gsap.utils.toArray('.team-logo').forEach(logo => {
        const k = logo.dataset.win === '1' ? 1 : 0.7;
        const tween = gsap.to(logo, {
          x: () => gsap.utils.random(-1.8, 1.8) * k,
          y: () => gsap.utils.random(-1.3, 1.3) * k,
          rotation: () => gsap.utils.random(-1.4, 1.4) * k,
          duration: 0.11,
          repeat: -1,
          repeatRefresh: true,
          ease: 'sine.inOut',
          paused: true,
        });
        // Only burn frames while the scoreboard is actually on screen.
        ScrollTrigger.create({
          trigger: logo,
          start: 'top bottom',
          end: 'bottom top',
          onToggle: self => self.isActive ? tween.play() : tween.pause(),
        });
      });
    }


    /* ═══════════════════════════════════════════════════════════════
       HERO ANIMATION
    ═══════════════════════════════════════════════════════════════ */
    if (REDUCE_MOTION) {
      // No entrance motion — just show the hero in its final state.
      gsap.set('#ink-blot',   { scale: 1, opacity: .06 });
      gsap.set('#hero-kicker',{ opacity: 1, y: 0 });
      gsap.set('#hero-title', { opacity: 1, y: 0 });
      gsap.set('#hero-rule',  { opacity: 1, scaleX: 1, transformOrigin: 'center' });
    } else {
      const heroTl = gsap.timeline({ defaults: { ease: 'power2.out' } });
      heroTl
        .fromTo('#ink-blot',
          { scale: .05, opacity: 0 },
          { scale: 1.08, opacity: .1, duration: .85, ease: 'expo.out' }
        )
        .to('#ink-blot',   { scale: 1, opacity: .06, duration: .5 }, '-=.25')
        .fromTo('#hero-kicker', { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: .5 }, '-=.55')
        .fromTo('#hero-title',  { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: .9 }, '-=.35')
        .fromTo('#hero-rule',
          { opacity: 0, scaleX: 0 },
          { opacity: 1, scaleX: 1, duration: .45, transformOrigin: 'center' },
          '-=.15'
        );
    }


    /* ═══════════════════════════════════════════════════════════════
       TIMELINE SVG — organic hand-drawn snake with traveling dot
       Path: Catmull-Rom spline through markers + wide apex points.
       Cover: white mask peeled away by scroll.
       Dot: circle that rides the path as you scroll.
    ═══════════════════════════════════════════════════════════════ */
    let _timelineSTs = []; // stored so we can kill them on tab change
    let peakProgress = 0; // lifted out — preserved across rebuilds
    let _prevPathD   = null; // previous snake `d` — morph target so rebuilds don't blink
    let _dotTween    = null; // idle pulse tween on the traveling dot
    let _skipMorphOnce = false; // skip the heavy snake morph on panel toggles (snappier)
    const _shownStops = new WeakSet(); // guards against re-animating visible stops

    function buildTimeline() {
      _timelineSTs.forEach(st => st.kill());
      _timelineSTs = [];
      const skipMorph = _skipMorphOnce; _skipMorphOnce = false;
      // NOTE: peakProgress is PRESERVED across rebuilds. Resetting it to 0 made the
      // already-drawn ink line flash away and re-draw on every panel open/close.
      if (_dotTween) { _dotTween.kill(); _dotTween = null; }

      const NS        = 'http://www.w3.org/2000/svg';
      const timelineEl = document.getElementById('timeline');
      const svgBack   = document.getElementById('line-svg');
      const svgFront  = document.getElementById('line-svg-front');

      // Only use VISIBLE stops (hidden category stops have offsetHeight 0)
      const stopEls = Array.from(document.querySelectorAll('.stop'))
                           .filter(el => el.offsetHeight > 0);

      const tw = timelineEl.offsetWidth;
      const th = timelineEl.offsetHeight;
      if (th < 10 || stopEls.length === 0) return;

      [svgBack, svgFront].forEach(s => {
        s.setAttribute('viewBox', `0 0 ${tw} ${th}`);
        s.setAttribute('width',  tw);
        s.setAttribute('height', th);
        s.innerHTML = '';
      });

      // Gather visible marker centres relative to #timeline top
      const timeLeft = timelineEl.getBoundingClientRect().left;
      const timeTop  = timelineEl.getBoundingClientRect().top + window.scrollY;
      const pts = stopEls.map(s => {
        const m = s.querySelector('.stop-marker');
        const r = m.getBoundingClientRect();
        return {
          x: r.left + r.width  / 2 - timeLeft,
          y: r.top  + r.height / 2 + window.scrollY - timeTop
        };
      });

      // ── Build organic snake via Catmull-Rom ──────────────────────
      const cx  = tw / 2;
      const amp = Math.min(cx * 0.68, 290);

      const snakePts = [{ x: cx, y: Math.max(0, pts[0].y - 110) }];
      for (let i = 0; i < pts.length; i++) {
        const prev = i === 0 ? snakePts[0] : pts[i - 1];
        const curr = pts[i];
        const side = i % 2 === 0 ? 1 : -1;
        const v    = 0.55 + ((i * 41 + 17) % 53) / 53 * 0.90;
        const t    = 0.40 + ((i * 29 + 11) % 37) / 37 * 0.20;
        snakePts.push({ x: cx + side * amp * v, y: prev.y + (curr.y - prev.y) * t });
        snakePts.push({ x: curr.x, y: curr.y });
      }
      snakePts.push({ x: cx, y: th - 20 }); // extend tail to near bottom of container

      // Hand-drawn imperfection: nudge each interior node by a small, DETERMINISTIC
      // amount (stable across rebuilds, so the morph always has a fixed target).
      const _jit = (i, s) => { const x = Math.sin(i * 12.9898 + s * 78.233) * 43758.5453; return (x - Math.floor(x)) - 0.5; };
      snakePts.forEach((p, i) => {
        if (i === 0 || i === snakePts.length - 1) return; // keep endpoints anchored
        p.x += _jit(i, 1) * 7;
        p.y += _jit(i, 2) * 4.5;
      });

      // Catmull-Rom → cubic bezier
      function crPath(points) {
        let d = `M ${points[0].x.toFixed(1)},${points[0].y.toFixed(1)}`;
        for (let i = 0; i < points.length - 1; i++) {
          const p0 = points[Math.max(0, i - 1)];
          const p1 = points[i];
          const p2 = points[i + 1];
          const p3 = points[Math.min(points.length - 1, i + 2)];
          const cp1x = p1.x + (p2.x - p0.x) / 6;
          const cp1y = p1.y + (p2.y - p0.y) / 6;
          const cp2x = p2.x - (p3.x - p1.x) / 6;
          const cp2y = p2.y - (p3.y - p1.y) / 6;
          d += ` C ${cp1x.toFixed(1)},${cp1y.toFixed(1)} ${cp2x.toFixed(1)},${cp2y.toFixed(1)} ${p2.x.toFixed(1)},${p2.y.toFixed(1)}`;
        }
        return d;
      }

      const d = crPath(snakePts);

      // ── Defs helper: clip rect + blur filter per SVG ─────────────
      function addDefs(svgEl, clipId, filterId) {
        const defs   = document.createElementNS(NS, 'defs');
        const clipEl = document.createElementNS(NS, 'clipPath');
        clipEl.setAttribute('id', clipId);
        const rect = document.createElementNS(NS, 'rect');
        rect.setAttribute('x', '-200');
        rect.setAttribute('y', '0');
        rect.setAttribute('width',  String(tw + 400));
        rect.setAttribute('height', '0');
        clipEl.appendChild(rect);
        defs.appendChild(clipEl);
        const filter = document.createElementNS(NS, 'filter');
        filter.setAttribute('id', filterId);
        filter.setAttribute('x', '-60%');   filter.setAttribute('y', '-60%');
        filter.setAttribute('width', '220%'); filter.setAttribute('height', '220%');
        const blur = document.createElementNS(NS, 'feGaussianBlur');
        blur.setAttribute('in', 'SourceGraphic');
        blur.setAttribute('stdDeviation', '2.8');
        filter.appendChild(blur);
        defs.appendChild(filter);
        svgEl.appendChild(defs);
        return rect;
      }
      const clipBack  = addDefs(svgBack,  'tlc-back',  'ink-blur-back');
      const clipFront = addDefs(svgFront, 'tlc-front', 'ink-blur-front');
      // Seed the freshly-rebuilt clip to however far the line was already drawn,
      // so a rebuild (panel open/close) never flashes the ink line back to empty.
      const seedH = String(th * peakProgress);
      clipBack.setAttribute('height',  seedH);
      clipFront.setAttribute('height', seedH);

      // ── Ghost: full route, always visible, faint dotted guide ────
      const ghostPath = document.createElementNS(NS, 'path');
      ghostPath.setAttribute('class', 'ink-path-ghost');
      ghostPath.setAttribute('d', d);
      svgBack.appendChild(ghostPath);

      // ── Ink bleed: wide blurred glow behind drawn portion ─────────
      const bleedPath = document.createElementNS(NS, 'path');
      bleedPath.setAttribute('d', d);
      bleedPath.setAttribute('fill',            'none');
      bleedPath.setAttribute('stroke',          'var(--ink)');
      bleedPath.setAttribute('stroke-width',    '8');
      bleedPath.setAttribute('stroke-linecap',  'round');
      bleedPath.setAttribute('opacity',         '0.055');
      bleedPath.setAttribute('filter',          'url(#ink-blur-back)');
      bleedPath.setAttribute('clip-path',       'url(#tlc-back)');
      svgBack.appendChild(bleedPath);

      // ── Main snake: animated flowing dots, clip-revealed ──────────
      const inkPath = document.createElementNS(NS, 'path');
      inkPath.setAttribute('class', 'ink-path ink-path-flow');
      inkPath.setAttribute('d', d);
      inkPath.setAttribute('clip-path', 'url(#tlc-back)');
      svgBack.appendChild(inkPath);

      // ── Detect an open panel → the line "splits in two" around it ──
      // Capture the panel's framed rect now; the two split strands + twin
      // dots are built below, once the main path length is known.
      let splitGeo = null;
      stopEls.forEach((stop) => {
        const panel = stop.querySelector('.stop-panel');
        if (panel && panel.getAttribute('aria-hidden') === 'false' && panel.scrollHeight > 60) {
          const pr  = panel.getBoundingClientRect();
          const tlr = timelineEl.getBoundingClientRect();
          const pad = 8; // gap between panel edge and the drawn strand
          splitGeo = {
            x: pr.left   - tlr.left - pad,
            y: pr.top    + window.scrollY - timeTop - pad,
            w: pr.right  - pr.left + pad * 2,
            h: pr.bottom - pr.top  + pad * 2,
          };
        }
      });

      // ── Traveling dot on FRONT SVG ────────────────────────────────
      const p0 = inkPath.getPointAtLength(0);

      // Soft ink-bleed halo behind the dot
      const dotBleed = document.createElementNS(NS, 'circle');
      dotBleed.setAttribute('r',       '11');
      dotBleed.setAttribute('fill',    'var(--ink)');
      dotBleed.setAttribute('opacity', '0.07');
      dotBleed.setAttribute('filter',  'url(#ink-blur-front)');
      dotBleed.setAttribute('cx', p0.x);
      dotBleed.setAttribute('cy', p0.y);
      svgFront.appendChild(dotBleed);

      const dot = document.createElementNS(NS, 'circle');
      dot.setAttribute('r',       '4.8');
      dot.setAttribute('fill',    'var(--ink)');
      dot.setAttribute('opacity', '0.68');
      dot.setAttribute('cx', p0.x);
      dot.setAttribute('cy', p0.y);
      svgFront.appendChild(dot);

      // Idle breathe: dot pulses gently like a beating heart.
      // (Skipped under reduced-motion — it's a perpetual tween.)
      if (!REDUCE_MOTION) {
        _dotTween = gsap.to(dot, {
          attr: { r: 7 },
          duration: 1.05,
          ease: 'sine.inOut',
          yoyo: true,
          repeat: -1,
        });
      }

      const L = inkPath.getTotalLength();

      // ── Centred-dot mapping ──────────────────────────────────────
      // A Y → length-fraction lookup so the dot can sit level with the viewport
      // centre. The dot then tracks scrolling at ~1:1 (stays centred on screen)
      // instead of being pinned low and sliding off the bottom, and only reaches
      // the path ends when the page itself is at the very top / bottom.
      const _yLUT = []; const LUTN = 140; let _maxLUTy = -Infinity;
      for (let i = 0; i <= LUTN; i++) {
        _maxLUTy = Math.max(_maxLUTy, inkPath.getPointAtLength(L * i / LUTN).y);
        _yLUT.push(_maxLUTy); // force monotonic so the inverse search is stable
      }
      function progAtViewportY(ty) {
        if (ty <= _yLUT[0])    return 0;
        if (ty >= _yLUT[LUTN]) return 1;
        let lo = 0, hi = LUTN;
        while (hi - lo > 1) { const mid = (lo + hi) >> 1; if (_yLUT[mid] < ty) lo = mid; else hi = mid; }
        const y0 = _yLUT[lo], y1 = _yLUT[hi];
        return (lo + (y1 > y0 ? (ty - y0) / (y1 - y0) : 0)) / LUTN;
      }
      function currentDotProg() {
        const H    = window.innerHeight;
        const sMax = Math.max(1, document.documentElement.scrollHeight - H);
        const topY = _yLUT[0], botY = _yLUT[LUTN];
        const s    = window.scrollY;
        const vcAt = (x) => x + H / 2 - timeTop;  // path-Y level with viewport centre at scroll x
        const m    = Math.min(H / 2, sMax / 2);   // ramp margin at each page end
        let ty;
        if (s < m) {
          // page top → centred: ramp up to the path top only in the first margin
          ty = topY + (vcAt(m) - topY) * (s / m);
        } else if (s > sMax - m) {
          // centred → page bottom: ramp down to the path end only in the last margin
          ty = botY + (vcAt(sMax - m) - botY) * ((sMax - s) / m);
        } else {
          // the whole middle of the page: dot sits dead-centred in the viewport
          ty = vcAt(s);
        }
        return progAtViewportY(Math.max(topY, Math.min(botY, ty)));
      }

      // ── Line "splits in two" around an open panel ─────────────────
      // Two dashed strands (same ink style as the snake) hug the panel's
      // left & right edges and rejoin at top & bottom; two dots ride them
      // while the scroll dot passes the panel's vertical band (the single
      // centre line + dot are hidden behind the panel's opaque background).
      let split = null;
      if (splitGeo) {
        const fx = splitGeo.x, fy = splitGeo.y, fw = splitGeo.w, fh = splitGeo.h;
        const topY = fy, botY = fy + fh, rX = fx + fw, cr = 12;
        const strandD = (edgeX) =>
          `M ${cx.toFixed(1)},${topY.toFixed(1)} ` +
          `Q ${edgeX.toFixed(1)},${topY.toFixed(1)} ${edgeX.toFixed(1)},${(topY+cr).toFixed(1)} ` +
          `L ${edgeX.toFixed(1)},${(botY-cr).toFixed(1)} ` +
          `Q ${edgeX.toFixed(1)},${botY.toFixed(1)} ${cx.toFixed(1)},${botY.toFixed(1)}`;
        const leftD  = strandD(fx);
        const rightD = strandD(rX);

        // Cheap "ink flows down both sides" reveal: a clip rect grows downward.
        // (Replaces the old stroke-dashoffset draw around the whole perimeter,
        // which re-tessellated the dash pattern every frame — the lag source.)
        const sClip = document.createElementNS(NS, 'clipPath');
        sClip.setAttribute('id', 'split-clip');
        const sRect = document.createElementNS(NS, 'rect');
        sRect.setAttribute('x', (fx - 6).toFixed(1));
        sRect.setAttribute('y', topY.toFixed(1));
        sRect.setAttribute('width',  (fw + 12).toFixed(1));
        sRect.setAttribute('height', REDUCE_MOTION ? fh.toFixed(1) : '0');
        sClip.appendChild(sRect);
        svgFront.appendChild(sClip);

        const mkStrand = (dd) => {
          const p = document.createElementNS(NS, 'path');
          p.setAttribute('class', 'ink-path ink-path-flow'); // identical dotted ink style
          p.setAttribute('d', dd);
