          p.setAttribute('opacity', '0.6');
          p.setAttribute('clip-path', 'url(#split-clip)');
          svgFront.appendChild(p);
          return p;
        };
        const leftStrand  = mkStrand(leftD);
        const rightStrand = mkStrand(rightD);
        if (!REDUCE_MOTION) {
          gsap.to(sRect, { attr: { height: fh.toFixed(1) }, duration: 0.5, ease: 'power2.out' });
        }

        const mkDot = (r, blur) => {
          const c = document.createElementNS(NS, 'circle');
          c.setAttribute('r', r);
          c.setAttribute('fill', 'var(--ink)');
          c.setAttribute('opacity', '0');
          if (blur) c.setAttribute('filter', 'url(#ink-blur-front)');
          svgFront.appendChild(c);
          return c;
        };
        const lBleed = mkDot('11', true), lDot = mkDot('4.8', false);
        const rBleed = mkDot('11', true), rDot = mkDot('4.8', false);

        // Progress band where the centre dot is vertically inside the panel.
        split = {
          enter: progAtViewportY(topY), exit: progAtViewportY(botY),
          leftStrand, rightStrand,
          lLen: leftStrand.getTotalLength(), rLen: rightStrand.getTotalLength(),
          lDot, rDot, lBleed, rBleed,
        };
      }

      // Position the centre dot and — when a panel is open — the twin strand
      // dots for a given scroll progress. The centre dot fades out while the
      // twins are out (it would otherwise float over the opaque panel).
      function updateDots(prog) {
        let mainOn = true;
        if (split && prog >= split.enter && prog <= split.exit) {
          mainOn = false;
          const f  = (prog - split.enter) / Math.max(1e-4, split.exit - split.enter);
          const lp = split.leftStrand.getPointAtLength(f * split.lLen);
          const rp = split.rightStrand.getPointAtLength(f * split.rLen);
          split.lDot.setAttribute('cx', lp.x.toFixed(1));   split.lDot.setAttribute('cy', lp.y.toFixed(1));
          split.rDot.setAttribute('cx', rp.x.toFixed(1));   split.rDot.setAttribute('cy', rp.y.toFixed(1));
          split.lBleed.setAttribute('cx', lp.x.toFixed(1)); split.lBleed.setAttribute('cy', lp.y.toFixed(1));
          split.rBleed.setAttribute('cx', rp.x.toFixed(1)); split.rBleed.setAttribute('cy', rp.y.toFixed(1));
          split.lDot.setAttribute('opacity', '0.68');  split.rDot.setAttribute('opacity', '0.68');
          split.lBleed.setAttribute('opacity', '0.07'); split.rBleed.setAttribute('opacity', '0.07');
        } else if (split) {
          split.lDot.setAttribute('opacity', '0');  split.rDot.setAttribute('opacity', '0');
          split.lBleed.setAttribute('opacity', '0'); split.rBleed.setAttribute('opacity', '0');
        }
        const pt = inkPath.getPointAtLength(prog * L);
        dot.setAttribute('cx', pt.x.toFixed(1));      dot.setAttribute('cy', pt.y.toFixed(1));
        dotBleed.setAttribute('cx', pt.x.toFixed(1)); dotBleed.setAttribute('cy', pt.y.toFixed(1));
        dot.setAttribute('opacity',      mainOn ? '0.68' : '0');
        dotBleed.setAttribute('opacity', mainOn ? '0.07' : '0');
      }

      // ── Morph the snake from its previous shape instead of hard-cutting ──
      // On a rebuild (panel open/close, tab switch) the new path used to pop in,
      // reading as a blink. Sample both shapes into matching point counts and
      // tween between them so the ink line smoothly re-flows into place.
      if (_prevPathD && _prevPathD !== d && !REDUCE_MOTION && !skipMorph) {
        const SAMPLES = 170;
        const sample = (dd) => {
          const tmp = document.createElementNS(NS, 'path');
          tmp.setAttribute('d', dd);
          tmp.style.visibility = 'hidden';
          svgBack.appendChild(tmp);
          const len = tmp.getTotalLength();
          const arr = [];
          for (let i = 0; i <= SAMPLES; i++) {
            const pt = tmp.getPointAtLength(len * i / SAMPLES);
            arr.push([pt.x, pt.y]);
          }
          tmp.remove();
          return arr;
        };
        const fromPts = sample(_prevPathD);
        const toPts   = sample(d);
        const toD = (pts) => 'M' + pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' L');
        const m = { k: 0 };
        gsap.to(m, {
          k: 1, duration: .6, ease: 'power2.inOut',
          onUpdate() {
            const k = m.k;
            const cur = fromPts.map((fp, i) => [
              fp[0] + (toPts[i][0] - fp[0]) * k,
              fp[1] + (toPts[i][1] - fp[1]) * k,
            ]);
            const dd = toD(cur);
            ghostPath.setAttribute('d', dd);
            bleedPath.setAttribute('d', dd);
            inkPath.setAttribute('d', dd);
          },
          onComplete() {
            ghostPath.setAttribute('d', d);
            bleedPath.setAttribute('d', d);
            inkPath.setAttribute('d', d);
          },
        });
      }
      _prevPathD = d;

      // ── Main scroll trigger — reveal + dot ───────────────────────
      // Span the WHOLE page so onUpdate fires across the entire scroll range
      // (including the hero above and the footer below the timeline) — the dot
      // reads raw scroll via currentDotProg(), so it tracks 1:1 and stays centred.
      const mainST = ScrollTrigger.create({
        trigger: document.documentElement,
        start:   'top top',
        end:     'bottom bottom',
        scrub:   1,
        onUpdate() {
          const dp = currentDotProg();
          // Grow the inked trail down to the dot (monotonic) so the line draws
          // as the dot leads, while the dot itself stays centred in the viewport.
          const frac = Math.min(1, inkPath.getPointAtLength(dp * L).y / th);
          if (frac > peakProgress) {
            peakProgress = frac;
            const h = String(th * peakProgress);
            clipBack.setAttribute('height',  h);
            clipFront.setAttribute('height', h);
          }
          updateDots(dp);
        }
      });
      _timelineSTs.push(mainST);

      // ── Per-stop entrance: fade + slide in from its side ─────────
      // Reveal a stop once. Guarded by _shownStops so it never re-animates
      // and — critically — so a stop can never be left stuck at opacity:0.
      function revealStop(stop)
      {
        if (_shownStops.has(stop))
        {
          // Already appeared on a previous timeline build — just ensure visible.
          // clearProps wipes the leftover transform so it doesn't establish a
          // containing block (which would trap the floating player's position:fixed).
          gsap.set(stop, { opacity: 1, x: 0, clearProps: 'transform' });
          return;
        }
        _shownStops.add(stop);
        if (REDUCE_MOTION) { gsap.set(stop, { opacity: 1, x: 0, clearProps: 'transform' }); return; }
        const fromX = stop.classList.contains('left') ? -24 : 24;
        gsap.fromTo(stop,
          { opacity: 0, x: fromX },
          // clearProps on complete: leaving an identity transform would make the
          // stop a containing block for fixed children → the floating corner
          // player would anchor to the stop instead of the viewport.
          { opacity: 1, x: 0, duration: .72, ease: 'power3.out', clearProps: 'transform' }
        );
      }

      stopEls.forEach((stop, i) =>
      {
        // Primary: reveal in sync with the ink line reaching this stop.
        _timelineSTs.push(ScrollTrigger.create({
          trigger: '#timeline',
          start:   `top+=${pts[i].y * .86} center`,
          once:    true,
          onEnter: () => revealStop(stop),
        }));
        // Fallback: the path-synced point for the lowest stop(s) can sit
        // below the deepest reachable scroll, so its "center" trigger never
        // fires and the stop stays invisible (this is what hid the Raptors
        // game on the Sports tab). A trigger on the element itself entering
        // the viewport guarantees every stop reveals.
        _timelineSTs.push(ScrollTrigger.create({
          trigger: stop,
          start:   'top 92%',
          once:    true,
          onEnter: () => revealStop(stop),
        }));
      });

      // Re-seed peakProgress from the current scroll position
      ScrollTrigger.refresh();
      // Paint the dots once for the current scroll position so an already-
      // scrolled-past open panel shows its twin dots immediately.
      updateDots(currentDotProg());
    }

    window.addEventListener('load', buildTimeline);

    // Re-flow the snake + marker triggers when the viewport changes (debounced):
    // without this the ink path drifts off the markers after a resize or a
    // phone orientation flip, and stays broken until reload.
    let _rzTO = null;
    window.addEventListener('resize', () => {
      clearTimeout(_rzTO);
      _rzTO = setTimeout(() => rebuildTimelineSettled(60), 150);
    });


    /* ═══════════════════════════════════════════════════════════════
       STOP CLICK → expand / collapse panel
    ═══════════════════════════════════════════════════════════════ */
    // Initialise all panels hidden
    document.querySelectorAll('.stop-panel').forEach(el => {
      gsap.set(el, { height: 0, opacity: 0 });
    });

    let openStop = null;

    /* ── FLIP helpers ──────────────────────────────────────────────── */
    /* Visible drawn-art rect of an object-fit:contain image inside its element
       box. Wide logos (e.g. Okean Elzy) get letterboxed: the element box is
       260×110 but the art only fills 260×~55. Flying/scaling the BOX between
       card and banner makes the visible art overshoot the frame mid-flight and
       pop at handoff — flying the ART rect keeps both endpoints pixel-true.
       Non-images and images without intrinsic size fall back to the box. */
    function _artRect(el, r) {
      if (!(el instanceof HTMLImageElement) || !el.naturalWidth || !el.naturalHeight) return r;
      const s = Math.min(r.width / el.naturalWidth, r.height / el.naturalHeight);
      const w = el.naturalWidth * s, h = el.naturalHeight * s;
      // computed object-position is "<x>% <y>%" for keyword/percentage values
      const pos = getComputedStyle(el).objectPosition.split(' ');
      const px  = pos[0].endsWith('%') ? parseFloat(pos[0]) / 100 : .5;
      const py  = (pos[1] || '50%').endsWith('%') ? parseFloat(pos[1]) / 100 : .5;
      return {
        left:   r.left + (r.width  - w) * px,
        top:    r.top  + (r.height - h) * py,
        width:  w,
        height: h,
      };
    }

    function _makeClone(srcImg, rect) {
      const c  = srcImg.cloneNode(true);
      const cs = getComputedStyle(srcImg);
      Object.assign(c.style, {
        position:      'fixed',
        left:          rect.left   + 'px',
        top:           rect.top    + 'px',
        width:         rect.width  + 'px',
        height:        rect.height + 'px',
        margin:        '0',
        padding:       '0',
        objectFit:     'contain',
        objectPosition:'center',
        mixBlendMode:  'multiply',
        zIndex:        '1001',
        pointerEvents: 'none',
        transform:     'none',
        transformOrigin:'top left',
        /* preserve text appearance for non-img clones (e.g. the date) */
        fontFamily:    cs.fontFamily,
        fontSize:      cs.fontSize,
        fontStyle:     cs.fontStyle,
        fontWeight:    cs.fontWeight,
        letterSpacing: cs.letterSpacing,
        lineHeight:    cs.lineHeight,
        color:         cs.color,
        textTransform: cs.textTransform,
        whiteSpace:    'nowrap',
      });
      document.body.appendChild(c);
      return c;
    }

    /* Instantly restore a stop's card logos (used when a competing stop is opened). */
    function _resetCardLogos(b, p) {
      const logo = b.querySelector('.band-logo');
      const supp = b.querySelector('.stop-support-logos');
      const date = b.querySelector('.stop-date');
      const name = b.querySelector('.stop-name');
      if (logo) gsap.set(logo, { opacity: 1, clearProps: 'transform' });
      if (supp) gsap.set(supp, { opacity: 1 });
      if (date) gsap.set(date, { opacity: 1, clearProps: 'transform' });
      if (name) gsap.set(name, { opacity: 1, clearProps: 'transform' });
      p.querySelectorAll('.panel-logo-banner img, .panel-logo-banner .band-block-name, .panel-when')
       .forEach(el => gsap.set(el, { opacity: 0 }));
    }

    /* Fade every support-band banner (logo img or name) in or out. */
    function _toggleSupportBanners(panel, show) {
      panel.querySelectorAll(
        '.band-block:not(.is-headliner) .panel-logo-banner img,' +
        '.band-block:not(.is-headliner) .panel-logo-banner .band-block-name'
      ).forEach(el => {
        if (show) gsap.fromTo(el, { opacity: 0 }, { opacity: 1, duration: .3 });
        else      gsap.to(el, { opacity: 0, duration: .2 });
      });
    }

    /* ── YouTube setlist player (IFrame API, lazy-loaded) ──────────────
       Each setlist gets a "Play setlist" button carrying its ordered video
       IDs in data-ids. On click we spin up a YT.Player and loadPlaylist the
       whole set, so the show plays start-to-finish in order. Only one player
       lives at a time; opening another setlist or any panel tears it down. */
    let _ytReady = false;
    const _ytWaiters = [];
    function whenYTReady(cb) {
      if (_ytReady && window.YT && window.YT.Player) { cb(); return; }
      _ytWaiters.push(cb);
      if (!document.getElementById('yt-iframe-api')) {
        const s = document.createElement('script');
        s.id = 'yt-iframe-api';
        s.src = 'https://www.youtube.com/iframe_api';
        document.head.appendChild(s);
      }
    }
    window.onYouTubeIframeAPIReady = function () {
      _ytReady = true;
      while (_ytWaiters.length) _ytWaiters.shift()();
    };

    /* ── Spotify IFrame API (lazy) ─────────────────────────────────────
       Plain Spotify <iframe> embeds can't be paused or observed, so a
       playing playlist would keep going under a YouTube setlist (and vice
       versa). We instead mount each embed through Spotify's IFrame API,
       which gives us a controller with play/pause + a playback_update event.
       Controllers are created LAZILY (only when an embed scrolls into view)
       because eagerly loading ~40 embeds is far too heavy. */
    let _spotifyAPI = null;            // the IFrameAPI object once ready
    const _spotifyApiWaiters = [];
    const _spotifyCtrls = [];          // { el, controller, playing }
    let _suppressSpotifyPause = false; // guard so our own pause() doesn't recurse

    function whenSpotifyReady(cb) {
      if (_spotifyAPI) { cb(_spotifyAPI); return; }
      _spotifyApiWaiters.push(cb);
      if (!document.getElementById('spotify-iframe-api')) {
        const s = document.createElement('script');
        s.id = 'spotify-iframe-api';
        s.src = 'https://open.spotify.com/embed/iframe-api/v1';
        document.head.appendChild(s);
      }
    }
    window.onSpotifyIframeApiReady = function (IFrameAPI) {
      _spotifyAPI = IFrameAPI;
      while (_spotifyApiWaiters.length) _spotifyApiWaiters.shift()(IFrameAPI);
    };

    // Pause the built-in YouTube player (called when a Spotify embed starts).
    function pauseYTPlayer() {
      if (_activeYT && _activeYT.player && _activeYT.player.pauseVideo) {
        try { _activeYT.player.pauseVideo(); } catch (e) {}
      }
    }
    // Pause every Spotify controller except an optional one (the new player).
    function pauseAllSpotify(except) {
      _suppressSpotifyPause = true;
      _spotifyCtrls.forEach(c => {
        if (c.controller && c !== except && c.playing) {
          try { c.controller.pause(); } catch (e) {}
          c.playing = false;
        }
      });
      // release the guard after the resulting playback_update events flush
      setTimeout(() => { _suppressSpotifyPause = false; }, 0);
    }

    // Build a controller for one .spotify-embed placeholder (idempotent).
    function mountSpotify(el) {
      if (el.dataset.spotifyMounted) return;
      el.dataset.spotifyMounted = '1';
      const uri   = el.dataset.spotifyUri;
      const embed = el.dataset.spotifyEmbed;
      const entry = { el, controller: null, playing: false };
      _spotifyCtrls.push(entry);

      // If the API never shows up (blocked/offline), fall back to a plain
      // iframe so the embed still works — just without coordinated pausing.
      let fellBack = false;
      const fallback = () => {
        if (fellBack || entry.controller) return;
        fellBack = true;
        el.innerHTML = `<iframe class="spotify-frame" src="${esc(embed)}" height="352"
          allow="encrypted-media" loading="lazy"></iframe>`;
      };
      const fbTimer = setTimeout(fallback, 4000);

      whenSpotifyReady(IFrameAPI => {
        if (fellBack) return;
        clearTimeout(fbTimer);
        try {
          IFrameAPI.createController(el, { uri, width: '100%', height: 352 }, ctrl => {
            entry.controller = ctrl;
            ctrl.addListener('playback_update', e => {
              const paused = !!(e && e.data && e.data.isPaused);
              if (!paused) {
                // started/resumed playing → become the sole audio source
                entry.playing = true;
                if (!_suppressSpotifyPause) { pauseYTPlayer(); pauseAllSpotify(entry); }
              } else {
                entry.playing = false;
              }
            });
          });
        } catch (e) { fallback(); }
      });
    }

    // Run cb when the main thread is idle (after the open animation), so the
    // heavy Spotify iframe injection never blocks the transition frames.
    const _whenIdle = (cb) => (window.requestIdleCallback
      ? requestIdleCallback(cb, { timeout: 1500 })
      : setTimeout(cb, 350));

    // Lazily mount Spotify embeds as their panels scroll into view. The actual
    // controller creation is deferred to idle time: the IntersectionObserver
    // fires WHILE a panel is expanding, and injecting the iframe synchronously
    // there froze the open animation for several frames (and made the camera
    // jump). Deferring keeps the open glide buttery; the embed pops in a moment
    // later once the motion has settled.
    let _spotifyObserver = null;
    function observeSpotify() {
      const els = document.querySelectorAll('.spotify-embed:not([data-spotify-mounted])');
      if (!els.length) return;
      if (!_spotifyObserver) {
        _spotifyObserver = new IntersectionObserver((entries, obs) => {
          entries.forEach(en => {
            if (en.isIntersecting) {
              const el = en.target;
              obs.unobserve(el);
              _whenIdle(() => mountSpotify(el));
            }
          });
        }, { rootMargin: '200px' });
      }
      els.forEach(el => _spotifyObserver.observe(el));
    }

    // Adding/removing the inline player (or floating it) changes the open
    // panel's height. The dashed frame is sized from that height, so without a
    // redraw it ends up too short and the last band-block pokes out the bottom.
    // Debounced + a follow-up tick to catch the iframe settling its layout.
    let _frameRedrawTO = null;
    function redrawTimelineSoon() {
      requestAnimationFrame(buildTimeline);
      clearTimeout(_frameRedrawTO);
      _frameRedrawTO = setTimeout(() => requestAnimationFrame(buildTimeline), 380);
    }

    // Coalesce timeline rebuilds during an open/close transition into ONE run
    // AFTER the motion settles. buildTimeline is heavy (kills + recreates every
    // ScrollTrigger and reflows every marker via getBoundingClientRect); running
    // it mid-glide made the camera jump and stutter. The snake just holds its
    // previous shape during the ~0.5s transition, then re-draws once, smoothly.
    let _tlSettleTO = null;
    function rebuildTimelineSettled(delay = 90) {
      clearTimeout(_tlSettleTO);
      _tlSettleTO = setTimeout(() => requestAnimationFrame(buildTimeline), delay);
    }

    let _activeYT = null; // { player, wrap, pinned }
    function closeActiveYT() {
      if (!_activeYT) return;
      try { _activeYT.player.destroy(); } catch (e) {}
      const host = _activeYT.wrap.querySelector('.yt-frame-host');
      if (host) { host.innerHTML = ''; host.classList.remove('floating'); }
      _activeYT.wrap.classList.remove('playing');
      if (_ytFloatObserver) { _ytFloatObserver.disconnect(); _ytFloatObserver = null; }
      _activeYT = null;
      redrawTimelineSoon();
    }

    // Dock (false) or float (true) the active player's frame. The file://
    // placeholder has no real iframe, so leave it alone.
    function setYTFloating(on) {
      if (!_activeYT) return;
      const host = _activeYT.wrap.querySelector('.yt-frame-host');
      if (!host || host.querySelector('.yt-note')) return;
      if (host.classList.contains('floating') === on) return;
      host.classList.toggle('floating', on);
      redrawTimelineSoon();
    }
    // Pin = force-float and ignore the scroll observer (used when the owning
    // panel collapses, so playback survives an entry toggle). Unpin = dock back
    // and let the observer take over again (used when the entry re-opens).
    function pinYTFloat()   { if (_activeYT) { _activeYT.pinned = true;  setYTFloating(true);  } }
    function unpinYTFloat() { if (_activeYT) { _activeYT.pinned = false; setYTFloating(false); } }

    // Start (or jump within) the inline player for a given .yt-setlist block.
    // startIndex selects which song in the playlist to begin at.
    function startSetlist(wrap, startIndex) {
      startIndex = startIndex || 0;
      const playBtn = wrap.querySelector('.yt-play-btn');
      const ids = (playBtn.dataset.ids || '').split(',').filter(Boolean);
      if (!ids.length) return;

      // Already running for this setlist → just hop to the chosen track.
      if (_activeYT && _activeYT.wrap === wrap && _activeYT.player && _activeYT.player.playVideoAt) {
        try { _activeYT.player.playVideoAt(startIndex); } catch (e) {}
        return;
      }
      closeActiveYT();

      const host = wrap.querySelector('.yt-frame-host');

      // YouTube's player refuses to run from a file:// page (the origin is a
      // unique/null security origin → error 153). Tell the user to serve over
      // http instead of trying a doomed embed.
      if (location.protocol === 'file:') {
        host.innerHTML = '<p class="yt-note">Open this page over <strong>http</strong> ' +
          '(e.g. the local dev server) to play setlists — YouTube blocks playback ' +
          'from <code>file://</code> pages.</p>';
        wrap.classList.add('playing');
        _activeYT = { player: { destroy(){} }, wrap, pinned: false };
        redrawTimelineSoon();
        return;
      }

      const mount = document.createElement('div');
      host.appendChild(mount);
      // Floating-card controls, only visible while the card is floating:
      // ↩ returns to (and re-opens) the setlist; × stops playback.
      const back = document.createElement('button');
      back.type = 'button';
      back.className = 'yt-float-back';
      back.setAttribute('aria-label', 'Jump back to the setlist');
      back.textContent = '↩ setlist';
      host.appendChild(back);
      const close = document.createElement('button');
      close.type = 'button';
      close.className = 'yt-float-close';
      close.setAttribute('aria-label', 'Stop and close the player');
      close.textContent = '×';
      host.appendChild(close);
      wrap.classList.add('playing');
      redrawTimelineSoon();          // grow the dashed frame to fit the new player
      observeYTFloat(wrap);          // start floating into the corner on scroll-away

      const isHttp = location.protocol === 'http:' || location.protocol === 'https:';
      whenYTReady(() => {
        const player = new YT.Player(mount, {
          width: '100%', height: '220',
          // nocookie host: youtube.com embeds throw error 153 ("player
          // configuration error") when Chrome blocks third-party cookies,
          // which is now the default. The privacy-enhanced domain avoids it.
          host: 'https://www.youtube-nocookie.com',
          // Only pass a real http(s) origin; a file:// origin breaks the handshake.
          playerVars: Object.assign(
            { rel: 0, playsinline: 1, modestbranding: 1 },
            isHttp ? { origin: location.origin } : {}
          ),
          events: {
            // Argument form (array of video IDs). The object form takes
            // {list,listType} for a real playlist/search — passing an array
            // there triggers YouTube error 153 (player misconfiguration).
            onReady: ev => { ev.target.loadPlaylist(ids, startIndex); redrawTimelineSoon(); },
            // 100/101/150 = video gone or embedding disabled; skip to next.
            onError: ev => { try { ev.target.nextVideo(); } catch (e) {} },
            // When the user starts a video, hush any playing Spotify embed.
            onStateChange: ev => { if (ev.data === YT.PlayerState.PLAYING) pauseAllSpotify(); }
          }
        });
        _activeYT = { player, wrap, pinned: false };
      });
    }

    // ── Float the active player into a screen corner on scroll-away ──
    // When the setlist controls scroll out of view we detach the player frame
    // into a fixed corner card so playback keeps visible; bring it back to flow
    // when the controls scroll back into view. We watch the .yt-controls (which
    // stay in document flow) rather than the host itself — the host turns
    // position:fixed when floating, so watching it would break the toggle.
    let _ytFloatObserver = null;
    function observeYTFloat(wrap) {
      if (_ytFloatObserver) { _ytFloatObserver.disconnect(); _ytFloatObserver = null; }
      const controls = wrap.querySelector('.yt-controls');
      const host     = wrap.querySelector('.yt-frame-host');
      if (!controls || !host || !('IntersectionObserver' in window)) return;
      _ytFloatObserver = new IntersectionObserver(entries => {
        const e = entries[0];
        if (!_activeYT || _activeYT.wrap !== wrap) return;
        if (_activeYT.pinned) return;   // owning panel collapsed → stay floating
        // Float whenever the controls leave the viewport — scrolling UP (controls
        // below the fold) OR DOWN (controls above it) both pop the mini player.
        setYTFloating(!e.isIntersecting);
      }, { threshold: 0 });
      _ytFloatObserver.observe(controls);
    }

    // Floating card "↩ setlist": re-open the owning entry if it was collapsed
    // (which docks the player back), otherwise just scroll the setlist into view.
    document.addEventListener('click', e => {
      const back = e.target.closest('.yt-float-back');
      if (!back || !_activeYT) return;
      e.preventDefault();
      const stop = _activeYT.wrap.closest('.stop');
      const sbtn = stop && stop.querySelector('.stop-btn');
      if (sbtn && sbtn.getAttribute('aria-expanded') !== 'true') {
        sbtn.click();   // re-opens the entry → unpins + docks the player
      } else {
        const controls = _activeYT.wrap.querySelector('.yt-controls');
        if (controls) controls.scrollIntoView({ behavior: 'smooth', block: 'center' });
      }
    });

    // Floating card "×": stop playback and dismiss the player entirely.
    document.addEventListener('click', e => {
      if (e.target.closest('.yt-float-close')) { e.preventDefault(); closeActiveYT(); }
    });

    // "Play setlist" button: toggle the player on/off.
    document.addEventListener('click', e => {
      const playBtn = e.target.closest('.yt-play-btn');
      if (!playBtn) return;
      const wrap = playBtn.closest('.yt-setlist');
      if (_activeYT && _activeYT.wrap === wrap) { closeActiveYT(); return; } // toggle off
      startSetlist(wrap, 0);
    });

    // Song title: jump the inline player to that track (modifier/middle clicks
    // and file:// pages keep the open-in-new-tab link behaviour).
    document.addEventListener('click', e => {
      const songLink = e.target.closest('.setlist-song.playable');
      if (!songLink) return;
      if (location.protocol === 'file:') return;                 // let the link open the tab
      if (e.button !== 0 || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return;
      const block = songLink.closest('.band-block');
      const wrap  = block && block.querySelector('.yt-setlist');
      if (!wrap) return;
      e.preventDefault();
      startSetlist(wrap, parseInt(songLink.dataset.ytIndex, 10) || 0);
    });

    /* ── Main click handler ────────────────────────────────────────── */
    document.getElementById('stops-container').addEventListener('click', e => {
      const btn = e.target.closest('.stop-btn');
      if (!btn) return;
      const stop   = btn.closest('.stop');
      const panel  = stop.querySelector('.stop-panel');
      const isOpen = btn.getAttribute('aria-expanded') === 'true';

      // Keep a playing setlist ALIVE across panel toggles. If the player's own
      // entry is being re-opened, dock it back into flow; otherwise its panel is
      // collapsing (or another entry opens over it) so pin it into the floating
      // mini-card and let playback continue.
      if (_activeYT) {
        const activeStop = _activeYT.wrap.closest('.stop');
        if (stop === activeStop && !isOpen) unpinYTFloat();
        else                                pinYTFloat();
      }

      /* Collapse any currently-open stop (no FLIP — user focus is on new stop) */
      let closingPanel = null;
      if (openStop && openStop !== stop) {
        const pb = openStop.querySelector('.stop-btn');
        const pp = openStop.querySelector('.stop-panel');
        closingPanel = pp;
        pb.setAttribute('aria-expanded', 'false');
        pp.setAttribute('aria-hidden',   'true');
        _resetCardLogos(pb, pp);
        // Keep opacity lit if this panel owns the floating player — CSS opacity
        // on an ancestor dims its position:fixed descendant too, which would
        // blank out the mini-card. height:0 + overflow:hidden still hides the
        // inline content either way.
        const ppLit = _activeYT && pp.contains(_activeYT.wrap);
        gsap.to(pp, { height: 0, opacity: ppLit ? 1 : 0, duration: .35, ease: 'power2.in',
          onComplete: () => rebuildTimelineSettled() });
        openStop = null;
      }

      // Headliner banner = the first band-block's banner; supports get their own.
      const headBanner   = panel.querySelector('.band-block.is-headliner .panel-logo-banner')
                        || panel.querySelector('.panel-logo-banner');
      const headLogo     = headBanner ? headBanner.querySelector('.band-logo') : null;
      const cardLogo     = btn.querySelector('.band-logo');
      const supportLogos = btn.querySelector('.stop-support-logos');
      const cardDate     = btn.querySelector('.stop-date');
      const headWhen     = panel.querySelector('.band-block.is-headliner .panel-when');
      // No-logo headliner: the artist name shows on the card AND in the banner.
      // FLIP the card name up into the banner so it never appears twice.
      const cardName     = btn.querySelector('.stop-name');
      const headName     = headBanner ? headBanner.querySelector('.band-block-name') : null;
      const nameFlips    = !headLogo && headName && cardName;

      if (isOpen) {
        /* ── Close ── */
        btn.setAttribute('aria-expanded', 'false');
        panel.setAttribute('aria-hidden', 'true');

        _toggleSupportBanners(panel, false);

        const visible = el => el && parseFloat(gsap.getProperty(el, 'opacity') ?? 1) > 0.05;

        // Build the set of reverse FLIPs (banner → card) that should fly.
        // Logo flights use the visible ART rects (see _artRect) — element
        // boxes letterbox wide logos and made the art pop out of the frame.
        const flights = [];
        if (headLogo && cardLogo && visible(headLogo)) {
          const hr = _artRect(headLogo, headLogo.getBoundingClientRect());
          const cr = _artRect(cardLogo, cardLogo.getBoundingClientRect());
          flights.push({ src: headLogo, dst: cardLogo, art: true, scale: hr.width ? cr.width / hr.width : 1 });
        }
        if (headWhen && cardDate && visible(headWhen)) {
          flights.push({ src: headWhen, dst: cardDate, scale: 1 });
        }
        if (nameFlips && visible(headName)) {
          const fr = headName.getBoundingClientRect();
          const tr = cardName.getBoundingClientRect();
          flights.push({ src: headName, dst: cardName, scale: tr.height / fr.height });
        }

        if (flights.length) {
          flights.forEach(f => {
            const fromRect = f.art ? _artRect(f.src, f.src.getBoundingClientRect()) : f.src.getBoundingClientRect();
            const toRect   = f.art ? _artRect(f.dst, f.dst.getBoundingClientRect()) : f.dst.getBoundingClientRect();
            const clone    = _makeClone(f.src, fromRect);
            gsap.set(f.src, { opacity: 0 });
            gsap.to(clone, {
              x: toRect.left - fromRect.left,
              y: toRect.top  - fromRect.top,
              scale: f.scale ?? 1,
              duration: .4, ease: 'power2.inOut',
              // Reveal the real card element in the SAME frame the clone is
              // removed (instant gsap.set, mirroring the open path). A fading
              // gsap.to here left a 1-frame gap where neither the clone nor the
              // card logo was visible — read as the logo "popping in too small".
              onComplete: () => { gsap.set(f.dst, { opacity: 1 }); clone.remove(); },
            });
          });
          if (supportLogos) gsap.to(supportLogos, { opacity: 1, duration: .2 });
        } else {
          if (cardLogo)     gsap.to(cardLogo,     { opacity: 1, duration: .2 });
          if (cardDate)     gsap.to(cardDate,     { opacity: 1, duration: .2 });
          if (cardName)     gsap.to(cardName,     { opacity: 1, duration: .2 });
          if (supportLogos) gsap.to(supportLogos, { opacity: 1, duration: .2 });
        }

        // Collapse panel (keep opacity lit if it owns the floating player, so
        // the fixed mini-card isn't dimmed away by the ancestor's opacity).
        const panelLit = _activeYT && panel.contains(_activeYT.wrap);
        gsap.to(panel, { height: 0, opacity: panelLit ? 1 : 0, duration: .4, ease: 'power2.in',
          onComplete: () => rebuildTimelineSettled() });

        openStop = null;

      } else {
        /* ── Open ── */
        btn.setAttribute('aria-expanded', 'true');
        panel.setAttribute('aria-hidden', 'false');

        // Hide every banner's contents + the headliner date up-front
        panel.querySelectorAll('.panel-logo-banner img, .panel-logo-banner .band-block-name')
             .forEach(el => gsap.set(el, { opacity: 0 }));
        if (headWhen) gsap.set(headWhen, { opacity: 0 });

        // Reveal headliner banner content that ISN'T part of a FLIP.
        // When the name itself flies up (no-logo band) the flight reveals it,
        // so we must NOT also fade it in here (that caused the "double" name).
        const revealHeadExtras = () => {
          if (headBanner && !headLogo && !nameFlips) {
            const nm = headBanner.querySelector('.band-block-name');
            if (nm) gsap.to(nm, { opacity: 1, duration: .3 });
          }
        };

        const DUR = .52;

        // Measure final on-screen positions by momentarily laying the panel out,
        // so the FLIP can run CONCURRENTLY with the expand (no post-open delay).
        // If another panel is mid-collapse, zero it for the measurement too —
        // otherwise its still-open height pushes our banner down and the flight
        // overshoots low ("dips then pops"). Restore its in-flight height after
        // so its own collapse tween keeps animating smoothly.
        const closingH = closingPanel ? gsap.getProperty(closingPanel, 'height') : null;
        if (closingPanel) gsap.set(closingPanel, { height: 0 });
        const prevH = panel.style.height;
        gsap.set(panel, { height: 'auto' });
        // Camera target measured HERE (panel laid out, any closing panel zeroed)
        // so the scroll can start immediately with the expand instead of waiting
        // for the FLIP to finish — that wait was the noticeable lag.
        const camMaxY   = document.documentElement.scrollHeight - window.innerHeight;
        const camTarget = Math.max(0, Math.min(camMaxY, window.scrollY + btn.getBoundingClientRect().top - 96));
        // Will theatre mode take over the viewport? If so, skip the scroll glide.
        const _headPlayer = panel.querySelector('.band-block.is-headliner .media-player');
        const willOpenTheatre = !!(_headPlayer && !_theatreDismissed.has(_headPlayer.dataset.band || ''));
        const flights = [];
        if (headLogo && cardLogo) {
          // ART rects, not element boxes — wide letterboxed logos otherwise
          // overshoot the banner frame mid-flight and pop at landing.
          const hr = _artRect(headLogo, headLogo.getBoundingClientRect());
          const cr = _artRect(cardLogo, cardLogo.getBoundingClientRect());
          flights.push({ src: cardLogo, dst: headLogo, toRect: hr, art: true, scale: cr.width ? hr.width / cr.width : 1 });
        }
        if (headWhen && cardDate) flights.push({ src: cardDate, dst: headWhen, toRect: headWhen.getBoundingClientRect(), scale: 1 });
        if (nameFlips) {
          const fr = cardName.getBoundingClientRect();
          const tr = headName.getBoundingClientRect();
          flights.push({ src: cardName, dst: headName, toRect: tr, scale: tr.height / fr.height });
        }
        gsap.set(panel, { height: prevH || 0 });
        if (closingPanel) gsap.set(closingPanel, { height: closingH });

        if (supportLogos) gsap.to(supportLogos, { opacity: 0, duration: .18 });

        // Shared, live camera position so the FLIP clones can read the eased
        // scroll value WITHOUT a per-frame window.scrollY read (that read, right
        // after the camera's scrollTo write, forced a sync reflow every frame —
        // a big chunk of the stutter). null = no glide running.
        let cam = null;

        const finish = () => {
          _toggleSupportBanners(panel, true);
          revealHeadExtras();
          // One coalesced rebuild after the whole transition settles (camera +
          // FLIP), so the heavy snake redraw never runs mid-glide.
          rebuildTimelineSettled();
          // Theatre mode opens enlarged BY DEFAULT, unless the user has closed
          // it once for this band (then they get the inline preview + expand btn).
          if (willOpenTheatre) {
            openTheatre(_itemsFromPlayer(_headPlayer), 0, _headPlayer.dataset.band || '');
          }
        };

        // Camera blend: glide up to the top of the freshly-opened dropdown
        // CONCURRENTLY with the expand, using the target measured above. Matched
        // to the FLIP duration (DUR) so the scroll, the expand and the flying
        // clones all finish together as one motion instead of the camera
        // outlasting the FLIP and rebuilding the timeline mid-scroll.
        if (!willOpenTheatre) {
          // behavior:'instant' is load-bearing: html has scroll-behavior:smooth,
          // and the default-behavior scrollTo would get browser-animated on top
          // of (and lagging behind) the GSAP tween — mushy, rubber-banding camera.
          if (REDUCE_MOTION || Math.abs(camTarget - window.scrollY) < 2) {
            window.scrollTo({ top: camTarget, behavior: 'instant' });
          } else {
            cam = { y: window.scrollY };
            gsap.to(cam, {
              y: camTarget, duration: DUR, ease: 'power3.inOut', overwrite: 'auto',
              onUpdate: () => window.scrollTo({ top: cam.y, behavior: 'instant' }),
              onComplete: () => rebuildTimelineSettled(),
            });
          }
        }

        // Expand the panel and fly the clones at the same time.
        gsap.to(panel, { height: 'auto', opacity: 1, duration: DUR, ease: 'power2.out',
          onComplete: flights.length ? undefined : finish });

        if (flights.length) {
          let remaining = flights.length;
          flights.forEach(f => {
            const fromRect = f.art ? _artRect(f.src, f.src.getBoundingClientRect()) : f.src.getBoundingClientRect();
            const clone    = _makeClone(f.src, fromRect);
            gsap.set(f.src, { opacity: 0 });
            const dx = f.toRect.left - fromRect.left;
            const dy = f.toRect.top  - fromRect.top;
            const sc = f.scale ?? 1;
            // The clone is position:fixed but its destination scrolls with the
            // page. Since the camera glide runs concurrently, track the live
            // scroll delta so the clone lands exactly on the banner element.
            // Prefer the eased `cam.y` (no layout read) and fall back to
            // window.scrollY only when no glide is active.
            const startY = window.scrollY;
            const prox   = { p: 0 };
            gsap.to(prox, {
              p: 1, duration: DUR, ease: 'power2.inOut',
              onUpdate: () => {
                const p = prox.p;
                const curY = cam ? cam.y : window.scrollY;
                gsap.set(clone, {
                  x: dx * p,
                  y: dy * p - (curY - startY),
                  scale: 1 + (sc - 1) * p,
                });
              },
              onComplete: () => {
                gsap.set(f.dst, { opacity: 1 });
                clone.remove();
                if (--remaining === 0) finish();
              },
            });
          });
        }

        openStop = stop;
      }
    });

    /* ── Escape closes the open stop and returns focus to its trigger ──
       (Theatre mode has its own Escape handler; only act when no modal.) */
    document.addEventListener('keydown', e => {
      if (e.key !== 'Escape' || !openStop) return;
      if (document.querySelector('#media-theatre.open')) return; // modal owns Escape
      const trigger = openStop.querySelector('.stop-btn');
      if (trigger) { trigger.click(); trigger.focus(); }
    });

    /* ── Media filmstrip: swap the stage when a thumbnail is chosen ── */
    document.getElementById('stops-container').addEventListener('click', e => {
      const thumb = e.target.closest('.media-thumb');
      if (!thumb) return;
      const player = thumb.closest('.media-player');
      const stage  = player.querySelector('.media-stage');
      const meta   = player.querySelector('.media-meta');
      const thumbs = [...player.querySelectorAll('.media-thumb')];
      const idx    = thumbs.indexOf(thumb);

      thumbs.forEach(t => t.classList.remove('active'));
      thumb.classList.add('active');

      const m = { type: thumb.dataset.type, src: thumb.dataset.src, poster: thumb.dataset.poster };
      const prevVid = stage.querySelector('video');
      if (prevVid) prevVid.pause();

      stage.innerHTML = mediaStageInner(m);
      meta.innerHTML  = mediaMeta(m, idx, thumbs.length);
      // Soft crossfade into the new media — a hard swap reads as a flicker
      if (!REDUCE_MOTION) gsap.fromTo(stage, { opacity: 0 }, { opacity: 1, duration: .28, ease: 'power1.out' });

      // The user clicked a clip → start it (click is a valid user gesture)
      const vid = stage.querySelector('video');
      if (vid) vid.play().catch(() => {});
    });

    /* ── Theatre mode: enlarged media overlay ──────────────────────
       Opens BY DEFAULT when a headliner panel with media expands. Once the
       user closes it for a given band, that band is remembered and only the
       inline preview (with an expand button) shows next time. */
    const _theatreDismissed = new Set();
    let _theatreItems = [], _theatreIdx = 0, _theatreBand = '', _theatreEl = null;

    function _itemsFromPlayer(player) {
      return [...player.querySelectorAll('.media-thumb')].map(t => ({
        type: t.dataset.type, src: t.dataset.src, poster: t.dataset.poster
      }));
    }
    function _theatreThumbsHTML(items) {
      return items.map((m, i) => {
        const isVid = m.type === 'video';
        const tsrc  = isVid ? (m.poster || '') : m.src;
        return `<button type="button" class="media-thumb${i === 0 ? ' active' : ''}"
                  data-type="${esc(m.type)}" data-src="${esc(m.src)}" data-poster="${esc(m.poster || '')}"
                  aria-label="${isVid ? 'Play clip' : 'View photo'} ${i + 1}">
                  ${tsrc ? `<img src="${esc(tsrc)}" alt="" loading="lazy">` : '<span class="media-thumb-fallback">&#9654;</span>'}
                  ${isVid ? '<span class="media-thumb-badge">&#9654;</span>' : ''}
                </button>`;
      }).join('');
    }
    function _ensureTheatre() {
      if (_theatreEl) return _theatreEl;
      const el = document.createElement('div');
      el.id = 'media-theatre';
      el.setAttribute('aria-hidden', 'true');
      el.innerHTML =
        `<button type="button" class="theatre-close" aria-label="Close theatre">&times;</button>
         <div class="theatre-stage"></div>
         <div class="theatre-meta"></div>
         <div class="theatre-strip"></div>`;
      document.body.appendChild(el);
      el.querySelector('.theatre-close').addEventListener('click', closeTheatre);
      el.addEventListener('click', ev => { if (ev.target === el) closeTheatre(); });
      el.querySelector('.theatre-strip').addEventListener('click', ev => {
        const t = ev.target.closest('.media-thumb');
        if (!t) return;
        _theatreShow([...el.querySelectorAll('.theatre-strip .media-thumb')].indexOf(t));
      });
      _theatreEl = el;
      return el;
    }
    function _theatreShow(idx) {
      if (idx < 0 || idx >= _theatreItems.length) return;
      _theatreIdx = idx;
      const el    = _theatreEl;
      const stage = el.querySelector('.theatre-stage');
      const meta  = el.querySelector('.theatre-meta');
      const m     = _theatreItems[idx];
      const prevVid = stage.querySelector('video');
      if (prevVid) prevVid.pause();
      stage.innerHTML = mediaStageInner(m);
      meta.innerHTML  = mediaMeta(m, idx, _theatreItems.length);
      if (!REDUCE_MOTION) gsap.fromTo(stage, { opacity: 0 }, { opacity: 1, duration: .28, ease: 'power1.out' });
      el.querySelectorAll('.theatre-strip .media-thumb')
        .forEach((t, i) => t.classList.toggle('active', i === idx));
      const vid = stage.querySelector('video');
      if (vid) vid.play().catch(() => {});
    }
    function openTheatre(items, startIdx, band) {
      if (!items || !items.length) return;
      const el = _ensureTheatre();
      _theatreItems = items;
      _theatreBand  = band || '';
      el.querySelector('.theatre-strip').innerHTML = _theatreThumbsHTML(items);
      el.classList.add('open');
      el.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';
      _theatreShow(startIdx || 0);
      gsap.fromTo(el, { opacity: 0 }, { opacity: 1, duration: .3, ease: 'power2.out' });
    }
    function closeTheatre() {
      const el = _theatreEl;
      if (!el || !el.classList.contains('open')) return;
      if (_theatreBand) _theatreDismissed.add(_theatreBand);
      const stage = el.querySelector('.theatre-stage');
      const vid   = stage.querySelector('video');
      if (vid) vid.pause();
      gsap.to(el, { opacity: 0, duration: .25, ease: 'power2.in', onComplete: () => {
        el.classList.remove('open');
        el.setAttribute('aria-hidden', 'true');
        document.body.style.overflow = '';
        stage.innerHTML = '';
      }});
    }

    // Inline expand button → open theatre at the currently-active item
    document.getElementById('stops-container').addEventListener('click', e => {
      const btn = e.target.closest('.media-expand');
      if (!btn) return;
      const player = btn.closest('.media-player');
      const thumbs = [...player.querySelectorAll('.media-thumb')];
      const active = Math.max(0, thumbs.findIndex(t => t.classList.contains('active')));
      openTheatre(_itemsFromPlayer(player), active, player.dataset.band || '');
    });

    // Theatre keys: ESC closes, ←/→ step through the media (wrapping)
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') { closeTheatre(); return; }
      if (!_theatreEl || !_theatreEl.classList.contains('open') || _theatreItems.length < 2) return;
      if (e.key === 'ArrowRight') {
        e.preventDefault();
        _theatreShow((_theatreIdx + 1) % _theatreItems.length);
      } else if (e.key === 'ArrowLeft') {
        e.preventDefault();
        _theatreShow((_theatreIdx - 1 + _theatreItems.length) % _theatreItems.length);
      }
    });

    /* ── Tab filtering ─────────────────────────────────────────── */
    function concertCategory(c) {
      if (c.category) return c.category;
      if (c.id.startsWith('raptors')) return 'sports';
      const n = (c.notes || '').toLowerCase();
      if (n.includes('stand-up comedy') || n.includes('comedy')) return 'other';
      if (n.includes('book event') || n.includes('talk')) return 'other';
      return 'music';
    }

    let _tabSwapping = false;
    document.querySelectorAll('.tab-btn').forEach(tabBtn => {
      tabBtn.addEventListener('click', () => {
        if (tabBtn.classList.contains('active') || _tabSwapping) return;
        document.querySelectorAll('.tab-btn').forEach(t => t.classList.remove('active'));
        tabBtn.classList.add('active');
        const tab = tabBtn.dataset.tab;
        const tl  = document.getElementById('timeline');
        if (REDUCE_MOTION) {
          applyTabFilter(tab);
          requestAnimationFrame(buildTimeline);
          return;
        }
        // Crossfade the whole timeline (stops + snake SVGs) through the swap —
        // a hard pop reads as a glitch, a short ink-fade reads as a page turn.
        // Opacity only: transforms would offset buildTimeline's measurements.
        _tabSwapping = true;
        gsap.to(tl, { opacity: 0, duration: .16, ease: 'power2.in', onComplete: () => {
          applyTabFilter(tab);
          buildTimeline();
          gsap.to(tl, { opacity: 1, duration: .3, ease: 'power2.out',
            onComplete: () => { _tabSwapping = false; } });
        }});
      });
    });

    /* ── Sketchbook atmospherics ──────────────────────────────────── */
    (function addAtmosphere() {

      // ⓪ Depth baubles — large, very faint soft blobs drifting at varied rates.
      //    Slower drift + bigger + blurrier = reads as "further away". Kept barely
      //    visible so they only deepen the page rather than clutter it.
      const _baubleCfg = [
        // l,    t,     size, sy,   alpha, blur, parallax(py)  — small py = far
        { l:'10%', t:'10%', s:440, sy:.84, a:.045, b:38, py: 70  },
        { l:'66%', t:'6%',  s:560, sy:.76, a:.035, b:52, py: 45  },
        { l:'84%', t:'30%', s:300, sy:.92, a:.060, b:24, py: 250 },
        { l:'-5%', t:'40%', s:500, sy:.80, a:.030, b:56, py: 40  },
        { l:'52%', t:'50%', s:360, sy:.88, a:.050, b:30, py: 300 },
        { l:'22%', t:'64%', s:600, sy:.72, a:.028, b:60, py: 35  },
        { l:'79%', t:'70%', s:330, sy:.90, a:.052, b:26, py: 270 },
        { l:'6%',  t:'84%', s:300, sy:.95, a:.058, b:22, py: 210 },
        { l:'58%', t:'90%', s:470, sy:.80, a:.032, b:48, py: 60  },
      ];
      // Big blurred multiply layers driven by scroll are the main source of
      // scroll jank. On phones we render fewer and leave them static; under
      // reduced-motion we also drop the parallax. (PARALLAX gates the drift.)
      const PARALLAX = !REDUCE_MOTION && !SMALL_SCREEN;
      (SMALL_SCREEN ? _baubleCfg.slice(0, 4) : _baubleCfg).forEach(p => {
        const d = document.createElement('div');
        d.setAttribute('aria-hidden','true');
        d.style.cssText = `
          position:fixed;pointer-events:none;z-index:-1;
          left:${p.l};top:${p.t};
          width:${p.s}px;height:${p.s*p.sy}px;
          border-radius:50%;
          background:radial-gradient(ellipse at 47% 43%,
            rgba(90,74,58,${p.a}) 0%,
            rgba(90,74,58,${(p.a*0.6).toFixed(3)}) 42%,
            rgba(90,74,58,0) 72%
          );
          filter:blur(${p.b}px);
          mix-blend-mode:multiply;
        `;
        document.body.appendChild(d);
        if (PARALLAX) {
          gsap.to(d, {
            y: p.py, ease: 'none',
            scrollTrigger: { trigger: document.body, start: 'top top', end: 'bottom bottom', scrub: 5 }
          });
        }
      });

      // ① Coffee/tea stain rings — scattered, parallax at different rates
      const _ringCfg = [
        { l:'5%',  t:'7%',  s:148, r:14,  sy:.80, py:  190 },
        { l:'81%', t:'19%', s:108, r:-6,  sy:.88, py: -240 },
        { l:'74%', t:'44%', s:170, r:8,   sy:.76, py:  330 },
        { l:'3%',  t:'61%', s:118, r:-20, sy:.86, py: -150 },
        { l:'85%', t:'77%', s:140, r:23,  sy:.82, py:  255 },
        { l:'10%', t:'87%', s: 90, r:-8,  sy:.90, py: -185 },
        // a few more, naturally scattered — not too many
        { l:'44%', t:'14%', s:104, r:18,  sy:.84, py:  150 },
        { l:'63%', t:'67%', s:132, r:-13, sy:.80, py: -210 },
        { l:'27%', t:'37%', s: 92, r:7,   sy:.88, py:  120 },
      ];
      (SMALL_SCREEN ? _ringCfg.slice(0, 4) : _ringCfg).forEach(p => {
        const d = document.createElement('div');
        d.setAttribute('aria-hidden','true');
        d.style.cssText = `
          position:fixed;pointer-events:none;z-index:2;
          left:${p.l};top:${p.t};
          width:${p.s}px;height:${p.s*p.sy}px;
          border-radius:50%;
          background:radial-gradient(ellipse at 44% 42%,
            rgba(148,100,42,0) 0%,
            rgba(148,100,42,.016) 46%,
            rgba(143,95,35,.07) 66%,
            rgba(138,90,29,.13) 75%,
            rgba(132,84,24,.09) 84%,
            rgba(125,78,18,.03) 92%,
            transparent 100%
          );
          mix-blend-mode:multiply;
        `;
        document.body.appendChild(d);
        // Set initial rotation via GSAP so it owns the full transform
        gsap.set(d, { rotation: p.r });
        // Parallax: each ring drifts at a unique rate as page scrolls
        if (PARALLAX) {
          gsap.to(d, {
            y: p.py,
            ease: 'none',
            scrollTrigger: {
              trigger: document.body,
              start: 'top top',
              end: 'bottom bottom',
              scrub: 4,   /* heavier scrub = more inertia / lag */
            }
          });
        }
      });

      // ② Left-edge binding strip with punched holes
      const binding = document.createElement('div');
      binding.setAttribute('aria-hidden','true');
      binding.style.cssText = `
        position:fixed;left:0;top:0;bottom:0;width:28px;
        pointer-events:none;z-index:3;
        background:linear-gradient(to right,rgba(105,85,55,.11) 0,rgba(105,85,55,.03) 65%,transparent 100%);
      `;
      for (let i = 0; i < 19; i++) {
        const h = document.createElement('div');
        h.style.cssText = `
          position:absolute;left:50%;top:${2.8 + i*5.25}%;
          transform:translateX(-50%);
          width:13px;height:9px;border-radius:50%;
          background:rgba(205,188,158,.38);
          box-shadow:inset 0 1px 3px rgba(35,22,8,.2),0 1px 1px rgba(255,255,255,.45);
        `;
        binding.appendChild(h);
      }
      document.body.appendChild(binding);

      // ③ Torn paper edge — sits at top of hero, flipped to drape downward
      const tear = document.createElement('div');
      tear.setAttribute('aria-hidden','true');
      tear.style.cssText = `position:relative;z-index:4;height:32px;margin-bottom:-31px;pointer-events:none;overflow:hidden;`;
      tear.innerHTML = `<svg viewBox="0 0 1440 32" preserveAspectRatio="none"
          style="position:absolute;top:0;width:100%;height:100%;transform:rotate(180deg)">
        <path fill="var(--paper)" d="M0,32 L0,14
          C28,7 46,22 74,16 C102,10 118,26 148,20 C178,14 196,4 224,10
          C252,16 270,28 298,22 C326,16 342,5 372,9 C402,13 418,24 448,18
          C478,12 494,2 524,7 C554,12 570,23 600,17 C630,11 646,1 676,6
          C706,11 722,22 752,16 C782,10 798,0 828,5 C858,10 874,22 904,16
          C934,10 950,1 980,6 C1010,11 1026,24 1056,18 C1086,12 1102,2 1132,7
          C1162,12 1178,23 1208,17 C1238,11 1254,2 1284,8 C1314,14 1332,24 1360,18
          C1388,12 1416,4 1440,9 L1440,32 Z"/>
      </svg>`;
      const hero = document.getElementById('hero');
      if (hero) hero.parentNode.insertBefore(tear, hero);

    })();

    // Start watching Spotify embeds so they mount (and gain play/pause control)
    // as their panels scroll into view. Placed last so all the controller-state
    // `let`/`const`s above are initialized before the observer can fire.
    observeSpotify();
  </script>
</body>
