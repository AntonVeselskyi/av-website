* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; }

<script>
'use strict';

// ═══════════════════════════════════════════════════════════════════

const out      = document.getElementById('out');

const cmdEl    = document.getElementById('cmd');

const S = {

  histIdx:    -1,

let lastSubmitAt = 0;
let commandInFlight = false;

function syncTyped() {
  const pos = cmdEl.selectionStart ?? cmdEl.value.length;
  typedEl.textContent = cmdEl.value.slice(0, pos);
  afterEl.textContent = cmdEl.value.slice(pos);
}
function setCmd(v) {
  cmdEl.value = v;
  cmdEl.setSelectionRange(v.length, v.length);
  syncTyped();
}
function insertAtCursor(text) {
  const start = cmdEl.selectionStart ?? cmdEl.value.length;
  const end = cmdEl.selectionEnd ?? start;
  cmdEl.value = cmdEl.value.slice(0, start) + text + cmdEl.value.slice(end);
  const pos = start + text.length;
  cmdEl.setSelectionRange(pos, pos);
  syncTyped();
}
function deleteAtCursor(forward = false) {
  const start = cmdEl.selectionStart ?? cmdEl.value.length;
  const end = cmdEl.selectionEnd ?? start;
  if (start !== end) {
    cmdEl.value = cmdEl.value.slice(0, start) + cmdEl.value.slice(end);
    cmdEl.setSelectionRange(start, start);
  } else if (forward && start < cmdEl.value.length) {
    cmdEl.value = cmdEl.value.slice(0, start) + cmdEl.value.slice(start + 1);
    cmdEl.setSelectionRange(start, start);
  } else if (!forward && start > 0) {
    cmdEl.value = cmdEl.value.slice(0, start - 1) + cmdEl.value.slice(start);
    cmdEl.setSelectionRange(start - 1, start - 1);
  }
  syncTyped();
}
function visibleCommandValue() {
  return cmdEl.value || (typedEl.textContent + afterEl.textContent);
}
function recentlySubmitted() {

}
cmdEl.addEventListener('input', syncTyped);
cmdEl.addEventListener('keyup', syncTyped);
cmdEl.addEventListener('click', syncTyped);
cmdEl.addEventListener('select', syncTyped);

document.addEventListener('mousedown', () => {
  if (inpRow.style.display === 'none') return;
  if (window.getSelection && window.getSelection().toString()) return;
  setTimeout(() => cmdEl.focus(), 0);
});
document.addEventListener('keydown', async (e) => {
  if (document.activeElement === cmdEl) return;
  if (inpRow.style.display === 'none') return;
  if (window.getSelection && window.getSelection().toString()) return;
  cmdEl.focus();
  if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) {
    e.preventDefault();
    insertAtCursor(e.key);
    return;
  }
  if (e.key === 'Backspace' || e.key === 'Delete') {
    e.preventDefault();
    deleteAtCursor(e.key === 'Delete');

  if (['Enter','Tab','ArrowUp','ArrowDown'].includes(e.key) || e.ctrlKey) {

});
document.addEventListener('keyup', async (e) => {

  if (recentlySubmitted()) return;
  e.preventDefault();
  await submitCommand();
});

const sleep = ms => new Promise(r => setTimeout(r, ms));
function scrollBottom() {
  out.scrollTop = out.scrollHeight;
  requestAnimationFrame(() => {
    out.scrollTop = out.scrollHeight;
    requestAnimationFrame(() => { out.scrollTop = out.scrollHeight; });
  });
}
const GLITCH_CHARS = ['-','-','-','-','¦','¦','+','+','+','+','-','-','?','?'];
function maybeCorrupt(text) {
  if (SERVER_ID !== 'node083' || Math.random() > 0.07) return text;
  const pos = Math.floor(Math.random() * text.length);
  const gc = GLITCH_CHARS[Math.floor(Math.random() * GLITCH_CHARS.length)];
  return text.slice(0, pos) + gc + text.slice(pos);
}
function addLine(text = '', cls = '', corrupt = false) {
  const d = document.createElement('div');
  d.className = 'line' + (cls ? ' ' + cls : '');
  d.textContent = corrupt ? maybeCorrupt(text) : text;
  out.appendChild(d);
  scrollBottom();
  return d;
}
function addHTML(html, cls = '') {
  const d = document.createElement('div');
  d.className = 'line' + (cls ? ' ' + cls : '');
  d.innerHTML = html;
  out.appendChild(d);
  scrollBottom();
  return d;
}
async function type(text, cls = '', speed = 22) {
  const d = addLine('', cls);
  for (const ch of text) {
    d.textContent += ch;
    scrollBottom();
    await sleep(speed + Math.random() * speed * 0.4);
  }
  return d;
}
async function printLines(lines, delay = 40) {
  for (const l of lines) {
    if (typeof l === 'string') addLine(l, '', true);
    else addLine(l.t, l.c, l.corrupt !== false);
    if (delay) await sleep(delay);

  scrollBottom();
}
async function progressBar(label, duration, w = 20, errAt = -1) {
  const d = addLine('', 'med');
  const step = duration / w;
  for (let i = 0; i <= w; i++) {
    const filled = '█'.repeat(i);
    const empty = ' '.repeat(w - i);
    if (i === errAt) {
      d.innerHTML = `<span class="r2">${label} [${filled}--------${' '.repeat(Math.max(0,w-i-8))}] ERROR</span>`;
      d.className = 'line';
      await sleep(500);
      return false;
    }
    if (i === w) {
      d.innerHTML = `<span class="med">${label} [</span><span class="ok">${filled}</span><span class="med">]</span> <span class="ok">OK</span>`;
      d.className = 'line';
    } else {
      d.textContent = `${label} [${filled}${empty}] ${Math.round(i / w * 100)}%`;
    }
    scrollBottom();
    await sleep(step * (.7 + Math.random() * .6));
  }
  return true;
}

function updatePrompt() {
  if (SERVER_ID === 'node083' && S.sqliteMode) {
    promptEl.textContent = 'sqlite> ';
    promptEl.className = 'sql-mode';
    return;
  }
  if (SERVER_ID === 'node083' && S.sshWait) {

function showShell() {

  cmdEl.focus();
  if (SERVER_ID === 'node083') startPromptGlitch();
  scrollBottom();
}
function clearScreen() { out.innerHTML = ''; }

function remoteState() {
  if (SERVER_ID === 'node083') {
    return {
      cwd: S.cwd,
      prevCwd: S.prevCwd,
      sshWait: S.sshWait,
      sshTarget: S.sshTarget,
      decrypted: S.decrypted,
      sqliteMode: S.sqliteMode,
      sqliteFile: S.sqliteFile
    };
  }
  return { cwd: S.cwd, prevCwd: S.prevCwd, sshWait: S.sshWait };
}
function applyRemoteState(state) {
  if (!state || typeof state !== 'object') return;
  if (typeof state.cwd === 'string') S.cwd = state.cwd;
  if (typeof state.prevCwd === 'string') S.prevCwd = state.prevCwd;
  if (typeof state.sshWait === 'boolean') S.sshWait = state.sshWait;
  if (typeof state.sshTarget === 'string' || state.sshTarget === null) S.sshTarget = state.sshTarget;
  if (typeof state.decrypted === 'boolean') S.decrypted = state.decrypted;
  if (typeof state.sqliteMode === 'boolean') S.sqliteMode = state.sqliteMode;
  if (typeof state.sqliteFile === 'string' || state.sqliteFile === null) S.sqliteFile = state.sqliteFile;
}
async function remoteCommand(raw) {
  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ server: SERVER_ID, raw, state: remoteState() })

    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const payload = await res.json();
    if (!payload || payload.ok === false) {
      return { output: payload?.message || 'remote shell rejected request', state: remoteState() };
    }
    return payload;
  } catch (err) {
    return { ok: false, output: `shell transport offline: ${err.message}`, state: remoteState() };

}

async function submitCommand() {
  if (commandInFlight) return;
  commandInFlight = true;
  lastSubmitAt = performance.now();
  try {
    const raw = visibleCommandValue();
    setCmd('');
    S.histIdx = -1;

    if (SERVER_ID === 'core01' && S.sshWait) {
      addLine(promptEl.textContent + raw, 'dim');

        addLine('Aborted.', 'dim');

async function handleCommand(raw) { return remoteCommand(raw); }

let promptGlitchTimer = null;
function startPromptGlitch() {
  if (SERVER_ID !== 'node083' || promptGlitchTimer) return;
  promptGlitchTimer = setInterval(() => {
    if (inpRow.style.display === 'none' || S.sqliteMode) return;
    if (Math.random() < 0.08) {

const ALL_COMMANDS = SERVER_ID === 'node083'
  ? ['ls','tree','cd','cat','pwd','whoami','hostname','uname','id','date','uptime','ps','netstat','ifconfig','df','env','iptables','find','openssl','decrypt','sqlite3','tail','head','grep','wc','sort','uniq','echo','which','clear','reset','help','nmap','ssh','stat','ss','lsof','last','lastb','kill','base64','iostat','systemctl']
  : ['ls','tree','cd','cat','pwd','whoami','hostname','uname','id','date','uptime','w','ps','netstat','ifconfig','ip','df','env','history','top','ping','ssh','grep','tail','head','find','wc','sort','uniq','echo','which','clear','reset','help','nmap','stat','last','lastb','systemctl'];
const SQLITE_DOTS = ['.tables','.schema','.help','.exit','.quit'];
function commandCompletions(word) {
  if (SERVER_ID === 'node083' && S.sqliteMode) {
    if (word.startsWith('.')) return SQLITE_DOTS.filter(c => c.startsWith(word));
    return ['SELECT','FROM','WHERE'].filter(c => c.toLowerCase().startsWith(word.toLowerCase()));
  }
  return ALL_COMMANDS.filter(c => c.startsWith(word));
}
function splitCompletion(value) {
  const pos = cmdEl.selectionStart ?? value.length;
  const before = value.slice(0, pos);
  const after = value.slice(pos);
  const m = before.match(/(^|\s)(\S*)$/);
  const word = m ? m[2] : '';
  const start = pos - word.length;
  const prefix = value.slice(0, start);
  return { before, after, word, prefix, isCommand: !prefix.trim() };
}
function parentPath(word) {
  const slash = word.lastIndexOf('/');
  if (slash < 0) return { dir: '.', base: word, shownPrefix: '' };
  const shownPrefix = word.slice(0, slash + 1);
  const dir = shownPrefix || '/';
  return { dir, base: word.slice(slash + 1), shownPrefix };
}
async function pathCompletions(word) {
  const ctx = parentPath(word);
  const res = await remoteCommand('ls -a ' + ctx.dir);
  let names = String(res.output || '').split(/\s+/).filter(Boolean).filter(n => n !== '.' && n !== '..');
  if (!ctx.base.startsWith('.')) names = names.filter(n => !n.startsWith('.'));
  const matches = names.filter(n => n.startsWith(ctx.base));
  const out = [];
  for (const name of matches) {
    const shown = ctx.shownPrefix + name;
    let suffix = '';
    try {
      const stat = await remoteCommand('stat ' + shown);
      if (/\bdirectory\b/.test(String(stat.output || ''))) suffix = '/';
    } catch {}
    out.push(shown + suffix);
  }
  return out;
}
async function getCompletionsFor(value) {
  const ctx = splitCompletion(value);
  if (ctx.isCommand) return { ...ctx, cands: commandCompletions(ctx.word) };
  return { ...ctx, cands: await pathCompletions(ctx.word) };
}
function commonPrefix(strs) {
  if (!strs.length) return '';
  let p = strs[0];
  for (const s of strs) while (!s.startsWith(p) && p.length > 0) p = p.slice(0, -1);
  return p;
}

async function onShellKeydown(e) {
  if (e.key === 'Tab') {
    e.preventDefault();
    const v = cmdEl.value;
    const { prefix, after, word, cands } = await getCompletionsFor(v);
    if (cands.length === 1) {
      const done = cands[0] + (!after && !cands[0].endsWith('/') ? ' ' : '');
      setCmd(prefix + done);
    }
    else if (cands.length > 1) {
      const cp = commonPrefix(cands);
      if (cp.length > word.length) setCmd(prefix + cp);
      else { addLine(promptEl.textContent + v, 'dim'); addLine(cands.join('  '), SERVER_ID === 'node083' ? 'c' : 'cyan'); }
    }
    if (after && cmdEl.value.endsWith(after) === false) cmdEl.value += after;
    syncTyped();
    return;
  }
  if (e.key === 'ArrowUp') {
    e.preventDefault();
    if (S.histIdx < S.hist.length - 1) { S.histIdx++; setCmd(S.hist[S.hist.length - 1 - S.histIdx]); }
    return;
  }
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    if (S.histIdx > 0) { S.histIdx--; setCmd(S.hist[S.hist.length - 1 - S.histIdx]); }
    else { S.histIdx = -1; setCmd(''); }
    return;
  }
  if (e.ctrlKey && e.key === 'l') { e.preventDefault(); clearScreen(); return; }
  if (e.ctrlKey && e.key === 'c') {
    e.preventDefault();
    addLine(promptEl.textContent + cmdEl.value + '^C', 'dim');
    if (SERVER_ID === 'node083' && S.sqliteMode) { S.sqliteMode = false; S.sqliteFile = null; }
    setCmd('');
    showShell();
    return;
  }
  if (e.ctrlKey && e.key === 'u') {
    e.preventDefault();
    const pos = cmdEl.selectionStart ?? cmdEl.value.length;
    cmdEl.value = cmdEl.value.slice(pos);
    cmdEl.setSelectionRange(0, 0);
    syncTyped();
    return;
  }
  if (e.ctrlKey && e.key === 'k') {
    e.preventDefault();
    const pos = cmdEl.selectionStart ?? cmdEl.value.length;
    cmdEl.value = cmdEl.value.slice(0, pos);
    cmdEl.setSelectionRange(pos, pos);
    syncTyped();
    return;
  }
  if (e.ctrlKey && e.key === 'd') {
    e.preventDefault();
    if (cmdEl.value) return;
    addLine('logout', 'dim');
    inpRow.style.display = 'none';
    return;
  }
  if (e.key === 'Enter') {
    e.preventDefault();
    await submitCommand();
  }
}
cmdEl.addEventListener('keydown', onShellKeydown);

// ── Live alerts — beacon still alive, others on the box ──────────
// Capped, not infinite. Each entry fires at most once. After the pool
// drains, the system goes quiet (forensic snapshot stops emitting).
let beaconAge = 52; // minutes since beacon planted (03:30 → 04:22 ≈ 52)
let liveStarted = false;
const MIN_INTERVAL_MS = 90_000;   // 1.5 min floor between alerts
const MAX_INTERVAL_MS = 150_000;  // up to 2.5 min
const FIRST_DELAY_MIN = 60_000;
const FIRST_DELAY_MAX = 90_000;
const MAX_ALERTS      = 8;        // hard cap — system goes silent after

function startLiveAlerts() {
  if (liveStarted) return;
  liveStarted = true;
  // Shuffled pool — each message fires at most once.
  const POOL = [
    () => ({ c:'r2',  t:`[netwatch] STILL outbound — 172.16.47.83:48314 → 91.213.8.44:4444 — conn age ${++beaconAge}m` }),
    () => ({ c:'o',   t:`[systemd] livseg-keepalive.timer fired — script returned 0 (next in 5m)` }),
    () => ({ c:'r2',  t:`[netwatch] beacon heartbeat — ${(2 + Math.random() * 4).toFixed(1)} KB out, ${(0.2 + Math.random() * 0.3).toFixed(2)} KB in` }),
    () => ({ c:'red', t:`<r.takeda> who is logged into 083 right now. answer me.` }),
    () => ({ c:'red', t:`<c.morgan> r? I see another session. someone is on the box with us.` }),
    () => ({ c:'o',   t:`[kernel] PID 4291 — syscall sequence matches known C2 beaconing pattern` }),
    () => ({ c:'o',   t:`[journal] /etc/cron.d/livseg-keepalive — invoked /bin/bash via base64 -d | bash` }),
    () => ({ c:'r2',  t:`[audit] new TCP from 91.213.8.44 — no rule blocks it (firewall flushed)` }),
    () => ({ c:'red', t:`<r.takeda> halloran your overrides are about to be in every newspaper.` }),
    () => ({ c:'red', t:`<halloran> WHO IS THIS. GET OFF MY SYSTEM.` }),
  ];
  // Fisher-Yates shuffle
  for (let i = POOL.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [POOL[i], POOL[j]] = [POOL[j], POOL[i]];
  }
  let fired = 0;
  const tick = () => {
    if (fired >= MAX_ALERTS || fired >= POOL.length) return; // silence
    if (document.hidden) { schedule(); return; }
    const a = POOL[fired++]();
    const now = new Date();
    const stamp = `[${String(now.getUTCHours()).padStart(2,'0')}:${String(now.getUTCMinutes()).padStart(2,'0')}:${String(now.getUTCSeconds()).padStart(2,'0')}] `;
    addLine(stamp + a.t, a.c, true);
    schedule();
  };
  const schedule = () => setTimeout(tick, MIN_INTERVAL_MS + Math.random() * (MAX_INTERVAL_MS - MIN_INTERVAL_MS));
  setTimeout(tick, FIRST_DELAY_MIN + Math.random() * (FIRST_DELAY_MAX - FIRST_DELAY_MIN));
}
