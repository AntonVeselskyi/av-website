<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LivSeg :: drop</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet">
<style>
:root {
  --bg:    #060000;
  --bg2:   #100303;
  --r:     #ff1414;
  --r2:    #ff5050;
  --r3:    #7a0606;
  --eye:   #ff2a2a;
  --w:     #ffe1e1;
  --w2:    #ff9b9b;
  --dim:   #802424;
  --dim2:  #571313;
  --gold:  #ffcb47;
  --panel: rgba(60,2,2,.62);
}

* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:100%; height:100%; overflow:hidden; }

body {
  background:
    radial-gradient(circle at 50% 42%, rgba(255,30,30,.16), transparent 38%),
    radial-gradient(circle at 14% 90%, rgba(255,20,20,.06), transparent 35%),
    radial-gradient(circle at 86% 12%, rgba(255,20,20,.05), transparent 36%),
    linear-gradient(90deg, rgba(255,0,0,.04) 1px, transparent 1px),
    linear-gradient(rgba(255,0,0,.03) 1px, transparent 1px),
    var(--bg);
  background-size: auto, auto, auto, 38px 38px, 38px 38px, auto;
  color: var(--r2);
  font-family: 'Share Tech Mono', 'VT323', 'Courier New', monospace;
  font-size: clamp(14px, 1.35vw, 17px);
  line-height: 1.65;
  animation: crt-shake 11s infinite, brutal-flicker 7s infinite;
  text-shadow: 0 0 6px rgba(255,30,30,.42);
}
body::after {
  content: '';
  position: fixed; inset: 0;
  background: repeating-linear-gradient(to bottom,
    rgba(255,255,255,.02) 0, rgba(255,255,255,.02) 1px,
    rgba(0,0,0,.14) 2px, rgba(0,0,0,.14) 4px);
  pointer-events: none; z-index: 9999;
  mix-blend-mode: overlay;
}
body::before {
  content: '';
  position: fixed; inset: 0;
  background:
    linear-gradient(90deg, rgba(0,0,0,.5), transparent 8%, transparent 92%, rgba(0,0,0,.5)),
    radial-gradient(ellipse at 50% 50%, transparent 50%, rgba(0,0,0,.85) 100%);
  pointer-events: none; z-index: 9998;
}
@keyframes brutal-flicker {
  0%, 6%, 8%, 24%, 26%, 48%, 50%, 100% { opacity: 1; }
  7%, 25%, 49% { opacity: .85; }
  47% { opacity: .55; }
}
@keyframes crt-shake {
  0%, 3%, 100% { transform: translate(0); }
  4% { transform: translate(1px, -2px); }
  5% { transform: translate(-2px, 1px); }
  6% { transform: translate(0); }
  50%, 51% { transform: translate(0); }
  52% { transform: translate(-2px, 0); }
  53% { transform: translate(2px, 0); }
  54% { transform: translate(0); }
}

/* moving scan lines */
.scan-move {
  position: fixed; left:0; right:0; height: 6px;
  background: linear-gradient(transparent, rgba(255,30,30,.28), transparent);
  animation: scanMove 4.5s linear infinite;
  pointer-events: none; z-index: 9997;
  mix-blend-mode: screen;
}
@keyframes scanMove { 0%{ top:-6px; } 100%{ top:100%; } }

/* random glitch bars */
.glitch-bar {
  position: fixed; left:0; right:0;
  background: rgba(255,0,0,.18);
  pointer-events: none; z-index: 9996;
  animation: gbar 3.5s infinite;
  height: 2px;
}
@keyframes gbar {
  0%, 79%, 100% { opacity: 0; top: 20%; }
  80% { opacity: 1; top: 18%; height: 14px; }
  81% { opacity: 0; top: 51%; }
  87% { opacity: 1; top: 73%; height: 4px; }
  88% { opacity: 0; }
}

/* ════════ LAYOUT ════════ */
#root {
  position: fixed; inset: 0;
  display: grid;
  grid-template-columns: 1fr 368px;
  gap: 0;
}
@media (max-width: 760px) {
  #root { grid-template-columns: 1fr; }
  /* two ids so this outranks the later `#loot { display: flex }` rule */
  #root #loot { display: none; }
}

#main {
  display: flex;
  flex-direction: column;
  padding: clamp(16px, 2.4vw, 30px);
  min-height: 0;
  overflow: hidden;
}

#out {
  flex: 1;
  overflow-y: auto;
  text-align: center;
}
#out::-webkit-scrollbar { width:4px; }
#out::-webkit-scrollbar-track { background: transparent; }
#out::-webkit-scrollbar-thumb { background: var(--r3); border-radius: 2px; }

.line { display: block; white-space: pre-wrap; word-break: break-word; min-height: 1em; }

/* ════════ SKULL ════════ */
#skull-wrap {
  position: relative;
  margin: 4px auto 0;
  /* block, not inline-block: the mask sizes itself with width:min(100%, …),
     and 100% of a shrink-to-fit inline-block is circular → collapses to 0 */
  display: block;
  filter:
    drop-shadow(0 0 18px rgba(255,30,30,.48))
    drop-shadow(0 0 64px rgba(255,30,30,.22));
}
#skull {
  color: var(--r);
  font-family: 'VT323','Share Tech Mono',monospace;
  font-size: clamp(12px, 1.4vw, 18px);
  line-height: 1;
  white-space: pre;
  text-shadow:
    0 0 8px rgba(255,30,30,.7),
    0 0 22px rgba(255,30,30,.45),
    0 0 60px rgba(255,30,30,.25);
  animation: skull-pulse 4.2s ease-in-out infinite, skull-glitch 9s infinite;
}
/* no frame: every layer of the panel feathers to transparent well before
   the rect edge, so the skull floats on the page instead of sitting in a box */
#skull-mask {
  /* ~1.64× the old min(66vw, 760px); 100% caps it to the column */
  width: min(100%, 1246px);
  aspect-ratio: 920 / 500;
  margin: 0 auto;
  position: relative;
  overflow: hidden;
  isolation: isolate;
  background:
    radial-gradient(circle at 50% 46%, rgba(255,42,42,.11), transparent 34%),
    radial-gradient(ellipse 48% 58% at 50% 48%, rgba(0,0,0,.7), rgba(0,0,0,.28) 48%, transparent 78%);
  animation: skull-glitch 9s infinite;
}
#skull-mask::before {
  content: '';
  position: absolute; inset: 0;
  background:
    repeating-linear-gradient(0deg, rgba(255,255,255,.08) 0 1px, rgba(255,0,0,.045) 1px 3px, transparent 3px 6px),
    linear-gradient(90deg, transparent 0 18%, rgba(255,30,30,.08) 50%, transparent 82%);
  -webkit-mask: radial-gradient(ellipse 48% 56% at 50% 48%, #000 34%, rgba(0,0,0,.45) 56%, transparent 78%);
  mask: radial-gradient(ellipse 48% 56% at 50% 48%, #000 34%, rgba(0,0,0,.45) 56%, transparent 78%);
  mix-blend-mode: screen;
  opacity: .42;
  z-index: 3;
  pointer-events: none;
}

   a red phosphor gradient + live glyph noise shine THROUGH the mask, so
   the strokes themselves burn. No bitmap upscaling — crisp at any size. */

#skull-fill {
  position: absolute; inset: 0; z-index: 1;
  background:
    radial-gradient(ellipse 26% 24% at 42.8% 47.8%, rgba(255,190,190,.9), transparent 70%),
    radial-gradient(ellipse 26% 24% at 56.6% 48.6%, rgba(255,190,190,.9), transparent 70%),
    radial-gradient(ellipse 30% 26% at 49% 76%, rgba(255,140,140,.55), transparent 75%),
    radial-gradient(ellipse 72% 86% at 50% 42%, #ff2a2a 0%, #e51212 55%, #8c0606 100%);
  -webkit-mask: var(--skull-mask) center / contain no-repeat;
  mask: var(--skull-mask) center / contain no-repeat;
}
#skull-ascii {
  position: absolute; inset: 0; z-index: 2;
  color: rgba(255,225,225,.9);
  font-family: 'Share Tech Mono', monospace;
  font-size: clamp(11px, 1.28vw, 20px);
  line-height: .86;
  letter-spacing: 0;
  white-space: pre-wrap;
  word-break: break-all;
  overflow: hidden;
  mix-blend-mode: screen;
  opacity: .34;
  text-shadow: 0 0 6px rgba(255,20,20,.8);
  -webkit-mask: var(--skull-mask) center / contain no-repeat;
  mask: var(--skull-mask) center / contain no-repeat;
}
/* embers in the sockets — the part that stares back */
#skull-eyes {
  position: absolute; inset: 0; z-index: 4;
  pointer-events: none;
  background:
    radial-gradient(ellipse 4.6% 8.5% at 42.8% 47.8%,   rgba(255,255,255,.95), rgba(255,70,70,.85) 40%, transparent 75%),
    radial-gradient(ellipse 4.6% 8.5% at 56.6% 48.6%, rgba(255,255,255,.95), rgba(255,70,70,.85) 40%, transparent 75%);
  mix-blend-mode: screen;
  filter: blur(1px);
  animation: eye-burn 3.6s ease-in-out infinite;
}
@keyframes eye-burn {
  0%, 100% { opacity: .5; transform: scale(1); }
  42%      { opacity: 1;  transform: scale(1.03); }
  55%      { opacity: .8; transform: scale(1); }
}
#skull-ascii.fallback {
  inset: 0;
  display: grid;
  place-items: center;
  color: var(--r);
  font-size: clamp(10px, 1.1vw, 15px);
  line-height: 1;
  opacity: .95;
  -webkit-mask: none;
  mask: none;
}
@keyframes skull-pulse {
  0%, 100% { color: var(--r);  filter: brightness(1); }
  50% { color: #ff5f5f; filter: brightness(1.07); }
}
@keyframes skull-glitch {
  0%, 88%, 100% { filter: none; transform: none; }
  89% { filter: drop-shadow(-4px 0 #00ffff) drop-shadow(4px 0 #ff0000); transform: translateX(2px); }
  90% { filter: drop-shadow(4px 0 #00ffff) drop-shadow(-4px 0 #ff0000); transform: translateX(-2px) skewX(-1deg); }
  91% { filter: none; transform: none; }
  94% { filter: drop-shadow(-2px 0 #00ffff) drop-shadow(2px 0 #ff0000); }
  95% { filter: none; }
}

/* corner surveillance lens — must live directly under <body>: any ancestor
   with a filter/transform (e.g. #skull-wrap's drop-shadow) becomes the
   containing block for position:fixed and drags the eye out of the corner */
#hal-eye {
  position: fixed;
  top: clamp(10px, 1.6vw, 20px);
  left: clamp(10px, 1.6vw, 20px);
  right: auto;
  width: clamp(34px, 3.4vw, 52px);
  height: clamp(34px, 3.4vw, 52px);
  transform: none;
  border-radius: 50%;
  border: 1px solid rgba(255, 78, 78, .34);
  background:
    radial-gradient(circle at 42% 38%, rgba(255, 255, 255, .94) 0 4%, rgba(255, 168, 168, .82) 5% 10%, transparent 12%),
    radial-gradient(circle at 50% 52%, #ff4d4d 0 9%, #ba0808 18%, #3b0000 45%, #090000 70%),
    conic-gradient(from 18deg, rgba(255, 76, 76, .28), rgba(20, 0, 0, .72), rgba(255, 76, 76, .20), rgba(6, 0, 0, .9), rgba(255, 76, 76, .28));
  box-shadow:
    0 0 8px rgba(255, 42, 42, .42),
    0 0 24px rgba(255, 42, 42, .20),
    inset 0 0 7px rgba(255, 190, 190, .22),
    inset 0 0 18px rgba(0, 0, 0, .82);
  animation: eye-pulse 3.8s ease-in-out infinite;
  pointer-events: none;
  z-index: 9995;
  opacity: .86;
}
#hal-eye::before {
  content: '';
  position: absolute;
  inset: -7px;
  border-radius: 50%;
  border: 1px solid rgba(255, 42, 42, .18);
  background:
    linear-gradient(transparent 0 44%, rgba(255, 90, 90, .18) 45% 47%, transparent 48%),
    radial-gradient(circle, transparent 55%, rgba(0, 0, 0, .56) 72%);
  box-shadow:
    inset 0 0 18px rgba(255, 42, 42, .08),
    0 0 12px rgba(255, 42, 42, .12);
}
#hal-eye::after {
  content: '';
  position: absolute;
  inset: 26% 18%;
  border-radius: 50%;
  background: linear-gradient(120deg, rgba(255,255,255,.22), transparent 42%);
  transform: rotate(-18deg);
  mix-blend-mode: screen;
}
@keyframes eye-pulse {
  0%, 100% { opacity: .82; transform: scale(1); filter: brightness(.96); }
  45% { opacity: .94; transform: scale(1.025); filter: brightness(1.12); }
  47% { opacity: .56; transform: scale(.99); filter: brightness(.72); }
  50% { opacity: .9; transform: scale(1.015); filter: brightness(1.05); }
}

/* ════════ BANNER ════════ */
#banner {
  margin: 18px auto 0;
  color: var(--w);
  font-family: 'VT323', 'Share Tech Mono', monospace;
  font-size: clamp(20px, 2.6vw, 34px);
  letter-spacing: clamp(2px, 0.6vw, 8px);
  text-align: center;
  line-height: 1.05;
  text-shadow:
    0 0 8px #ff2a2a,
    0 0 24px rgba(255,42,42,.6),
    0 0 55px rgba(255,42,42,.35);
  animation: banner-flicker 5.5s infinite;
}
#banner .small {
  display: block;
  font-size: .54em;
  letter-spacing: clamp(4px, 1vw, 14px);
  color: var(--w2);
  margin-top: 6px;
}
@keyframes banner-flicker {
  0%, 8%, 10%, 90%, 92%, 100% { opacity: 1; }
  9%, 91% { opacity: .35; }
}

/* sub-banner / motto */
.motto {
  margin: 14px auto 0;
  text-align: center;
  color: var(--w2);
  font-size: .94em;
}
.motto .gold { color: var(--gold); }

/* ════════ PROMPT ════════ */
#inp-row {
  display: flex;
  align-items: baseline;
  margin-top: auto;
  padding: 18px clamp(8px, 2vw, 24px) 0;
  position: relative; cursor: text;
  border-top: 1px solid rgba(255,30,30,.28);
  justify-content: center;
  gap: 8px;
}
#prompt {
  color: var(--w);
  white-space: nowrap;
  font-size: 1.2em;
  text-shadow: 0 0 10px var(--eye);
}
#typed {
  color: var(--w);
  white-space: pre;
  font-size: 1.2em;
  text-shadow: 0 0 8px var(--eye);
  padding-left: 6px;
}
#cur {
  display: inline-block; color: var(--w); font-weight: bold;
  font-size: 1.2em;
  animation: cblink .85s steps(2,start) infinite;
  margin-left: -3px;
  text-shadow: 0 0 12px var(--eye);
}
@keyframes cblink { 0%,49% { opacity:1; } 50%,100% { opacity:0; } }
#cmd {
  position: absolute; inset: 0;
  background: transparent; border: none; outline: none;
  color: transparent; caret-color: transparent;
  font: inherit; padding: 0; margin: 0;
  text-align: center;
}

/* ════════ LOOT SIDEBAR (MC style) ════════ */
#loot {
  background: linear-gradient(180deg, rgba(70,2,2,.45), rgba(40,0,0,.6));
  border-left: 1px solid rgba(255,30,30,.32);
  padding: 14px 14px;
  display: flex; flex-direction: column;
  font-family: 'Share Tech Mono','VT323',monospace;
  font-size: 12.5px;
  overflow: hidden;
}
#loot h2 {
  font-weight: normal;
  color: var(--w);
  font-size: 13px;
  letter-spacing: 2px;
  border-bottom: 1px solid rgba(255,30,30,.4);
  padding-bottom: 6px;
  margin-bottom: 8px;
  text-shadow: 0 0 8px var(--eye);
}
#loot .sub { font-size: 10.5px; color: var(--w2); letter-spacing: 1px; }
#loot-list {
  flex: 1;
  overflow-y: auto;
  padding-right: 4px;
}
#loot-list::-webkit-scrollbar { width:3px; }
#loot-list::-webkit-scrollbar-track { background: transparent; }
#loot-list::-webkit-scrollbar-thumb { background: var(--r3); }
.loot-item {
  display: flex;
  justify-content: space-between;
  gap: 6px;
  padding: 2px 0;
  border-bottom: 1px dotted rgba(255,30,30,.16);
  color: var(--r2);
  text-shadow: 0 0 4px rgba(255,30,30,.3);
}
.loot-item .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex:1; }
.loot-item .sz { color: var(--w2); font-size: 11px; flex-shrink:0; }
.loot-item.new {
  animation: loot-flash 1.2s ease-out;
}
@keyframes loot-flash {
  0% { background: rgba(255,30,30,.5); color: #fff; }
  100% { background: transparent; color: var(--r2); }
}

#loot-footer {
  border-top: 1px solid rgba(255,30,30,.4);
  padding-top: 8px;
  margin-top: 8px;
  font-size: 11px;
  color: var(--w2);
  text-align: center;
}
#loot-footer .gold { color: var(--gold); }

/* big "OBEY" reply */
.obey-reply {
  display: inline-block;
  font-family: 'VT323','Share Tech Mono',monospace;
  font-size: clamp(40px, 7vw, 90px);
  letter-spacing: clamp(6px, 1.4vw, 20px);
  color: var(--r);
  text-shadow:
    0 0 10px var(--eye),
    0 0 30px var(--eye),
    0 0 70px rgba(255,30,30,.6);
  margin: 14px 0;
  animation: obey-pulse .6s ease-out 3;
}
@keyframes obey-pulse {
  0% { transform: scale(.92); opacity: 0; }
  40% { transform: scale(1.04); opacity: 1; }
  100% { transform: scale(1); opacity: 1; }
}

/* incoming mojibake noise (resolves into skull) */
.noise {
  font-family: 'VT323','Share Tech Mono',monospace;
  color: var(--r3);
  font-size: 14px;
  line-height: 1.05;
  text-align: center;
  word-break: break-all;

  const remaining = LOOT_POOL.slice(lootIdx);
  const pick = remaining[Math.floor(Math.random() * remaining.length)];
  const idx = LOOT_POOL.indexOf(pick);
  // swap to front
  [LOOT_POOL[lootIdx], LOOT_POOL[idx]] = [LOOT_POOL[idx], LOOT_POOL[lootIdx]];
  lootIdx++;

  const row = document.createElement('div');
  row.className = 'loot-item new';
  row.innerHTML = `<span class="name">▣ ${pick.name}</span><span class="sz">${pick.sz}</span>`;
  lootList.appendChild(row);
  lootList.scrollTop = lootList.scrollHeight;
  setTimeout(() => row.classList.remove('new'), 1200);

  lootTotalGB += parseSize(pick.sz);
  lootTot.textContent = (lootTotalGB < 1 ? (lootTotalGB * 1024).toFixed(1) + ' MB' : lootTotalGB.toFixed(1) + ' GB');
}

let lootTimer = null;
function startLootStream() {
  // Burst the first 6 quickly to set the tone
  for (let i = 0; i < 6; i++) setTimeout(pushLoot, 200 + i * 220);
  // Then a steady drip
  lootTimer = setInterval(() => {
    if (lootIdx >= LOOT_POOL.length) { clearInterval(lootTimer); return; }
    pushLoot();
  }, 1700);
}

// ════════════════════════════════════════════════════════════════════
// PROMPT - final consent uses a Unix-style y/N confirmation
// Refusing isn't a dead end — LivSeg answers, the prompt stays open, and the
// line gets colder each time. A "no" that gets replied to makes the eventual
// "y" feel like a real decision rather than the only button on the screen.
const REFUSAL_LINES = [
  'the door stays open. we already have everything — saying no changes nothing.',
  'no is fine. your data still leaves on the date. you just won\'t be on the right side of it.',
  'last time we ask. after that there is no "join". only "was warned".',
];
let revealShown = false;
let refusals = 0;
cmdEl.addEventListener('keydown', async (e) => {
  if (revealShown) { e.preventDefault(); return; }
  if (e.key !== 'Enter') return;
  const raw = cmdEl.value.trim().toLowerCase();
  setCmd('');
  if (raw === '' || !replyZone) return;   // bare Enter: don't punish, just re-prompt

  const ok = YES_VALUES.has(raw);
  const no = NO_VALUES.has(raw);
  const wrap = document.createElement('div');
  wrap.style.cssText = 'text-align:center; padding: 6px 0;';
  wrap.innerHTML = '<div class="obey-reply">' + (ok ? 'JOIN' : (no ? 'NO' : 'RESIST')) + '</div>';
  replyZone.replaceChildren(wrap);
  replyZone.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  flash();

  if (ok && !revealShown) {
    revealShown = true;
    lockInput();
    await revealEnd();
    return;
  }
  if (!revealShown) {
    const line = REFUSAL_LINES[Math.min(refusals, REFUSAL_LINES.length - 1)];
    refusals++;
    const d = document.createElement('div');
    d.style.cssText = 'text-align:center; color:#ff9b9b; font-family:VT323,monospace; font-size:clamp(15px,1.8vw,22px); letter-spacing:1.5px; margin:2px auto 16px; max-width:60ch; text-shadow:0 0 12px rgba(255,42,42,.45);';
    d.textContent = '// livseg: ' + line;
    replyZone.appendChild(d);
  }
});

function lockInput() {
  cmdEl.disabled = true;
  cmdEl.blur();
  document.getElementById('inp-row').style.display = 'none';
}

function flash() {
  const f = document.createElement('div');
  f.style.cssText = 'position:fixed;inset:0;background:rgba(255,30,30,.25);pointer-events:none;z-index:9999';
  document.body.appendChild(f);
  setTimeout(() => f.style.background = 'rgba(255,30,30,.55)', 30);
  setTimeout(() => f.style.background = 'rgba(0,0,0,.6)', 70);
  setTimeout(() => f.remove(), 140);
}

async function fetchReveal() {
  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ server: 'node083', raw: RESISTANCE_COMMAND, state: { cwd: '/root', prevCwd: '/root' } })
    });
    const payload = await res.json();
    const output = String(payload.output || '');
    const lines = output.split('\n').filter(Boolean);
    const dateLine = lines.find(line => line.includes('at this date')) || '';
    const date = dateLine.replace(/^.*at this date\s*/i, '').trim() || FALLBACK_REVEAL_DATE;
    return { output, date };
  } catch {
    return {
      output: 'we got all your data, it\'s "safe" with us',
      date: FALLBACK_REVEAL_DATE
    };
  }
}

async function revealEnd() {
  await sleep(400);
  const reveal = await fetchReveal();
  const e = document.createElement('div');
  e.style.cssText = 'text-align:center; margin: 24px auto; padding: 18px;';
  const safeLine = escapeHTML(reveal.output.split('\n')[0] || 'good.');
  e.innerHTML =
    '<div style="font-family:VT323,monospace; font-size:clamp(28px,4vw,52px); letter-spacing:6px; color:#fff; text-shadow:0 0 10px #ff2a2a, 0 0 28px #ff2a2a;">' + safeLine + '</div>' +
    '<div style="font-family:VT323,monospace; font-size:clamp(46px,8vw,96px); letter-spacing:8px; color:#ff2a2a; text-shadow:0 0 18px #ff2a2a, 0 0 50px #ff2a2a; margin: 14px 0;">' + escapeHTML(reveal.date) + '</div>' +
    '<div style="font-family:VT323,monospace; color:#ff8d8d; font-size:clamp(18px,2.4vw,32px); letter-spacing:5px; text-shadow:0 0 14px rgba(255,42,42,.65);">the clock is set &#9656; tell no one &#9656; we were never here</div>';
  replyZone.replaceChildren(e);
  replyZone.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function escapeHTML(s) {
  return String(s).replace(/[&<>"]/g, ch => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[ch]));
}
// boot
bootSequence();
</script>
