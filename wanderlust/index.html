<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Wanderlust — Anton Veselskyi</title>
  <meta name="description" content="A travel history visualization — pins, arcs and a morphing flat/globe world map." />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Megrim&family=Major+Mono+Display&family=Jura:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="wanderlust.css?v=205" />
  <link rel="shortcut icon" type="image/x-icon" href="../img/favicon.ico" />

  <!-- mapping libs (CDN, like the existing GSAP usage) -->
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <script src="https://cdn.jsdelivr.net/npm/d3-geo-projection@4"></script>
  <script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>
  <script src="https://cdn.jsdelivr.net/npm/versor@0.2.0"></script>
</head>

<body class="wl-panels-collapsed">
  <!-- AV monogram — signature mark, links home -->
  <a class="av-monogram" href="https://antonveselskyi.com" target="_blank" rel="noopener" aria-label="Anton Veselskyi">
    <span>A</span><span>V</span>
  </a>

  <h1 class="wl-title">wanderlust</h1>

  <!-- the morphing map (svg built by JS) -->
  <div id="wl-map"></div>

  <!-- pin overlay (HTML, positioned by JS) -->
  <div id="wl-pins"></div>

  <!-- hover / tap popup -->
  <div id="wl-popup" role="dialog" aria-label="Place details"></div>

  <!-- audio attribution -->
  <button id="wl-info-btn" type="button" aria-label="Audio credits" aria-expanded="false" aria-controls="wl-info-panel">i</button>
  <section id="wl-info-panel" aria-label="Audio credits" hidden>
    <button id="wl-info-close" type="button" aria-label="Close audio credits">×</button>
    <h2>audio credits</h2>
    <p>recorded greetings are reused from public pronunciation archives and phrasebooks.</p>
    <div id="wl-audio-credits"></div>
  </section>

  <!-- travel stats -->
  <section id="wl-stats-panel" aria-label="Travel stats" hidden>
    <button id="wl-stats-close" type="button" aria-label="Close stats">×</button>
    <div class="wl-stats-wordmark">wanderlust</div>
    <h2>stats</h2>
    <div id="wl-stats-content"></div>
  </section>

  <section id="wl-countries-panel" aria-label="Countries visited" hidden>
    <button id="wl-countries-close" type="button" aria-label="Close countries visited">×</button>
    <h2>countries</h2>
    <div id="wl-countries-list"></div>
  </section>

  <section id="wl-cities-panel" aria-label="Cities visited" hidden>
    <button id="wl-cities-close" type="button" aria-label="Close cities visited">×</button>
    <h2>cities</h2>
    <div id="wl-cities-list"></div>
  </section>

  <section id="wl-europe-panel" aria-label="Europe checklist" hidden>
    <button id="wl-europe-close" type="button" aria-label="Close Europe checklist">×</button>
    <h2>Europe</h2>
    <div id="wl-europe-checklist"></div>
  </section>

  <!-- country context + travel filters (bottom-left) -->
  <div id="wl-left-ui">
    <aside id="wl-country-info" aria-label="Country info" aria-live="polite">
      <div class="ci-empty">hover a pin or focus a country</div>
    </aside>

    <button id="wl-collapse-toggle" type="button"
            aria-label="Toggle travels panel" aria-expanded="false"
            aria-controls="wl-filters wl-controls">A</button>

    <aside id="wl-filters" aria-label="Travel filters">
      <h2 id="wl-filters-title">travels</h2>
      <div id="wl-legend-years" class="legend-years"></div>
    </aside>
  </div>

  <!-- controls (bottom-right) -->
  <aside id="wl-controls" aria-label="Controls">
    <div class="legend-controls">
      <label class="wl-toggle">
        <span id="wl-arcs-label">show arcs</span>
        <input type="checkbox" id="wl-arcs-toggle" checked />
        <span class="wl-switch" aria-hidden="true"></span>
      </label>
      <label class="wl-toggle">
        <span id="wl-pins-label">show pins</span>
        <input type="checkbox" id="wl-pins-toggle" checked />
        <span class="wl-switch" aria-hidden="true"></span>
      </label>
      <label class="wl-toggle">
        <span id="wl-city-labels-label">city names</span>
        <input type="checkbox" id="wl-city-labels-toggle" checked />
        <span class="wl-switch" aria-hidden="true"></span>
      </label>
      <button class="wl-btn ghost" id="wl-stats-btn" type="button" aria-expanded="false" aria-controls="wl-stats-panel">stats</button>
      <button class="wl-btn ghost" id="wl-timeline-btn" type="button">⧗ timeline</button>
      <button class="wl-btn ghost" id="wl-globe-btn" type="button">◉ globe</button>
      <button class="wl-btn ghost" id="wl-reset-btn" type="button">⟳ reset view</button>
      <button class="wl-btn ghost" id="wl-measure-btn" type="button">⟂ measure</button>
      <button class="wl-btn ghost" id="wl-lang-btn" type="button">УКР</button>
      <button class="wl-btn" id="wl-play-btn" type="button">▶ play the journey</button>
    </div>
  </aside>

  <!-- manual timeline scrubber (hidden until activated) -->
  <div id="wl-timeline">
    <button id="wl-timeline-close" aria-label="Close timeline">×</button>
    <div class="wl-timeline-actions" aria-label="Timeline playback">
      <button id="wl-timeline-play" type="button">play</button>
      <button id="wl-timeline-speed" type="button" aria-label="Playback speed">x1</button>
    </div>
    <div id="wl-timeline-label">Lviv — the beginning</div>
    <input type="range" id="wl-timeline-range" min="0" value="0" step="1" />
  </div>

  <div id="wl-hint">flat ⇄ globe · play the journey</div>

  <script defer src="wanderlust-data.js?v=205"></script>
  <script defer src="wanderlust-detail.js?v=205"></script>
  <script defer src="wanderlust.js?v=205"></script>
</body>
</html>
